d:[["حق الله","حق الله أن يعبد وحده، ووعد من حقق ذلك بالأجر العظيم. والتوحيد أساس الدين، به تقبل الأعمال."],
["الإخلاص","العمل الواحد قد يكون عبادة عظيمة أو يكون بلا أجر حسب النية. من تصدق ليرضي الله أجر، ومن تصدق ليقال عنه كريم فلا أجر له. لذلك نجدد النية في كل عمل."],
["ثمرات التوحيد والإخلاص","تحرر الإنسان من الخوف من غير الله، والثبات، وراحة القلب لأنه لا ينتظر مدح الناس، وقبول الأعمال عند الله."]],
wx:[["كيف تجعل مراجعتك لدروسك عملا خالصا لله؟",["أنوي بها طلب العلم النافع لي ولأمتي.","لا أقصد التفاخر على زملائي.","وأتقنها وأشكر الله على التوفيق."]]]},

/*5*/{t:"الإتقان عبادة وعملا (الحكمة)",
k:["<b>الإتقان</b>: أداء العمل على أحسن وجه وأكمله.","قال تعالى: ﴿صنع الله الذي <b>أتقن كل شيء</b>﴾ (النمل 88).","قال النبي ﷺ: «<b>إن الله يحب إذا عمل أحدكم عملا أن يتقنه</b>».","الإتقان في <b>العبادة</b>: أداء الصلاة بخشوع وطمأنينة، والوضوء كاملا.","الإتقان في <b>العمل</b>: التلميذ في دراسته، والصانع في صنعته، والموظف في وظيفته.","من ثمراته: رضى الله، النجاح، ثقة الناس، تقدم المجتمع."],
w:[["الإتقان","أداء العمل على أحسن وجه"],["الخشوع","حضور القلب في العبادة"],["الطمأنينة","السكون وعدم العجلة في الصلاة"],["الأمانة","أداء الحقوق كاملة"]],
x:[["q","الإتقان هو:",["أداء العمل على أحسن وجه","السرعة في العمل فقط"],0,"تعريف."],
["q","«إن الله يحب إذا عمل أحدكم عملا…»:",["أن يتقنه","أن يسرع فيه","أن يتركه"],0,"حديث شريف."],
["vf","الإتقان مطلوب في العبادة والعمل معا.",true,"عنوان الدرس."],
["q","من مظاهر الإتقان عند التلميذ:",["كتابة الواجب بعناية","نقل الواجب من زميله"],0,"الإتقان أمانة."]],
d:[["الإتقان في خلق الله","كل ما خلقه الله متقن: نظام الكون، جسم الإنسان، الطبيعة. والمسلم يقتدي بهذه الصفة في أعماله."],
["الإتقان في العبادة","الصلاة المتقنة: وضوء كامل، خشوع، طمأنينة في الركوع والسجود. وقد رأى النبي ﷺ رجلا يصلي بسرعة فقال له: «ارجع فصل فإنك لم تصل»."],
["الإتقان في العمل","الإتقان صفة الأمم المتقدمة. الصانع المتقن يكسب ثقة الزبائن، والطبيب المتقن ينقذ الأرواح، والتلميذ المتقن ينجح. وعكس الإتقان الغش والتهاون."]],
wx:[["كيف يكون الإتقان في واجب منزلي؟",["أقرأ السؤال جيدا وأفهمه.","أنجز الجواب بعناية وخط واضح.","أراجع عملي قبل تقديمه."]]]},

/* ===== المرحلة 2 ===== */
/*6*/{s:"الأسدوس الأول — المرحلة 2",t:"سورة ق: الآيات 16 إلى 37 (التزكية)",
k:["﴿ولقد خلقنا الإنسان ونعلم ما توسوس به نفسه ونحن <b>أقرب إليه من حبل الوريد</b>﴾: الله يعلم كل شيء.","يكتب أعمال الإنسان ملكان: ﴿ما يلفظ من قول إلا لديه <b>رقيب عتيد</b>﴾.","تصف الآيات <b>سكرة الموت</b>، ثم <b>النفخ في الصور</b>، ومجيء كل نفس معها سائق وشهيد.","تصف مشهد جهنم: ﴿يوم نقول لجهنم هل امتلأت وتقول هل من مزيد﴾.","وتصف الجنة التي تقرب للمتقين: لكل <b>أواب حفيظ</b>.","﴿إن في ذلك لذكرى لمن كان له قلب أو ألقى السمع وهو شهيد﴾."],
w:[["حبل الوريد","عرق في العنق"],["رقيب عتيد","ملك حاضر يراقب ويكتب"],["سكرة الموت","شدة الموت"],["أواب","كثير الرجوع إلى الله"],["حفيظ","حافظ لحدود الله"]],
x:[["q","«رقيب عتيد» هو:",["ملك يكتب الأعمال","شيطان","إنسان"],0,"يراقب ويكتب كل قول."],
["q","«أقرب إليه من حبل الوريد» يدل على:",["علم الله بكل شيء","بعد الله عن عباده"],0,"الله يعلم حتى الوسوسة."],
["vf","كل قول يقوله الإنسان يكتب.",true,"ما يلفظ من قول إلا لديه رقيب عتيد."],
["q","«أواب» معناها:",["كثير الرجوع إلى الله","كثير النوم"],0,"راجع الكلمات."]],
d:[["المراقبة","تقرر الآيات أن الله يعلم ما في النفس، وأن ملكين يكتبان الأقوال والأفعال. هذا يدفع المؤمن إلى مراقبة لسانه وأعماله."],
["مشاهد الآخرة","الموت حق، ثم ينفخ في الصور فيبعث الناس، ويأتي كل إنسان ومعه ملك يسوقه وملك يشهد عليه. ثم يكون الجزاء: جهنم للمكذبين والجنة للمتقين."],
["صفات أهل الجنة","الأواب الذي يتوب ويرجع إلى الله، الحفيظ لأوامر الله، الذي يخشى الرحمن بالغيب، ويأتي بقلب منيب."]],
wx:[["كيف تؤثر آية «ما يلفظ من قول إلا لديه رقيب عتيد» في سلوكك؟",["أعلم أن كل كلمة أقولها تكتب.","فأتجنب الكذب والسب والغيبة.","وأكثر من الكلام الطيب."]]]},

/*7*/{t:"أركان الإيمان: حديث جبريل (التزكية)",
k:["روى مسلم عن عمر رضي الله عنه أن جبريل جاء في صورة رجل وسأل النبي ﷺ عن الإسلام والإيمان والإحسان والساعة.","<b>الإيمان</b>: «أن تؤمن <b>بالله</b> و<b>ملائكته</b> و<b>كتبه</b> و<b>رسله</b> و<b>اليوم الآخر</b> وتؤمن <b>بالقدر</b> خيره وشره».","أركان الإيمان <b>ستة</b>.","<b>الإحسان</b>: «أن تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك».","عن <b>الساعة</b> قال النبي ﷺ: «ما المسؤول عنها بأعلم من السائل»، وذكر بعض علاماتها.","الدين ثلاث مراتب: <b>الإسلام</b>، <b>الإيمان</b>، <b>الإحسان</b>."],
w:[["الإيمان","التصديق بالقلب والإقرار باللسان والعمل بالجوارح"],["الإحسان","أن تعبد الله كأنك تراه"],["القدر","علم الله بما سيكون وتقديره له"],["الساعة","يوم القيامة"]],
x:[["q","عدد أركان الإيمان:",["ستة","خمسة","أربعة"],0,"الله، الملائكة، الكتب، الرسل، اليوم الآخر، القدر."],
["q","«أن تعبد الله كأنك تراه» تعريف:",["الإحسان","الإسلام","الإيمان"],0,"أعلى المراتب."],
["o","رتب أركان الإيمان كما في الحديث.",["الإيمان بالله","الملائكة","الكتب","الرسل","اليوم الآخر","القدر"],"حسب الحديث."],
["vf","جاء جبريل في صورة رجل.",true,"شديد بياض الثياب شديد سواد الشعر."],
["q","مراتب الدين:",["الإسلام، الإيمان، الإحسان","الصلاة، الصوم، الحج"],0,"ثلاث مراتب."]],
d:[["قصة الحديث","بينما الصحابة جالسون عند النبي ﷺ، دخل رجل لا يعرفه أحد ولا يرى عليه أثر السفر، فجلس أمام النبي ﷺ وسأله. وبعد أن ذهب قال النبي ﷺ: «فإنه جبريل أتاكم يعلمكم دينكم». فهو درس نموذجي بطريقة السؤال والجواب."],
["أركان الإيمان","الإيمان بالله الواحد. بالملائكة: مخلوقات من نور لا يعصون الله. بالكتب: التوراة، الزبور، الإنجيل، القرآن. بالرسل: أولهم نوح وخاتمهم محمد ﷺ. باليوم الآخر: البعث والحساب والجزاء. بالقدر: أن كل شيء بعلم الله وتقديره، مع العمل والأخذ بالأسباب."],
["الإحسان","أعلى درجات الدين: أن تستحضر أن الله يراك في كل وقت، فتتقن عبادتك وتبتعد عن المعاصي حتى إن لم يرك أحد."]],
wx:[["ما المراتب الثلاث للدين في حديث جبريل؟",["الإسلام: الأعمال الظاهرة (الأركان الخمسة).","الإيمان: الاعتقاد بالقلب (الأركان الستة).","الإحسان: أن تعبد الله كأنك تراه."]]]},

/*8*/{t:"ثبات الرسول ﷺ (الاقتداء)",
k:["بعد الجهر بالدعوة، واجهت قريش النبي ﷺ بأساليب متعددة: <b>السخرية</b>، <b>الاتهام</b> (ساحر، شاعر، مجنون)، و<b>الإيذاء</b>.","حاولت قريش <b>الإغراء</b>: عرضوا عليه المال والملك والزواج مقابل ترك الدعوة.","ذهبت قريش إلى عمه <b>أبي طالب</b> تطلب أن يمنعه.","في الرواية المشهورة قال النبي ﷺ: «والله يا عم لو وضعوا الشمس في يميني والقمر في يساري على أن أترك هذا الأمر، ما تركته حتى يظهره الله أو أهلك فيه».","ثبت النبي ﷺ على الحق رغم كل الضغوط.","نتعلم: <b>الثبات</b> على المبادئ، والصبر، وعدم بيع القيم بالمال."],
w:[["الثبات","البقاء على الحق رغم الصعاب"],["الإغراء","تقديم المغريات للتخلي عن شيء"],["الإيذاء","إلحاق الضرر بالآخرين"],["المبادئ","القيم الأساسية التي يؤمن بها الإنسان"]],
x:[["q","عرضت قريش على النبي ﷺ:",["المال والملك","الحرب فقط"],0,"إغراء مقابل ترك الدعوة."],
["q","ذهبت قريش إلى عم النبي ﷺ:",["أبي طالب","أبي لهب","العباس"],0,"الذي كان يحميه."],
["vf","قبل النبي ﷺ عرض قريش.",false,"رفض وثبت على الحق."],
["q","من الدروس:",["الثبات على المبادئ","التخلي عن الحق مقابل المال"],0,"الاقتداء بالنبي ﷺ."]],
d:[["أساليب قريش","حاولت قريش إيقاف الدعوة بالسخرية والتكذيب، ثم بالتعذيب، ثم بالإغراء: قالوا إن كنت تريد مالا جمعنا لك حتى تكون أغنانا، وإن كنت تريد ملكا ملكناك علينا."],
["موقف النبي ﷺ","رد النبي ﷺ بأنه لا يريد مالا ولا ملكا، وإنما يبلغ رسالة ربه. وقرأ عليهم آيات من القرآن. فلما ضغطوا على أبي طالب، أعلن النبي ﷺ ثباته التام."],
["الاقتداء","التلميذ يواجه أحيانا ضغطا من بعض الأصدقاء ليغش أو يدخن أو يترك الصلاة. الثابت على مبادئه يرفض بأدب ولا يتنازل عن قيمه."]],
wx:[["أصدقاؤك يضغطون عليك لتغش في الامتحان. كيف تقتدي بثبات النبي ﷺ؟",["أتذكر أن الغش حرام وظلم.","أرفض بأدب ولا أتنازل عن مبدئي.","وأعتمد على مراجعتي وأدعو الله بالتوفيق."]]]},

/*9*/{t:"الطهارة: أنواعها ومقاصدها (الاستجابة)",
k:["<b>الطهارة</b> نوعان: <b>معنوية</b> (طهارة القلب من الشرك والحسد والكبر) و<b>حسية</b> (طهارة البدن واللباس والمكان).","الطهارة الحسية: من <b>الخبث</b> (النجاسة) تزال بالماء، ومن <b>الحدث</b>: الأصغر بالوضوء، والأكبر بالغسل.","فرائض الوضوء (عند المالكية) <b>سبع</b>: <b>النية</b>، غسل <b>الوجه</b>، غسل <b>اليدين إلى المرفقين</b>، <b>مسح الرأس</b>، غسل <b>الرجلين إلى الكعبين</b>، <b>الدلك</b>، <b>الفور</b> (الموالاة).","من سنن الوضوء: غسل اليدين إلى الكوعين في البداية، المضمضة، الاستنشاق، الاستنثار، مسح الأذنين، الترتيب.","<b>التيمم</b> بالصعيد الطاهر عند فقد الماء أو العجز عن استعماله.","مقاصد الطهارة: النظافة، الصحة، الاستعداد للعبادة: ﴿إن الله يحب التوابين ويحب المتطهرين﴾."],
w:[["الحدث","حالة تمنع من الصلاة حتى يتوضأ أو يغتسل"],["الخبث","النجاسة"],["الدلك","إمرار اليد على العضو مع الماء"],["الفور","المتابعة دون انقطاع طويل"],["التيمم","طهارة بالتراب الطاهر عند فقد الماء"]],
x:[["q","عدد فرائض الوضوء عند المالكية:",["سبع","خمس","عشر"],0,"النية، الوجه، اليدان، الرأس، الرجلان، الدلك، الفور."],
["q","الحدث الأكبر يرفع بـ:",["الغسل","الوضوء","التيمم دائما"],0,"الأصغر بالوضوء."],
["q","المضمضة في الوضوء:",["سنة","فريضة"],0,"من السنن."],
["vf","التيمم يكون عند فقد الماء أو العجز عن استعماله.",true,"بالصعيد الطاهر."],
["m","اربط.",[["الطهارة المعنوية","طهارة القلب من الحسد"],["الطهارة من الخبث","إزالة النجاسة"],["الطهارة من الحدث","الوضوء أو الغسل"]],"أنواع الطهارة."]],
d:[["أنواع الطهارة","الإسلام يهتم بطهارة الظاهر والباطن. طهارة القلب: الإخلاص وسلامة الصدر. طهارة البدن والثياب والمكان: شرط لصحة الصلاة."],
["كيفية الوضوء","أنوي، أغسل يدي إلى الكوعين ثلاثا، أتمضمض وأستنشق وأستنثر، أغسل وجهي، ثم يدي إلى المرفقين اليمنى ثم اليسرى، أمسح رأسي ثم أذني، أغسل رجلي إلى الكعبين، مع الدلك ودون انقطاع طويل."],
["مقاصد الطهارة","الطهارة تحمي من الأمراض، وتمنح النشاط، وتجعل المسلم مستعدا للوقوف بين يدي الله. قال النبي ﷺ: «الطهور شطر الإيمان» (رواه مسلم)."]],
wx:[["تلميذ نسي مسح رأسه في الوضوء ثم صلى. ما حكم صلاته؟",["مسح الرأس فريضة من فرائض الوضوء.","ترك الفريضة يبطل الوضوء.","فعليه أن يعيد الوضوء والصلاة."]]]},

/*10*/{t:"حق النفس: الحفظ والرعاية (القسط)",
k:["النفس <b>أمانة</b> عند الإنسان، ومن حقها عليه أن <b>يحفظها</b> و<b>يرعاها</b>.","<b>الحفظ</b>: حمايتها من الهلاك والأذى: ﴿ولا تلقوا بأيديكم إلى التهلكة﴾، ﴿ولا تقتلوا أنفسكم﴾.","يحرم كل ما يضر النفس: المخدرات، التدخين، المخاطرة المتهورة.","<b>الرعاية الجسدية</b>: الغذاء المتوازن، النظافة، الرياضة، النوم الكافي، العلاج عند المرض.","<b>الرعاية المعنوية</b>: طلب العلم، الأخلاق الحسنة، العبادة، الصحبة الصالحة.","قال النبي ﷺ: «<b>إن لجسدك عليك حقا</b>»."],
w:[["الأمانة","ما يُعطى للإنسان ليحافظ عليه"],["التهلكة","ما يؤدي إلى الهلاك"],["الرعاية","العناية والاهتمام"],["المخدرات","مواد تضر العقل والجسم"]],
x:[["q","من حفظ النفس:",["الابتعاد عن المخدرات","السهر الدائم دون نوم"],0,"المخدرات تهلك النفس."],
["q","«إن لجسدك عليك حقا» تعني:",["العناية بالجسم واجبة","إهمال الجسم"],0,"حديث شريف."],
["vf","طلب العلم من رعاية النفس المعنوية.",true,"العقل يحتاج إلى غذاء."],

d:[["النفس أمانة","الإنسان لا يملك نفسه ملكا مطلقا، بل هي أمانة من الله. لذلك حرم الإسلام الانتحار وإيذاء النفس، وأمر بالعلاج والوقاية."],
["الرعاية الجسدية","نأكل باعتدال: ﴿وكلوا واشربوا ولا تسرفوا﴾، ونحافظ على النظافة، ونمارس الرياضة، وننام مبكرا، ونستشير الطبيب عند المرض."],
["الرعاية المعنوية","القلب والعقل يحتاجان إلى الغذاء أيضا: العلم النافع، ذكر الله، الأصدقاء الصالحون، الابتعاد عن المشاهد السيئة. والتوازن بين الدراسة والراحة والعبادة."]],
wx:[["اقترح برنامجا يحفظ فيه التلميذ حق نفسه.",["نوم مبكر 8 ساعات تقريبا.","فطور صحي ورياضة ثلاث مرات في الأسبوع.","وقت للمراجعة، ووقت للصلاة وقراءة القرآن."]]]},

/*11*/{t:"التعامل الإيجابي مع وسائل الاتصال الحديثة (الحكمة)",
k:["وسائل الاتصال الحديثة: <b>الهاتف الذكي</b>، <b>الأنترنت</b>، <b>مواقع التواصل الاجتماعي</b>، التلفاز.","إيجابياتها: <b>التعلم</b>، البحث عن المعلومات، التواصل مع الأهل، تسهيل الخدمات.","سلبياتها: <b>الإدمان</b>، إضاعة الوقت، المحتوى الضار، <b>التنمر الإلكتروني</b>، الإشاعات، العزلة.","ضوابط الاستعمال: <b>التثبت</b> من الأخبار قبل نشرها: ﴿إن جاءكم فاسق بنبإ فتبينوا﴾.","احترام <b>خصوصية</b> الآخرين، وعدم نشر صورهم دون إذن، والكلام الطيب.","تنظيم <b>الوقت</b>: «نعمتان مغبون فيهما كثير من الناس: الصحة والفراغ» (رواه البخاري)."],
w:[["الإدمان","التعلق الشديد الذي يصعب تركه"],["الإشاعة","خبر غير مؤكد ينتشر بين الناس"],["الخصوصية","ما يخص الإنسان ولا يحق للآخرين الاطلاع عليه"],["التنمر الإلكتروني","إيذاء الآخرين عبر الأنترنت"]],
x:[["q","قبل نشر خبر على مواقع التواصل يجب:",["التثبت منه","نشره بسرعة"],0,"فتبينوا."],
["q","من سلبيات الاستعمال المفرط للهاتف:",["إضاعة الوقت","التعلم"],0,"الإدمان."],
["vf","نشر صورة زميل دون إذنه سلوك جائز.",false,"فيه اعتداء على خصوصيته."],
["q","«نعمتان مغبون فيهما كثير من الناس»:",["الصحة والفراغ","المال والأولاد"],0,"رواه البخاري."]],
d:[["نعمة يجب حسن استعمالها","وسائل الاتصال أداة، يمكن أن تكون نافعة أو ضارة حسب طريقة استعمالها. المسلم يستعملها في الخير: التعلم، صلة الرحم، نشر المعرفة."],
["مخاطر يجب الحذر منها","قضاء ساعات طويلة أمام الشاشة يضر بالعين والنوم والدراسة. ونشر الإشاعات قد يظلم الناس. والتنمر الإلكتروني يؤذي الآخرين نفسيا. ويجب عدم مشاركة المعلومات الشخصية مع الغرباء."],
["قواعد ذهبية","أحدد وقتا للاستعمال، أتحقق قبل النشر، لا أقول على الأنترنت ما لا أقوله أمام الناس، أحترم الخصوصية، وأخبر والدي إذا تعرضت لشيء مقلق."]],
wx:[["وصلتك رسالة فيها خبر مثير عن شخص. ماذا تفعل؟",["لا أنشرها قبل التأكد.","أبحث عن مصدر موثوق.","إن كانت كاذبة أحذفها، لأن نشرها ظلم."]]]},

/*12*/{t:"سورة ق: الآيات 38 إلى 45 (التزكية)",
k:["﴿ولقد خلقنا السماوات والأرض وما بينهما في ستة أيام وما مسنا من <b>لغوب</b>﴾: لا يتعب الله.","يأمر الله نبيه بـ<b>الصبر</b> على أقوال المكذبين، و<b>التسبيح</b> قبل طلوع الشمس وقبل الغروب وفي الليل.","﴿يوم يسمعون <b>الصيحة</b> بالحق ذلك يوم <b>الخروج</b>﴾: يوم البعث.","﴿إنا نحن نحيي ونميت وإلينا المصير﴾.","مهمة النبي ﷺ <b>التذكير</b> لا الإجبار: ﴿وما أنت عليهم بجبار﴾.","﴿فذكر بالقرآن من يخاف وعيد﴾ (آخر آية في السورة)."],
w:[["لغوب","تعب"],["الصيحة","النفخة الثانية في الصور"],["يوم الخروج","يوم خروج الناس من القبور"],["جبار","من يجبر الناس ويكرههم"]],
x:[["q","«وما مسنا من لغوب» أي:",["ما أصابنا تعب","ما أصابنا فرح"],0,"اللغوب: التعب."],
["q","«يوم الخروج» هو:",["يوم البعث","يوم العيد"],0,"خروج الناس من القبور."],
["vf","أمر الله نبيه بالصبر والتسبيح.",true,"فاصبر على ما يقولون وسبح بحمد ربك."],
["q","آخر آية في سورة ق:",["فذكر بالقرآن من يخاف وعيد","ق والقرآن المجيد"],0,"الآية 45."]],
d:[["قدرة الله المطلقة","خلق الله السماوات والأرض العظيمة دون تعب، فإعادة الإنسان أهون عليه. وهذا رد على المنكرين للبعث."],
["الصبر والتسبيح","حين يؤذى المؤمن بالكلام، يتسلح بالصبر وذكر الله. ومن هنا نتعلم أذكار الصباح والمساء والصلاة في أوقاتها."],
["مهمة التذكير","الإيمان لا يفرض بالقوة. مهمة الداعية أن يذكر بالقرآن، بالحكمة والموعظة الحسنة، والهداية بيد الله."]],
wx:[["ماذا نتعلم من «وما أنت عليهم بجبار»؟",["لا إكراه في الدين.","نذكر الناس بالحكمة ولا نجبرهم.","والهداية بيد الله."]]]},

/*13*/{s:"الأسدوس الثاني — المرحلة 3",t:"سورة لقمان: الآيات 1 إلى 11 (التزكية)",
k:["سورة لقمان سورة <b>مكية</b>، سميت باسم لقمان الحكيم.","القرآن ﴿<b>هدى ورحمة للمحسنين</b>﴾ الذين يقيمون الصلاة ويؤتون الزكاة وهم بالآخرة يوقنون.","تذم الآيات من يشتري <b>لهو الحديث</b> ليضل عن سبيل الله.","تذكر الآيات مظاهر قدرة الله: السماوات <b>بغير عمد ترونها</b>، الجبال الرواسي، الدواب، والمطر الذي ينبت النبات.","﴿هذا خلق الله فأروني ماذا خلق الذين من دونه﴾: تحدي المشركين.","من الدروس: حسن الاستماع للقرآن، والإعراض عن اللهو الضار."],
w:[["المحسنين","الذين يتقنون العبادة والعمل"],["لهو الحديث","كلام باطل يصرف عن الحق"],["عمد","أعمدة"],["رواسي","جبال ثابتة"],["بث","نشر"]],
x:[["q","سورة لقمان سورة:",["مكية","مدنية"],0,"نزلت في مكة."],
["q","القرآن هدى ورحمة لـ:",["المحسنين","الكافرين"],0,"الآية 3."],
["q","«بغير عمد ترونها» أي:",["بدون أعمدة نراها","بأعمدة ضخمة"],0,"من آيات القدرة."],
["vf","تذم الآيات من يشتري لهو الحديث ليضل الناس.",true,"الآية 6."]],
d:[["صفات المحسنين","يقيمون الصلاة بإتقان، ويعطون الزكاة، ويؤمنون بالآخرة إيمانا يقينيا. فهم على هدى من ربهم وهم المفلحون."],
["لهو الحديث","كل كلام باطل يصرف الناس عن الحق والخير: الأغاني الفاحشة، القصص الباطلة. والمؤمن يحرص على ما ينفعه ويعرض عن اللغو."],
["آيات الخلق","السماء مرفوعة بلا أعمدة، والجبال تثبت الأرض، والحيوانات منتشرة، والمطر يحيي النبات. كل ذلك دليل على أن الله هو الخالق المستحق للعبادة."]],
wx:[["ما معنى «هذا خلق الله فأروني ماذا خلق الذين من دونه»؟",["الله هو الذي خلق كل ما نرى.","المشركون يعبدون أصناما لم تخلق شيئا.","فالله وحده يستحق العبادة."]]]},

/*14*/{t:"النظر والتفكر سبيل المعرفة والهداية (التزكية)",
k:["دعا القرآن إلى <b>النظر</b> و<b>التفكر</b> في الكون: ﴿إن في خلق السماوات والأرض واختلاف الليل والنهار لآيات لأولي الألباب﴾ (آل عمران 190).","﴿أفلا ينظرون إلى الإبل كيف خلقت، وإلى السماء كيف رفعت…﴾ (الغاشية).","التفكر <b>عبادة</b> تقود إلى معرفة الله والإيمان به.","التفكر طريق إلى <b>العلم</b> والاكتشاف: العلماء المسلمون درسوا الفلك والطب والطبيعة.","<b>أولو الألباب</b>: أصحاب العقول الذين يذكرون الله ويتفكرون في خلقه.","عكس التفكر: <b>التقليد الأعمى</b> والغفلة."],
w:[["التفكر","إعمال العقل في آيات الله"],["أولو الألباب","أصحاب العقول"],["التقليد الأعمى","اتباع الغير دون تفكير"],["الآيات","العلامات والدلائل"]],
x:[["q","«أولو الألباب» هم:",["أصحاب العقول","أصحاب الأموال"],0,"راجع الكلمات."],
["q","من ثمرات التفكر:",["معرفة الله والإيمان","الغفلة"],0,"التفكر عبادة."],
["vf","دعا القرآن إلى التقليد الأعمى.",false,"دعا إلى النظر والتفكر."],
["q","﴿أفلا ينظرون إلى ___ كيف خلقت﴾",["الإبل","الجبال","الشمس"],0,"سورة الغاشية."]],
d:[["التفكر عبادة","تكرر في القرآن: أفلا يتفكرون، أفلا يعقلون، أفلا ينظرون. فالعقل نعمة، وإعماله في آيات الله يزيد الإيمان."],
["مجالات التفكر","في النفس: جسم الإنسان وأعضاؤه. في الكون: الشمس والقمر والنجوم. في الأرض: الجبال والبحار والنبات. في الحيوان: الإبل التي تتحمل العطش، والنحل الذي يصنع العسل."],
["التفكر والعلم","كثير من الاكتشافات بدأت بالتأمل. والمسلم مطالب بالجمع بين قراءة القرآن وقراءة الكون."]],
wx:[["تأمل نحلة: كيف يقودك ذلك إلى معرفة الله؟",["النحلة تنظم عملها وتصنع العسل بدقة.","هذا النظام البديع لا يكون صدفة.","فهو دليل على الخالق الحكيم."]]]},

/*15*/{t:"دار الأرقم: التعارف والتشاور (الاقتداء)",
k:["<b>دار الأرقم بن أبي الأرقم</b> بيت قرب جبل الصفا بمكة.","اتخذها النبي ﷺ مقرا <b>سريا</b> يلتقي فيه بالصحابة في مرحلة الدعوة السرية.","فيها كان النبي ﷺ <b>يعلمهم</b> القرآن ويربيهم، ويتشاور معهم.","أسلم فيها عدد من الصحابة، منهم <b>عمر بن الخطاب</b> رضي الله عنه.","ساعدت على <b>التعارف</b> وبناء <b>الأخوة</b> بين المسلمين الأوائل.","من القيم: <b>التشاور</b>، التعاون، التعلم الجماعي، الكتمان عند الحاجة."],
w:[["دار الأرقم","بيت اجتمع فيه النبي ﷺ بالصحابة سرا"],["التعارف","معرفة الناس بعضهم ببعض"],["التشاور","تبادل الرأي قبل القرار"],["الكتمان","حفظ السر"]],
x:[["q","صاحب الدار التي اجتمع فيها المسلمون سرا:",["الأرقم بن أبي الأرقم","أبو بكر","عثمان"],0,"قرب الصفا."],
["q","من الصحابة الذين أسلموا في دار الأرقم:",["عمر بن الخطاب","أبو بكر الصديق"],0,"أبو بكر أسلم قبلها."],
["vf","كانت دار الأرقم مكانا للتعلم والتشاور.",true,"مدرسة الإسلام الأولى."],

d:[["لماذا دار الأرقم؟","كان المسلمون قليلين ومعرضين للأذى. فاختار النبي ﷺ بيتا بعيدا عن أنظار قريش ليجتمع فيه بأصحابه دون أن ينتبه إليهم أحد."],
["مدرسة الإسلام الأولى","في دار الأرقم تعلم الصحابة القرآن وأحكام الدين، وتربوا على الأخلاق، وتقوت الأخوة بينهم، رغم اختلاف أصولهم: الغني والفقير، الحر والعبد."],
["القدوة","نتعلم أهمية الاجتماع على الخير، والتشاور قبل اتخاذ القرارات، والتعاون في التعلم، والعمل بحكمة."]],
wx:[["كيف نطبق قيم دار الأرقم في القسم؟",["نكون مجموعات للمراجعة والتعاون.","نتشاور قبل اختيار نشاط أو مشروع.","نتعارف ونحترم بعضنا رغم اختلافاتنا."]]]},

/*16*/{t:"الصلاة: أحكامها ومقاصدها — الفرائض، السنن، المبطلات (الاستجابة)",
k:["الصلاة <b>الركن الثاني</b> من أركان الإسلام، وهي خمس صلوات في اليوم والليلة.","من <b>فرائض الصلاة</b> (عند المالكية): النية، تكبيرة الإحرام، قراءة الفاتحة، القيام، الركوع، الرفع منه، السجود، الرفع منه، الجلوس للسلام، السلام، الطمأنينة، الاعتدال.","من <b>سنن الصلاة</b>: قراءة سورة بعد الفاتحة في الركعتين الأوليين، التكبيرات غير تكبيرة الإحرام، التشهد، الجهر والسر في مواضعهما.","من <b>مبطلات الصلاة</b>: ترك فرض عمدا، الكلام عمدا، الأكل والشرب، الضحك بصوت (القهقهة)، انتقاض الوضوء.","<b>مقاصد الصلاة</b>: الصلة بالله، والانضباط في الوقت، والنهي عن السوء: ﴿إن الصلاة تنهى عن الفحشاء والمنكر﴾.","تجب على كل مسلم بالغ عاقل."],
w:[["الفرائض","أركان لا تصح الصلاة بدونها"],["السنن","أعمال يثاب فاعلها ولا تبطل الصلاة بتركها"],["المبطلات","ما يفسد الصلاة"],["تكبيرة الإحرام","قول «الله أكبر» في بداية الصلاة"],["الطمأنينة","استقرار الأعضاء في كل ركن"]],
x:[["q","تكبيرة الإحرام:",["فرض","سنة"],0,"بها يدخل في الصلاة."],
["q","قراءة سورة بعد الفاتحة:",["سنة","فرض"],0,"الفاتحة هي الفرض."],
["q","من مبطلات الصلاة:",["الكلام عمدا","رفع اليدين عند التكبير"],0,"الكلام يبطلها."],
["vf","الصلاة تنهى عن الفحشاء والمنكر.",true,"العنكبوت 45."],
["m","اربط.",[["قراءة الفاتحة","فرض"],["التشهد","سنة"],["الأكل في الصلاة","مبطل"]],"فرائض، سنن، مبطلات."]],
d:[["الفرائض","هي أركان الصلاة التي لا تصح بدونها، وإذا تركت سهوا يجب تداركها. منها: النية، تكبيرة الإحرام، الفاتحة، الركوع، السجود، السلام."],
["السنن","تكمل الصلاة وتزيدها أجرا. منها المؤكدة كالسورة بعد الفاتحة والتشهد والتكبيرات، ومن تركها سهوا يسجد للسهو."],
["المبطلات","ترك فرض عمدا، والكلام عمدا لغير إصلاحها، والأكل والشرب، والقهقهة، والحدث (ما ينقض الوضوء)، وكشف العورة. فيجب إعادة الصلاة."]],
wx:[["صلى تلميذ ونسي قراءة سورة بعد الفاتحة. هل تبطل صلاته؟",["قراءة السورة سنة وليست فرضا.","فالصلاة صحيحة.","ويسجد سجود السهو قبل السلام لأنه نقص سنة مؤكدة."]]]},

/*17*/{t:"حق الغير: حقوق الآباء والأبناء وذوي الرحم (القسط)",
k:["<b>حق الوالدين</b>: البر والإحسان والطاعة في المعروف: ﴿وقضى ربك ألا تعبدوا إلا إياه وبالوالدين إحسانا﴾.","من البر: احترامهما، خفض الصوت، الدعاء لهما، مساعدتهما، عدم قول «أف».","<b>حق الأبناء</b>: اختيار الاسم الحسن، التربية الصالحة، التعليم، النفقة، الرحمة، <b>العدل بينهم</b>.","<b>ذوو الرحم</b>: الأقارب من جهة الأب والأم (الأجداد، الأعمام، الأخوال، العمات، الخالات…).","<b>صلة الرحم</b>: زيارتهم، السؤال عنهم، مساعدتهم، والصلح معهم.","قال النبي ﷺ: «من أحب أن يبسط له في رزقه وينسأ له في أثره <b>فليصل رحمه</b>» (متفق عليه)."],
w:[["البر","الإحسان والطاعة"],["العقوق","عصيان الوالدين وإيذاؤهما"],["ذوو الرحم","الأقارب"],["صلة الرحم","زيارة الأقارب والإحسان إليهم"],["ينسأ له في أثره","يبارك له في عمره"]],
x:[["q","من بر الوالدين:",["الدعاء لهما","رفع الصوت عليهما"],0,"وقل رب ارحمهما."],
["q","من حقوق الأبناء على الآباء:",["التعليم والتربية","الإهمال"],0,"مسؤولية الآباء."],

d:[["بر الوالدين","قرن الله الإحسان إلى الوالدين بعبادته. البر يكون بالقول الطيب، والفعل (المساعدة)، والإنفاق عند الحاجة، والدعاء لهما في حياتهما وبعد موتهما."],
["حقوق الأبناء","الأبناء أمانة عند الآباء: يحسنون تسميتهم وتربيتهم وتعليمهم، ويعدلون بينهم في العطاء والمعاملة. قال ﷺ: «اتقوا الله واعدلوا بين أولادكم»."],

wx:[["اقترح ثلاثة أعمال لصلة الرحم في عطلة الأسبوع.",["زيارة الجدة والجد.","الاتصال بالعم أو الخال للسؤال عن أحوالهم.","مساعدة قريب مريض أو محتاج."]]]},

/*18*/{t:"التجمل بمحاسن الأخلاق (الحكمة)",
k:["قال النبي ﷺ: «<b>إنما بعثت لأتمم مكارم الأخلاق</b>».","وصف الله نبيه: ﴿<b>وإنك لعلى خلق عظيم</b>﴾ (القلم 4).","قال ﷺ: «<b>أكمل المؤمنين إيمانا أحسنهم خلقا</b>» (رواه الترمذي).","من محاسن الأخلاق: <b>الصدق</b>، <b>الأمانة</b>، <b>الحياء</b>، <b>التواضع</b>، <b>الحلم</b>، <b>الكرم</b>، الرحمة.","ومن الأخلاق السيئة: الكذب، الخيانة، الكبر، الغضب، البخل، الحسد.","حسن الخلق يكسب حب الله وحب الناس، ويثقل الميزان يوم القيامة."],
w:[["مكارم الأخلاق","الأخلاق الحسنة الرفيعة"],["الحلم","ضبط النفس عند الغضب"],["الحياء","خلق يمنع من فعل القبيح"],["التواضع","عدم التكبر على الناس"]],
x:[["q","«إنما بعثت لأتمم…»:",["مكارم الأخلاق","الصلاة"],0,"حديث شريف."],
["q","ضبط النفس عند الغضب:",["الحلم","الحسد","الكبر"],0,"راجع الكلمات."],
["vf","«أكمل المؤمنين إيمانا أحسنهم خلقا».",true,"رواه الترمذي."],
["m","اربط كل خلق بضده.",[["الصدق","الكذب"],["التواضع","الكبر"],["الكرم","البخل"]],"الأخلاق وأضدادها."]],
d:[["الأخلاق في الإسلام","الأخلاق جزء من الإيمان. العبادات نفسها تهدف إلى تحسين الأخلاق: الصلاة تنهى عن المنكر، والصوم يعلم الصبر، والزكاة تعلم الكرم."],
["القدوة","كان النبي ﷺ أحسن الناس خلقا: يبتسم، يعفو، يتواضع، يرحم الصغير، يوقر الكبير، يحسن إلى الجار، ولا يغضب لنفسه."],
["كيف أتجمل بالأخلاق؟","بالتدرب والصبر: أختار خلقا واحدا كل أسبوع (الابتسامة، الصدق، التسامح) وأحرص عليه، وأصاحب أصحاب الأخلاق الحسنة."]],
wx:[["أساء إليك زميل بكلمة. كيف تتصرف بحسن الخلق؟",["أضبط غضبي ولا أرد بالمثل (الحلم).","أنصحه بلطف.","وأعفو عنه إن اعتذر."]]]},

/* ===== المرحلة 4 ===== */
/*19*/{s:"الأسدوس الثاني — المرحلة 4",t:"سورة لقمان: الآيات 12 إلى 20 (التزكية)",
k:["﴿ولقد آتينا لقمان الحكمة أن اشكر لله﴾: الشكر أساس الحكمة.","وصايا لقمان لابنه: ﴿يا بني لا تشرك بالله إن <b>الشرك لظلم عظيم</b>﴾.","وصية الله بالوالدين: ﴿حملته أمه وهنا على وهن وفصاله في عامين أن اشكر لي ولوالديك﴾.","<b>مراقبة الله</b>: ﴿إنها إن تك مثقال حبة من خردل… يأت بها الله﴾.","﴿يا بني أقم الصلاة وأمر بالمعروف وانه عن المنكر واصبر على ما أصابك﴾.","آداب: ﴿ولا تصعر خدك للناس ولا تمش في الأرض مرحا… واقصد في مشيك واغضض من صوتك﴾."],
w:[["الحكمة","وضع الشيء في موضعه، والقول والعمل الصائب"],["وهنا على وهن","ضعفا فوق ضعف"],["فصاله","فطامه"],["تصعر خدك","تتكبر وتعرض بوجهك"],["مرحا","فخرا وتكبرا"],["اغضض من صوتك","اخفضه"]],
x:[["q","أول وصية للقمان لابنه:",["لا تشرك بالله","أقم الصلاة"],0,"إن الشرك لظلم عظيم."],
["q","«لا تصعر خدك للناس» تنهى عن:",["التكبر","الصدق"],0,"الإعراض بالوجه تكبرا."],
["q","«واغضض من صوتك» أي:",["اخفض صوتك","ارفع صوتك"],0,"أدب الكلام."],
["vf","«مثقال حبة من خردل» تدل على أن الله يعلم أدق الأعمال.",true,"المراقبة."],
["o","رتب بعض وصايا لقمان كما في الآيات.",["لا تشرك بالله","أقم الصلاة","وأمر بالمعروف","ولا تمش في الأرض مرحا"],"حسب ترتيب الآيات."]],
d:[["لقمان الحكيم","رجل صالح آتاه الله الحكمة، ونقل القرآن وصاياه لابنه بأسلوب رحيم: «يا بني». فالوصية تكون بلطف ومحبة."],
["محاور الوصايا","العقيدة: التوحيد ومراقبة الله. العبادة: إقامة الصلاة. المجتمع: الأمر بالمعروف والنهي عن المنكر والصبر. الأخلاق: التواضع، الاعتدال في المشي، خفض الصوت. وبين ذلك وصية الله بالوالدين."],
["نعم الله","تختم الآيات بقوله تعالى: ﴿ألم تروا أن الله سخر لكم ما في السماوات وما في الأرض وأسبغ عليكم نعمه ظاهرة وباطنة﴾، فيستحق الشكر."]],
wx:[["كيف تطبق وصية «واقصد في مشيك واغضض من صوتك»؟",["أمشي باعتدال، لا مسرعا ولا متكبرا.","أتكلم بصوت معتدل.","خاصة مع الوالدين والمعلمين وفي الأماكن العامة."]]]},

/*20*/{t:"القرآن الكريم هدى ورحمة للعالمين (الاستجابة)",
k:["<b>القرآن الكريم</b>: كلام الله المنزل على محمد ﷺ، المتعبد بتلاوته، المكتوب في المصاحف.","نزل <b>منجما</b> (مفرقا) خلال حوالي <b>23 سنة</b>.","﴿إن هذا القرآن <b>يهدي للتي هي أقوم</b>﴾ (الإسراء 9).","﴿وننزل من القرآن ما هو <b>شفاء ورحمة</b> للمؤمنين﴾ (الإسراء 82).","حفظه الله: ﴿إنا نحن نزلنا الذكر وإنا له لحافظون﴾. جُمع في عهد <b>أبي بكر</b>، ونُسخ في مصاحف في عهد <b>عثمان</b>.","قال النبي ﷺ: «<b>خيركم من تعلم القرآن وعلمه</b>» (رواه البخاري)."],
w:[["منجما","مفرقا حسب الأحداث"],["أقوم","أعدل وأصوب"],["الذكر","القرآن الكريم"],["المصحف","الكتاب الذي يجمع القرآن"]],
x:[["q","نزل القرآن خلال حوالي:",["23 سنة","10 سنوات","40 سنة"],0,"منجما."],
["q","«خيركم من تعلم القرآن و…»:",["علمه","تركه"],0,"رواه البخاري."],
["q","جمع القرآن أول مرة في عهد:",["أبي بكر","علي"],0,"بعد استشهاد كثير من الحفاظ."],
["vf","القرآن محفوظ من التحريف.",true,"وإنا له لحافظون."]],
d:[["القرآن هداية","يهدي القرآن إلى الإيمان، والعبادة الصحيحة، والأخلاق الفاضلة، والعدل في المعاملات. فهو منهج حياة."],
["القرآن رحمة","فيه شفاء للقلوب من الحيرة والقلق، وطمأنينة: ﴿ألا بذكر الله تطمئن القلوب﴾. وهو رحمة للعالمين لأنه يدعو إلى الخير والعدل للجميع."],
["واجبنا نحو القرآن","تلاوته بتدبر، وحفظ ما تيسر منه، والعمل بأحكامه، وتعلمه وتعليمه، واحترام المصحف."]],
wx:[["ضع برنامجا أسبوعيا مع القرآن.",["قراءة صفحة كل يوم بعد الفجر.","حفظ آيتين وتسميعهما للأسرة.","قراءة تفسير ميسر لآية واحدة."]]]},

/*21*/{t:"صبر السابقين الأولين في الدعوة إلى الله (الاقتداء)",
k:["<b>السابقون الأولون</b>: الصحابة الذين أسلموا في بداية الدعوة بمكة.","تعرض كثير منهم، خاصة الضعفاء، لـ<b>تعذيب شديد</b> من قريش.","<b>بلال بن رباح</b>: عذبه أمية بن خلف بوضع الصخرة على صدره في الرمضاء، فكان يقول: «<b>أحد، أحد</b>». ثم اشتراه أبو بكر وأعتقه.","<b>آل ياسر</b>: ياسر وسمية وابنهما عمار. قال لهم النبي ﷺ: «<b>صبرا آل ياسر فإن موعدكم الجنة</b>».","<b>سمية</b> رضي الله عنها <b>أول شهيدة في الإسلام</b>.","ومن المعذبين: <b>خباب بن الأرت</b>. والدرس: الصبر والثبات على الإيمان."],
w:[["السابقون الأولون","أوائل من أسلم من الصحابة"],["الرمضاء","الرمل الشديد الحرارة"],["الشهيد","من قتل في سبيل الله"],["أعتق","حرر العبد"]],
x:[["q","كان يقول «أحد، أحد» تحت التعذيب:",["بلال بن رباح","عمر بن الخطاب","خالد بن الوليد"],0,"بلال رضي الله عنه."],
["q","أول شهيدة في الإسلام:",["سمية","خديجة","عائشة"],0,"أم عمار بن ياسر."],
["q","«صبرا آل ___ فإن موعدكم الجنة»",["ياسر","أبي بكر","هاشم"],0,"حديث مشهور."],
["vf","أعتق أبو بكر بلالا.",true,"اشتراه وأعتقه."]],
d:[["من هم السابقون؟","هم أوائل المؤمنين، آمنوا في أصعب الظروف، حين كان الإسلام ضعيفا. وقد أثنى الله عليهم: ﴿والسابقون الأولون من المهاجرين والأنصار… رضي الله عنهم ورضوا عنه﴾."],
["صور من الصبر","بلال يعذب في الحر ولا يتنازل عن التوحيد. آل ياسر يعذبون جميعا، فتموت سمية شهيدة ثم ياسر. خباب يكوى بالنار. وكلهم ثبتوا."],
["الاقتداء","نتعلم أن الإيمان أغلى من كل شيء، وأن الصبر على الصعاب يقود إلى الفرج والجنة، وأن مساعدة المظلوم واجب كما فعل أبو بكر."]],
wx:[["ماذا نتعلم من موقف أبي بكر مع بلال؟",["التضامن مع المظلومين.","بذل المال في سبيل الله.","تحرير الإنسان من الظلم والعبودية."]]]},

/*22*/{t:"الصلاة: أحكام السهو وقضاء الفوائت وأحكام المسبوق (الاستجابة)",
k:["<b>سجود السهو</b>: سجدتان يسجدهما المصلي إذا زاد أو نقص في صلاته سهوا.","عند المالكية: إذا <b>نقص</b> سنة مؤكدة سجد <b>قبل السلام</b> (القبلي).","إذا <b>زاد</b> في الصلاة سهوا سجد <b>بعد السلام</b> (البعدي).","إذا اجتمع النقص والزيادة سجد <b>قبل السلام</b>.","<b>قضاء الفوائت</b>: من فاتته صلاة لنوم أو نسيان وجب عليه أن يصليها فور تذكرها: «من نسي صلاة فليصلها إذا ذكرها».","<b>المسبوق</b>: من فاتته ركعة أو أكثر مع الإمام: يدخل مع الإمام على حاله، ويدرك الركعة <b>بإدراك الركوع</b>، ثم يقضي ما فاته بعد سلام الإمام."],
w:[["السهو","النسيان في الصلاة"],["السجود القبلي","سجود السهو قبل السلام"],["السجود البعدي","سجود السهو بعد السلام"],["الفوائت","الصلوات التي فاتت عن وقتها"],["المسبوق","من سبقه الإمام بركعة أو أكثر"]],
x:[["q","من نقص سنة مؤكدة سهوا يسجد:",["قبل السلام","بعد السلام"],0,"النقص: القبلي."],
["q","من زاد ركعة سهوا يسجد:",["بعد السلام","قبل السلام"],0,"الزيادة: البعدي."],
["q","المسبوق يدرك الركعة بإدراك:",["الركوع مع الإمام","السجود فقط","التشهد"],0,"قاعدة."],
["vf","الصلاة الفائتة بسبب النوم تقضى عند الاستيقاظ.",true,"فليصلها إذا ذكرها."],
["m","اربط.",[["نقص السورة سهوا","سجود قبلي"],["زيادة ركعة سهوا","سجود بعدي"],["نقص وزيادة معا","سجود قبلي"]],"قاعدة المالكية."]],
d:[["سجود السهو","الإنسان قد ينسى، والإسلام دين يسر. شرع سجود السهو لجبر الخلل. يتكون من سجدتين، ثم تشهد، ثم سلام. والقاعدة المالكية: النقص قبل السلام، والزيادة بعده (مثل حرف القاف في «قبل» والنقص، والباء في «بعد» والزيادة)."],
["قضاء الفوائت","الصلاة لا تسقط بالنسيان أو النوم، بل تقضى فور التذكر وبترتيبها. أما تأخيرها عمدا بدون عذر فذنب كبير يستوجب التوبة مع القضاء."],
["المسبوق","يدخل المسبوق في الصلاة بتكبيرة الإحرام، ويتابع الإمام على الحالة التي وجده عليها. إذا أدرك الركوع حُسبت له الركعة، وإذا جاء بعد الرفع من الركوع لم تحسب. بعد سلام الإمام يقوم ليكمل ما فاته."]],
wx:[["دخل تلميذ المسجد فوجد الإمام ساجدا في الركعة الأخيرة. ماذا يفعل؟",["يكبر تكبيرة الإحرام ويسجد مع الإمام.","هذه الركعة لا تحسب له لأنه لم يدرك الركوع.","بعد سلام الإمام يقوم ويصلي الصلاة كاملة."]]]},

/*23*/{t:"حق البيئة: حماية البيئة من التلوث المادي والمعنوي (القسط)",
k:["<b>البيئة</b>: كل ما يحيط بالإنسان من ماء وهواء وتربة ونبات وحيوان.","<b>التلوث المادي</b>: تلوث الهواء (الدخان)، والماء (النفايات)، والتربة (المبيدات)، وتراكم الأزبال.","<b>التلوث المعنوي</b>: الضجيج، الكلام الفاحش، المشاهد السيئة، الإشاعات، العنف.","قال تعالى: ﴿<b>ولا تفسدوا في الأرض بعد إصلاحها</b>﴾ (الأعراف 56).","قال النبي ﷺ: «<b>إماطة الأذى عن الطريق صدقة</b>».","من وسائل الحماية: النظافة، ترشيد الماء، غرس الأشجار، فرز النفايات، الكلام الطيب."],
w:[["البيئة","المحيط الذي يعيش فيه الإنسان"],["التلوث","إفساد البيئة"],["إماطة الأذى","إزالة ما يضر الناس"],["الترشيد","الاقتصاد وعدم الإسراف"]],
x:[["q","من التلوث المعنوي:",["الكلام الفاحش","دخان المصانع"],0,"يفسد الأخلاق والذوق."],
["q","من التلوث المادي:",["رمي النفايات في الوادي","الضجيج"],0,"الضجيج تلوث معنوي في الدرس."],
["vf","«إماطة الأذى عن الطريق صدقة».",true,"حديث شريف."],
["q","﴿ولا تفسدوا في الأرض بعد…﴾",["إصلاحها","خلقها"],0,"الأعراف 56."],
["m","اربط.",[["غرس الأشجار","حماية البيئة"],["الضجيج","تلوث معنوي"],["المبيدات الكثيرة","تلوث مادي"]],"راجع الملخص."]],
d:[["الإنسان خليفة في الأرض","سخر الله الأرض للإنسان، وجعله مسؤولا عنها. فهو يستفيد منها دون إفساد، ويحافظ عليها للأجيال القادمة."],
["التلوث المادي والمعنوي","المادي يضر الصحة: أمراض التنفس، تلوث مياه الشرب، موت الأسماك. المعنوي يضر النفس والأخلاق: الضجيج يسبب التوتر، والكلام الفاحش ينشر السوء، والمشاهد العنيفة تؤثر على الأطفال."],
["أعمال يسيرة","إطفاء الأضواء غير الضرورية، إغلاق الصنبور، عدم رمي الأوراق في الشارع، المشاركة في حملات النظافة والتشجير، خفض الصوت، اختيار الكلام الطيب."]],
wx:[["اقترح ثلاثة أعمال لحماية بيئة المدرسة.",["وضع الأوراق في سلة المهملات.","غرس شجرة في ساحة المدرسة.","خفض الصوت في الممرات والقسم."]]]},

/*24*/{t:"حديث «عليكم بالصدق» (الحكمة)",
k:["عن ابن مسعود رضي الله عنه قال: قال رسول الله ﷺ: «<b>عليكم بالصدق</b>، فإن الصدق يهدي إلى <b>البر</b>، وإن البر يهدي إلى <b>الجنة</b>…» (رواه مسلم).","«…وما يزال الرجل يصدق ويتحرى الصدق حتى يكتب عند الله <b>صديقا</b>».","«وإياكم والكذب، فإن الكذب يهدي إلى <b>الفجور</b>، وإن الفجور يهدي إلى <b>النار</b>».","«…وما يزال الرجل يكذب ويتحرى الكذب حتى يكتب عند الله <b>كذابا</b>».","<b>الصدق</b>: مطابقة القول للحقيقة، ويكون في القول والفعل والنية.","من ثمرات الصدق: ثقة الناس، راحة الضمير، رضى الله."],
w:[["البر","كل عمل صالح وخير"],["الفجور","الميل إلى المعاصي"],["يتحرى","يقصد ويحرص"],["صديق","كثير الصدق"]],
x:[["o","رتب سلسلة الصدق كما في الحديث.",["الصدق","البر","الجنة"],"الصدق يهدي إلى البر، والبر إلى الجنة."],
["o","رتب سلسلة الكذب كما في الحديث.",["الكذب","الفجور","النار"],"الكذب يهدي إلى الفجور، والفجور إلى النار."],
["q","«يتحرى الصدق» أي:",["يحرص عليه ويقصده","يتركه"],0,"راجع الكلمات."],
["vf","روى هذا الحديث الإمام مسلم.",true,"عن ابن مسعود."],

<script>// ===== Générateurs d'exercices : outils communs =====
const GEN={};          // GEN[sid][li] = [[niveau, fonction], ...]
const LVX=[];          // exercices écrits à la main avec niveau : [sid, li, lv, exercice]
function gen(sid,li,lv,fn){((GEN[sid]=GEN[sid]||{})[li]=GEN[sid][li]||[]).push([lv,fn])}
function LV(sid,li,lv,arr){arr.forEach(E=>LVX.push([sid,li,lv,E]))}
const RNG={
  int:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuf:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},
  sample:(a,n)=>RNG.shuf(a).slice(0,n),
  sign:()=>Math.random()<.5?-1:1,
  coin:p=>Math.random()<(p==null?.5:p)
};
const I=RNG.int,PK=RNG.pick;
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}
// nombre au format français (virgule, signe −, espaces des milliers)
function N(x,dec){if(typeof x!=="number"||!isFinite(x))return"NaN";const d=dec==null?2:dec;let v=Math.round(x*Math.pow(10,d))/Math.pow(10,d);if(Object.is(v,-0))v=0;
  const neg=v<0;let [ip,fp]=Math.abs(v).toString().split(".");if(ip.length>4)ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g," ");return(neg?"−":"")+ip+(fp?","+fp:"")}
// fraction simplifiée (chaîne au format [[a/b]])
function FR(n,d){if(d===0)return"NaN";if(d<0){n=-n;d=-d}const g=gcd(n,d);n/=g;d/=g;if(d===1)return N(n);return(n<0?"[[−"+(-n)+"/"+d+"]]":"[["+n+"/"+d+"]]")}
function FRraw(n,d){return(n<0?"[[−"+(-n)+"/"+d+"]]":"[["+n+"/"+d+"]]")}
const SUP="⁰¹²³⁴⁵⁶⁷⁸⁹";function sup(n){return(n<0?"⁻":"")+String(Math.abs(n)).split("").map(c=>SUP[+c]).join("")}
// a·x + b joliment
function term(a,v,first){if(a===0)return"";const s=a<0?"−":first?"":"+";const m=Math.abs(a);return s+(v?(m===1?"":m)+v:m)}
function poly(...cs){// poly([a,"x²"],[b,"x"],[c,""])
  let s="";cs.forEach(([a,v])=>{if(a)s+=term(a,v,!s)});return s||"0"}
// constructeurs d'exercices (renvoient null si invalides)
function bad(s){return s==null||/NaN|Infinity|undefined/.test(String(s))}
function Q(text,correct,dis,help){const c=String(correct);if(bad(c))return null;const seen=new Set([c]),o=[c];
  for(const d of dis){const s=String(d);if(!bad(s)&&s!==""&&!seen.has(s)){seen.add(s);o.push(s)}if(o.length>=4)break}
  if(o.length<3)return null;const order=RNG.shuf(o.map((_,i)=>i));return["q",text,order.map(i=>o[i]),order.indexOf(0),help]}
function VF(text,val,help){return["vf",text,!!val,help]}
function GAP(text,ans,dis,help){const a=ans.map(String);if(a.some(bad))return null;const d=[];dis.map(String).forEach(s=>{if(!bad(s)&&!a.includes(s)&&!d.includes(s))d.push(s)});
  if((text.match(/___/g)||[]).length!==a.length||new Set(a).size!==a.length)return null;return["g",text,a,d.slice(0,3),help]}
function ORD(text,items,help){if(new Set(items).size!==items.length)return null;return["o",text,items,help]}
function REL(text,pairs,help){if(new Set(pairs.map(p=>p[1])).size!==pairs.length||new Set(pairs.map(p=>p[0])).size!==pairs.length)return null;return["m",text,pairs,help]}
function numDis(x,extra){const c=[x+1,x-1,x*2,x/2,x+10,x-10,x*10,x/10,-x].concat(extra||[]);return c.map(v=>N(v))}
// produit une série de n exercices pour (sid, li, lv)
function genSeries(sid,li,lv,n){const list=(GEN[sid]&&GEN[sid][li]||[]).filter(g=>g[0]===lv);if(!list.length)return[];
  const out=[],seen=new Set();let tries=0;while(out.length<n&&tries<n*30){tries++;const fn=list[(out.length+tries)%list.length][1];let E=null;try{E=fn()}catch(e){E=null}
    if(!E)continue;const key=JSON.stringify(E);if(seen.has(key))continue;seen.add(key);E.gen=1;E.lv=lv;out.push(E)}return out}
function FX(E,f){if(E)E.fig=f;return E}
function Q2(text,correct,other,help){if(bad(correct)||bad(other)||String(correct)===String(other))return null;const o=RNG.coin();return["q",text,o?[String(correct),String(other)]:[String(other),String(correct)],o?0:1,help]}

// ===== Générateurs — Mathématiques 1AC =====
(()=>{const M="math";
const PR=v=>v<0?"("+N(v)+")":N(v);           // relatif entre parenthèses
const S=v=>v<0?N(v):"+"+N(v);                 // relatif avec signe
const lcm=(a,b)=>a*b/gcd(a,b);
const frD=(n,d,ex)=>[[d,n],[n+1,d],[n,d+1],[n*2,d],[n,d*2],[n+d,d],[Math.max(1,n-1),d]].concat(ex||[]).filter(p=>p[1]>0&&Math.abs(p[0]/p[1]-n/d)>1e-9).map(p=>FR(p[0],p[1]));
const cpr=(...p)=>{for(let i=0;i<p.length;i+=2)if(gcd(p[i],p[i+1])!==1)return false;return true};

/* 0 — Nombres décimaux */
gen(M,0,1,()=>{const a=I(10,999)/10,b=I(100,9999)/100;return Q("Calcule `"+N(a)+"+"+N(b)+"`",N(a+b),[N(a+b+1),N(a+b+0.1),N(a+b-0.01),N(a*10+b)],"On aligne les virgules. | `"+N(a)+"+"+N(b)+"="+N(a+b)+"`")});
gen(M,0,1,()=>{const x=I(11,9999)/100,k=PK([[10,"10"],[100,"100"],[1000,"1000"],[0.1,"0,1"],[0.01,"0,01"]]);return Q("Calcule `"+N(x)+"×"+k[1]+"`",N(x*k[0],4),[N(x/k[0],4),N(x*k[0]*10,4),N(x*k[0]/10,4)],k[0]>1?"Multiplier par "+k[1]+" décale la virgule vers la droite.":"Multiplier par "+k[1]+" décale la virgule vers la gauche.")});
gen(M,0,1,()=>{const e=I(1,20),v=RNG.sample([e+0.5,e+0.45,e+0.405,e+0.54,e+0.049,e+0.6,e+0.06],4);const mx=Math.max(...v);return Q("Le plus grand nombre est :",N(mx,3),v.filter(x=>x!==mx).map(x=>N(x,3)),"Même partie entière `"+e+"`. | Compare les dixièmes, puis les centièmes.")});
gen(M,0,2,()=>{const a=I(11,99),b=I(2,99);return Q("Calcule `"+N(a/10)+"×"+N(b/10)+"`",N(a*b/100),[N(a*b/10),N(a*b/1000,3),N(a*b),N((a+b)/10)],"Sans virgule : `"+a+"×"+b+"="+(a*b)+"`. | 2 chiffres après la virgule en tout : `"+N(a*b/100)+"`.")});
gen(M,0,2,()=>{const a=I(500,9999)/100,b=I(100,Math.floor(a*100)-1)/100;return Q("Calcule `"+N(a)+"−"+N(b)+"`",N(a-b),[N(a-b+1),N(a+b),N(a-b-0.1),N(Math.abs(a-b-0.01))],"On aligne les virgules, on peut ajouter des zéros. | `"+N(a)+"−"+N(b)+"="+N(a-b)+"`")});
gen(M,0,2,()=>{const a=I(2,20),b=I(2,9),c=I(2,9);return Q("Calcule `"+a+"+"+b+"×"+c+"`",N(a+b*c),[N((a+b)*c),N(a+b+c),N(a*b+c)],"La multiplication est prioritaire : `"+b+"×"+c+"="+(b*c)+"`. | `"+a+"+"+(b*c)+"="+(a+b*c)+"`")});
gen(M,0,3,()=>{const b=I(2,5),c=I(1,9),d=I(1,9),a=b*(c+d)+I(1,20);return Q("Calcule `"+a+"−"+b+"×("+c+"+"+d+")`",N(a-b*(c+d)),[N((a-b)*(c+d)),N(a-b*c+d),N(a-b+c+d)],"Parenthèse : `"+c+"+"+d+"="+(c+d)+"`. | `"+b+"×"+(c+d)+"="+(b*(c+d))+"`. | `"+a+"−"+(b*(c+d))+"="+(a-b*(c+d))+"`")});
gen(M,0,3,()=>{const d=PK([2,4,5,8]),q=I(11,99);const n=d*q;return Q("Calcule `"+N(n/10)+"÷"+N(d/10)+"`",N(q),[N(q/10),N(q*10),N(q+1)],"On multiplie les deux nombres par 10 : `"+n+"÷"+d+"`. | `="+q+"`")});
gen(M,0,3,()=>{const n=I(2,6),p=I(250,1500)/100,o=I(100,900)/100;const T=n*p+o;return Q(n+" cahiers à `"+N(p)+" DH` et une règle à `"+N(o)+" DH`. Prix total ?",N(T)+" DH",[N(p+o)+" DH",N(n*(p+o))+" DH",N(T+1)+" DH"],"Cahiers : `"+n+"×"+N(p)+"="+N(n*p)+"`. | Total : `"+N(n*p)+"+"+N(o)+"="+N(T)+" DH`.")});

/* 1 — Fractions */
gen(M,1,1,()=>{const q=I(3,12),p=I(1,q-1),k=I(2,7);if(gcd(p,q)!==1)return null;return Q("Simplifie `"+FRraw(p*k,q*k)+"`",FR(p,q),frD(p,q,[[p*k,q]]),"On divise "+(p*k)+" et "+(q*k)+" par "+k+". | `"+FR(p,q)+"`")});
gen(M,1,1,()=>{const d=I(5,15),a=I(1,d-2),b=I(1,d-1-a);return Q("Calcule `[["+a+"/"+d+"]]+[["+b+"/"+d+"]]`",FR(a+b,d),[FRraw(a+b,2*d),FR(a*b,d),FR(a+b+1,d)],"Même dénominateur : `"+a+"+"+b+"="+(a+b)+"`. | On garde `"+d+"`.")});
gen(M,1,1,()=>{const b=PK([2,3,4,5,10]),a=I(1,b-1),Q0=b*I(2,30);return Q("Calcule `[["+a+"/"+b+"]]` de "+Q0,N(Q0/b*a),[N(Q0/b),N(Q0*a),N(Q0-a)],"`"+Q0+"÷"+b+"="+(Q0/b)+"` | `"+(Q0/b)+"×"+a+"="+(Q0/b*a)+"`")});
gen(M,1,2,()=>{const d=I(2,6),m=I(2,4),a=I(1,d-1),b=I(1,d*m-1),D=d*m,op=RNG.coin();const r=op?a*m+b:a*m-b;if(r<=0)return null;
  return Q("Calcule `[["+a+"/"+d+"]]"+(op?"+":"−")+"[["+b+"/"+D+"]]`",FR(r,D),[FRraw(op?a+b:Math.abs(a-b)||1,d+D),FR(op?a+b:Math.abs(a-b)||1,D),FR(r+1,D)],"`"+FRraw(a,d)+"="+FRraw(a*m,D)+"` | `"+(a*m)+(op?"+":"−")+b+"="+r+"` | Résultat : `"+FR(r,D)+"`")});
gen(M,1,2,()=>{const a=I(1,9),b=I(2,9),c=I(1,9),d=I(2,9);return Q("Calcule `[["+a+"/"+b+"]]×[["+c+"/"+d+"]]`",FR(a*c,b*d),[FR(a+c,b+d),FR(a*d,b*c),FR(a*c,b+d)],"Haut × haut : `"+(a*c)+"`. Bas × bas : `"+(b*d)+"`. | On simplifie : `"+FR(a*c,b*d)+"`")});
gen(M,1,2,()=>{let b=I(3,9),d=I(3,9);if(b===d)return null;const a=I(1,b-1),c=I(1,d-1);if(a*d===b*c)return null;const big=a*d>b*c;return Q("La plus grande fraction est :",big?FRraw(a,b):FRraw(c,d),[big?FRraw(c,d):FRraw(a,b),"elles sont égales"],"Même dénominateur `"+(b*d)+"` : `"+FRraw(a*d,b*d)+"` et `"+FRraw(c*b,b*d)+"`.")});
gen(M,1,3,()=>{let b=I(2,9),d=I(2,9);if(b===d||b%d===0||d%b===0)return null;const a=I(1,b),c=I(1,d);if(!cpr(a,b,c,d))return null;const D=lcm(b,d),op=RNG.coin(),r=op?a*D/b+c*D/d:a*D/b-c*D/d;if(r<=0)return null;
  return Q("Calcule `[["+a+"/"+b+"]]"+(op?"+":"−")+"[["+c+"/"+d+"]]`",FR(r,D),[FR(op?a+c:Math.abs(a-c)||1,b+d),FR(r+1,D),FR(op?a*d+c*b:Math.abs(a*d-c*b)||1,b*d+1)],"Dénominateur commun : `"+D+"`. | `"+FRraw(a*D/b,D)+(op?"+":"−")+FRraw(c*D/d,D)+"` | `="+FR(r,D)+"`")});
gen(M,1,3,()=>{const a=I(1,9),b=I(2,9),c=I(1,9),d=I(2,9);if(!cpr(a,b,c,d))return null;return Q("Calcule `[["+a+"/"+b+"]]÷[["+c+"/"+d+"]]`",FR(a*d,b*c),[FR(a*c,b*d),FR(b*c,a*d),FR(a+d,b+c)],"On multiplie par l'inverse : `[["+a+"/"+b+"]]×[["+d+"/"+c+"]]`. | `="+FRraw(a*d,b*c)+"="+FR(a*d,b*c)+"`")});
gen(M,1,3,()=>{const T=PK([120,240,360,480,600,720]),f1=PK([[1,3],[1,4],[1,2],[1,6]]),f2=PK([[1,2],[1,3],[1,4]]);const s1=T*f1[0]/f1[1],rest=T-s1,s2=rest*f2[0]/f2[1];if(s2%1)return null;
  return Q("Sur "+T+" DH, Salma dépense `[["+f1[0]+"/"+f1[1]+"]]` puis `[["+f2[0]+"/"+f2[1]+"]]` du reste. Combien lui reste-t-il ?",N(rest-s2)+" DH",[N(rest)+" DH",N(T-s1-T*f2[0]/f2[1])+" DH",N(s2)+" DH"],"1re dépense : `"+T+"÷"+f1[1]+"="+s1+"`. Reste : `"+rest+"`. | 2e dépense : `"+rest+"÷"+f2[1]+"="+s2+"`. | Il reste `"+(rest-s2)+" DH`.")});

/* 2 — Nombres relatifs */
gen(M,2,1,()=>{const a=I(1,20),b=I(1,20),s=RNG.sign(),PS=v=>"("+(v<0?N(v):"+"+N(v))+")";return Q("Calcule `"+PS(s*a)+"+"+PS(s*b)+"`",N(s*(a+b)),[N(-s*(a+b)),N(s*(a-b)),N(a-b)],"Même signe : on additionne `"+a+"+"+b+"="+(a+b)+"` et on garde le signe.")});
gen(M,2,1,()=>{const a=I(1,50)*RNG.sign();return Q("L'opposé de `"+N(a)+"` est :",N(-a),[N(a),"0","[[1/"+Math.abs(a)+"]]"],"Même distance à zéro, signe contraire.")});
gen(M,2,1,()=>{const v=RNG.sample([-9,-7,-5,-3,-2,-1,0,2,4,6],4);const mx=Math.max(...v);return Q("Le plus grand nombre est :",N(mx),v.filter(x=>x!==mx).map(x=>N(x)),"Un positif est plus grand qu'un négatif. | Entre deux négatifs, le plus grand est le plus près de zéro.")});
gen(M,2,2,()=>{const a=I(1,20),b=I(1,20);if(a===b)return null;const x=PK([a,-a]),y=x>0?-b:b;const r=x+y;return Q("Calcule `"+PR(x)+"+"+PR(y)+"`",N(r),[N(-r),N(x-y),N(-(x-y))],"Signes contraires : `"+Math.max(a,b)+"−"+Math.min(a,b)+"="+Math.abs(r)+"`. | Signe du plus éloigné de zéro.")});
gen(M,2,2,()=>{const a=I(-15,15),b=I(-15,15);if(!b)return null;return Q("Calcule `"+N(a)+"−"+PR(b)+"`",N(a-b),[N(a+b),N(-(a-b)),N(b-a+1)],"Soustraire `"+PR(b)+"`, c'est ajouter `"+N(-b)+"`. | `"+N(a)+"+"+PR(-b)+"="+N(a-b)+"`")});
gen(M,2,2,()=>{const v=RNG.sample([-12,-8,-5,-3,-1,0,2,4,7,9],4);const s=v.slice().sort((x,y)=>x-y);return ORD("Range dans l'ordre croissant.",s.map(x=>N(x)),"Commence par le négatif le plus éloigné de zéro.")});
gen(M,2,3,()=>{const t=[I(1,15),-I(1,15),I(1,15),-I(1,15)];const b=I(1,9);const r=t[0]+t[1]-(-b)+t[2]+t[3];

  v.forEach(([P,U,V,s,o])=>{let a1=ang(P,U),a2=ang(P,V);if(a2<a1)[a1,a2]=[a2,a1];if(a2-a1>Math.PI)[a1,a2]=[a2,a1+2*Math.PI];b+=arc(P,a1,a2,22)+tx(P[0]+o[0],P[1]+o[1],s,"t a b")});

  b+=ln(P[0],P[1],P[0]+R,P[1])+ln(P[0],P[1],P[0]+R*Math.cos(rad),P[1]-R*Math.sin(rad))+(d===90?ra(P,[P[0]+R,P[1]],[P[0],P[1]-R],10):arc(P,0,rad,16))+tx(P[0]+22,118,n,"t s b")+tx(P[0]+22,134,d+"°","t s a")});return svg(360,145,b)};

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function fmt(s){
  s=String(s).replace(/\[\[([^\/\]]+)\/([^\]]+)\]\]/g,'<span class="fr"><span>$1</span><span>$2</span></span>');
  s=s.replace(/\{([A-Z']+)\}/g,'<span class="vec">$1</span>');

}
function plain(s){return String(s).replace(/<[^>]+>/g," ").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/`/g,"").replace(/\[\[([^\/\]]+)\/([^\]]+)\]\]/g,"$1 / $2").replace(/\{([A-Z']+)\}/g,"$1").replace(/\s+/g," ").trim()}
const isWordy=s=>/[؀-ۿa-zA-Zàâçéèêëîïôûùüœ]{3,}/.test(String(s).replace(/<[^>]+>/g,""));
function optHtml(o){return /`/.test(o)?fmt(o):isWordy(o)&&!/[\[`{]/.test(o)?fmt(o):fmt('`'+o+'`')}

const SPK='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10L5 10H2z" fill="currentColor"/><path d="M11 5.5c1 .8 1 4.2 0 5M12.8 3.8c2 1.8 2 6.6 0 8.4" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>';
const MIC='<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5" fill="currentColor"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.5M5.5 14.5h5" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>';
function speak(text,l){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=l==="ar"?"ar-SA":"fr-FR";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}

/* ---- voix : lire au micro (enregistrement + reconnaissance) ---- */
const R={key:null,on:false,url:null,heard:"",err:null,noRec:false,target:"",l:"fr"};
let mediaRec=null,stream=null,recog=null,recTimer=null;
const RecCtor=(()=>{try{return window.SpeechRecognition||window.webkitSpeechRecognition||null}catch(e){return null}})();
function tools(text,l,key){
  const p=esc(plain(text));
  return '<span class="lineTools">'+(canSpeak?'<button type="button" class="say" data-say="'+p+'" data-sl="'+l+'" aria-label="Écouter">'+SPK+'</button>':'')+
    '<button type="button" class="say mic'+(R.key===key&&R.on?' on':'')+'" data-rec="'+p+'" data-sl="'+l+'" data-rk="'+key+'" aria-label="'+t().mic+'">'+MIC+'</button></span>';
}
function norm(s){return s.normalize("NFD").replace(/[̀-ًͯ-ْـ]/g,"").toLowerCase().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[^\p{L}\p{N}\s]/gu," ").split(/\s+/).filter(Boolean)}
function recPanel(key){
  if(R.key!==key)return "";const x=t();let h='<div class="recpanel" role="status">';
  if(R.err)h+='<div class="err">'+R.err+'</div>';
  else if(R.on)h+='<div><span class="recdot"></span>'+x.recording+'</div><div><button type="button" class="btn" data-recstop>'+x.stop+'</button></div>';
  else{
    if(R.url)h+='<div>'+x.listen+'</div><audio controls src="'+R.url+'"></audio>';
    if(R.heard){const tw=norm(R.target),hw=new Set(norm(R.heard));const ok=tw.filter(w=>hw.has(w)).length;
      h+='<div class="heard">'+x.heard+' <b>'+esc(R.heard)+'</b></div><div class="heard">'+x.match(ok,tw.length)+'</div>'}
    else if(R.noRec)h+='<div class="heard">'+x.noRec+'</div>';
    h+='<div><button type="button" class="btn ghost" data-rec="'+esc(R.target)+'" data-sl="'+R.l+'" data-rk="'+key+'">'+x.again2+'</button></div>';
  }
  return h+'</div>';
}
async function startRec(target,l,key){
  stopRec(true);
  Object.assign(R,{key,on:true,url:null,heard:"",err:null,noRec:!RecCtor,target,l});render();
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("nomic");
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks=[];mediaRec=new MediaRecorder(stream);
    mediaRec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mediaRec.onstop=()=>{try{if(R.url)URL.revokeObjectURL(R.url)}catch(e){}R.url=chunks.length?URL.createObjectURL(new Blob(chunks,{type:mediaRec.mimeType||"audio/webm"})):null;
      if(stream)stream.getTracks().forEach(tr=>tr.stop());stream=null;R.on=false;render()};
    mediaRec.start();
    if(RecCtor){try{recog=new RecCtor();recog.lang=l==="ar"?"ar-MA":"fr-FR";recog.interimResults=true;recog.continuous=true;
      recog.onresult=e=>{let s="";for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript+" ";R.heard=s.trim()};
      recog.onerror=()=>{};recog.start()}catch(e){recog=null;R.noRec=true}}
    recTimer=setTimeout(()=>stopRec(),30000);
  }catch(e){R.on=false;R.err=t().micNo;if(stream)stream.getTracks().forEach(tr=>tr.stop());stream=null;render()}
}
function stopRec(silent){
  clearTimeout(recTimer);
  try{if(recog)recog.stop()}catch(e){}recog=null;
  try{if(mediaRec&&mediaRec.state!=="inactive"){mediaRec.stop();mediaRec=null;return}}catch(e){}
  mediaRec=null;if(stream){stream.getTracks().forEach(tr=>tr.stop());stream=null}
  if(!silent){R.on=false;render()}
}
function resetRec(){if(R.on)stopRec(true);R.key=null;R.on=false}


/* ---- utilitaires ---- */
function shuffle(n,seed){const a=[...Array(n).keys()];let s=Math.abs(seed)*9301+49297;for(let i=n-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  if(n>1&&a.every((v,i)=>v===i))a.push(a.shift());return a}
function subj(id){return SUBJ.find(s=>s.id===id)}
const lvOf=E=>E.lv||1;
function exIdx(L,lv){const r=[];L.x.forEach((E,k)=>{if(lvOf(E)===lv)r.push(k)});return r}
const nSetsLv=(L,lv)=>Math.ceil(exIdx(L,lv).length/SET);
function hasGen(sid,li,lv){const g=GEN[sid]&&GEN[sid][li];return !!(g&&g.some(x=>lv==null||x[0]===lv))}
function lessonEx(sid,i){const e=(P.ex[sid]||{})[i];return e&&typeof e==="object"?e:{}}
function genCount(sid,i){return((P.gen[sid]||{})[i])||0}
function setSize(L,key){const [lv,s]=key.split("-").map(Number);const idx=exIdx(L,lv);return Math.min(SET,Math.max(0,idx.length-s*SET))}
function sStats(S){const r=P.read[S.id]||{};let nr=0,ns=0,ok=0,tot=0,all=0,g=false;
  S.L.forEach((L,i)=>{all+=L.x.length;if(hasGen(S.id,i))g=true;if(r[i])nr++;const e=lessonEx(S.id,i);for(const k in e){ns++;ok+=e[k];tot+=setSize(L,k)}ns+=genCount(S.id,i)});
  return{nr,ns,ok,tot,n:S.L.length,all,g}}
function errList(sid){const S=subj(sid);const hand=Object.keys((P.err||{})[sid]||{}).map(k=>k.split(".").map(Number)).filter(([i,k])=>S.L[i]&&S.L[i].x[k]);
  const gens=((P.errG||{})[sid]||[]).filter(it=>S.L[it.li]).map(it=>{const E=it.E.slice();if(it.fig)E.fig=it.fig;E.gen=1;return{li:it.li,E,id:it.id}});return hand.concat(gens)}

  const idx=exIdx(L,lv),g=hasGen(S.id,view.i,lv);

  for(let s=0;s<Math.ceil(idx.length/SET);s++){const a=s*SET,b=Math.min(idx.length,(s+1)*SET),key=lv+"-"+s,done=e[key]!=null;

}

/* ---- lecteur d'exercices ---- */
function newEx(){return{tried:[],done:false,hint:0,first:true,placed:[],ordCheck:null,mSel:null,mDone:[],mMiss:null,msg:null,gFill:[],gCheck:null}}
function newG(list,extra){return Object.assign({list,pos:0,e:newEx(),score:0,end:false,sh:null,seed:Math.floor(Math.random()*1e6)},extra||{})}
function startSet(s){const L=subj(view.id).L[view.i],lv=view.lv||1,idx=exIdx(L,lv).slice(s*SET,(s+1)*SET);view.g=newG(idx.map(k=>[view.i,k]),{mode:"set",set:s,lv});resetRec()}
function startGen(lv){const list=genSeries(view.id,view.i,lv,SET).map(E=>({li:view.i,E}));view.g=newG(list,{mode:"gen",lv});resetRec()}
function startQuiz(mode){const S=subj(view.id);let list=[];
  if(mode==="err")list=RNG.shuf(errList(S.id)).slice(0,10);
  else{let tries=0;while(list.length<10&&tries<200){tries++;const li=I(0,S.L.length-1);
    if(RNG.coin()&&hasGen(S.id,li)){const lvs=[1,2,3].filter(l=>hasGen(S.id,li,l));const E=genSeries(S.id,li,PK(lvs),1)[0];if(E)list.push({li,E})}
    else{const L=S.L[li];if(L.x.length)list.push([li,I(0,L.x.length-1)])}}}
  view={s:"quiz",id:S.id,mode};view.g=newG(list,{mode});resetRec()}
function fullSentence(E){if(E[0]==="o")return E[2].join(" ");if(E[0]==="g"){const parts=E[1].split("___");return parts.map((p,i)=>p+(i<E[2].length?E[2][i]:"")).join("")}return E[1]}
function cur(S){const G=view.g,it=G.list[G.pos];if(Array.isArray(it))return{li:it[0],k:it[1],L:S.L[it[0]],E:S.L[it[0]].x[it[1]],it};return{li:it.li,k:-1,L:S.L[it.li],E:it.E,it}}
function player(S){
  const x=t(),G=view.g,n=G.list.length;
  if(!n)return '<div class="card end"><p>'+(G.mode==="err"?x.errsNone:x.noneLv)+'</p><div class="actions" style="justify-content:center"><button type="button" class="btn ghost" data-'+(view.s==="quiz"?'backsubj':'sets')+'>'+x.toSets+'</button></div></div>';
  if(G.end){const more=G.mode==="set"&&G.set<nSetsLv(S.L[view.i],G.lv)-1;let btns="";
    if(G.mode==="gen")btns='<button type="button" class="btn" data-gen="'+G.lv+'">'+x.genAgain+'</button><button type="button" class="btn ghost" data-sets>'+x.toSets+'</button>';
    else if(G.mode==="set")btns=(more?'<button type="button" class="btn" data-set="'+(G.set+1)+'">'+x.nextSet+'</button>':'')+'<button type="button" class="btn ghost" data-again>'+x.again+'</button><button type="button" class="btn ghost" data-sets>'+x.toSets+'</button>';
    else btns='<button type="button" class="btn" data-quiz="'+G.mode+'">'+(G.mode==="err"?x.errs:x.mix)+'</button><button type="button" class="btn ghost" data-backsubj>'+x.toSets+'</button>';
    return '<div class="card end"><div class="big">'+G.score+' / '+n+'</div><p><b>'+x.endT(G.score,n)+'</b></p><p class="star">'+x.starEarn+'</p><p>'+x.endP+'</p><div class="actions" style="justify-content:center">'+btns+'</div></div>'}
  const {li,k,L,E}=cur(S),st=G.e,type=E[0],seed=k>=0?li*31+k:G.seed+G.pos*17;
  let h='<div class="dots">';for(let i=0;i<n;i++)h+='<span class="dot'+(i<G.pos?' done':i===G.pos?' cur':'')+'"></span>';
  h+='<span>'+(G.mode==="set"?x.set(G.set+1)+' · ':G.mode==="gen"?"🎲 ":'')+(G.pos+1)+' / '+n+'</span></div>';
  h+='<div class="card">';
  if(view.s==="quiz")h+='<div class="from">'+x.fromL(li+1,fmt(L.t))+'</div>';
  h+='<div class="kind">'+x.kinds[type]+(E.lv&&E.lv>1?' <span class="lvtag">'+"⭐".repeat(E.lv)+'</span>':'')+'</div>';
  if(E.fig)h+=figHtml(E.fig);
  if(type!=="g")h+='<div class="qrow"><p class="qtext">'+fmt(E[1])+'</p>'+(canSpeak?'<button type="button" class="say" data-say="'+esc(plain(E[1]))+'" data-sl="'+S.lang+'" aria-label="Écouter">'+SPK+'</button>':'')+'</div>';
  if(type==="q"||type==="vf"){
    const opts=type==="q"?E[2]:[x.vrai,x.faux],ans=type==="q"?E[3]:(E[2]?0:1);
    const order=type==="q"?(G.sh||(G.sh=shuffle(opts.length,seed))):[0,1];
    h+='<div class="'+(type==="vf"?"vfrow":"opts")+'">';
    order.forEach(j=>{let c="opt";if(st.done&&j===ans)c+=" right";else if(st.tried.includes(j))c+=" tried";
      h+='<button type="button" class="'+c+'" data-opt="'+j+'"'+(st.done||st.tried.includes(j)?' disabled':'')+'>'+(type==="q"?optHtml(opts[j]):opts[j])+'</button>'});
    h+='</div>';
  } else if(type==="o"){
    const items=E[2],sh=G.sh||(G.sh=shuffle(items.length,seed));
    h+='<div class="slot" data-empty="'+x.orderEmpty+'">'+st.placed.map((j,p)=>{let c="tok placed";if(st.ordCheck)c+=st.ordCheck[p]?" good":" bad";if(st.done)c="tok good";
      return '<button type="button" class="'+c+'" data-unplace="'+p+'"'+(st.done?' disabled':'')+'>'+fmt(items[j])+'</button>'}).join("")+'</div>';
    h+='<div class="pool">'+sh.filter(j=>!st.placed.includes(j)).map(j=>'<button type="button" class="tok" data-place="'+j+'">'+fmt(items[j])+'</button>').join("")+'</div>';
    if(!st.done)h+='<div class="actions"><button type="button" class="btn" data-ocheck'+(st.placed.length<items.length?' disabled':'')+'>'+x.check+'</button><button type="button" class="btn ghost" data-oclear'+(st.placed.length?'':' disabled')+'>'+x.clear+'</button></div>';
  } else if(type==="g"){
    const bank=E[2].concat(E[3]),sh=G.sh||(G.sh=shuffle(bank.length,seed)),parts=E[1].split("___"),nb=E[2].length;
    let s='';const filled=st.gFill.filter(v=>v!=null).length;let nextB=-1;for(let i=0;i<nb;i++)if(st.gFill[i]==null){nextB=i;break}
    parts.forEach((p,i)=>{s+=fmt(p);if(i<nb){const f=st.gFill[i];
      if(f==null)s+='<span class="blank'+(i===nextB&&!st.done?' next':'')+'">&nbsp;</span>';
      else{let c="blank filled";if(st.done)c+=" good";else if(st.gCheck&&st.gCheck[i]===true)c+=" good";else if(st.gCheck&&st.gCheck[i]===false)c+=" bad";
        s+='<button type="button" class="'+c+'" data-gun="'+i+'"'+(st.done||(st.gCheck&&st.gCheck[i]===true)?' disabled':'')+'>'+fmt(bank[f])+'</button>'}}});
    h+='<div class="qrow"><p class="gap">'+s+'</p>'+(canSpeak&&st.done?'<button type="button" class="say" data-say="'+esc(plain(fullSentence(E)))+'" data-sl="'+S.lang+'" aria-label="Écouter">'+SPK+'</button>':'')+'</div>';
    if(!st.done){
      if(!filled)h+='<p class="lead" style="font-size:.85em;margin:0 0 8px">'+x.gapTip+'</p>';
      h+='<div class="pool">'+sh.filter(j=>!st.gFill.includes(j)).map(j=>'<button type="button" class="tok" data-gfill="'+j+'"'+(filled>=nb?' disabled':'')+'>'+fmt(bank[j])+'</button>').join("")+'</div>';
      h+='<div class="actions"><button type="button" class="btn" data-gcheck'+(filled<nb?' disabled':'')+'>'+x.check+'</button><button type="button" class="btn ghost" data-gclear'+(filled?'':' disabled')+'>'+x.clear+'</button></div>';
    }
  } else if(type==="m"){
    const pairs=E[2],sh=G.sh||(G.sh=shuffle(pairs.length,seed));
    if(!st.done&&!st.mDone.length)h+='<p class="lead" style="font-size:.85em;margin:0 0 8px">'+x.matchTip+'</p>';
    h+='<div class="mgrid"><div class="mcol">'+pairs.map((p,i)=>{const d=st.mDone.includes(i);
      return '<button type="button" class="mi'+(d?' done':st.mSel===i?' sel':'')+'" data-ml="'+i+'"'+(d?' disabled':'')+'>'+(d?'<span class="pair">'+(st.mDone.indexOf(i)+1)+'</span>':'')+fmt(p[0])+'</button>'}).join("")+'</div>';
    h+='<div class="mcol">'+sh.map(j=>{const d=st.mDone.includes(j);
      return '<button type="button" class="mi'+(d?' done':st.mMiss===j?' miss':'')+'" data-mr="'+j+'"'+(d?' disabled':'')+'>'+(d?'<span class="pair">'+(st.mDone.indexOf(j)+1)+'</span>':'')+fmt(pairs[j][1])+'</button>'}).join("")+'</div></div>';
  }
  if(st.msg==="no")h+='<div class="feedback no" role="status">'+(type==="o"?x.orderNo:type==="g"?x.gapNo:type==="m"?x.matchNo:x.notyet)+'</div>';
  const steps=String(E[E.length-1]).split(" | ");
  if(st.done){
    h+='<div class="feedback ok" role="status"><b>'+x.good+'</b>'+fmt(steps.join(" "))+'</div>';
    if(type==="o"||type==="g"){const key="ex"+li+"."+k+"."+G.pos,sent=fullSentence(E);
      h+='<div class="qrow" style="margin-top:12px;align-items:center"><span style="flex:1;font-size:.9em;color:var(--soft)">'+x.mic+'</span>'+tools(sent,S.lang,key)+'</div>'+recPanel(key)}
  }
  if(!st.done&&st.hint>0)h+='<div class="hint"><h4>'+x.helpH+'</h4><ol>'+steps.slice(0,st.hint).map(s=>'<li>'+fmt(s)+'</li>').join("")+'</ol></div>';
  h+='<div class="actions">';
  if(!st.done)h+='<button type="button" class="btn help" data-hint'+(st.hint>=steps.length?' disabled':'')+'>'+(st.hint?x.more:x.help)+'</button>';
  else h+='<button type="button" class="btn" data-next>'+(G.pos===n-1?x.finish:x.next)+'</button>';
  h+='</div></div>';
  return h;
}
function solved(){const G=view.g,S=subj(view.id),c=cur(S);G.e.done=true;G.e.msg=null;P.err=P.err||{};P.errG=P.errG||{};
  if(c.k>=0){const key=c.li+"."+c.k;if(G.e.first){G.score++;if(P.err[S.id]&&P.err[S.id][key])delete P.err[S.id][key]}else (P.err[S.id]=P.err[S.id]||{})[key]=1}
  else{const arr=P.errG[S.id]=P.errG[S.id]||[];if(G.e.first){G.score++;if(c.it.id){const i=arr.findIndex(z=>z.id===c.it.id);if(i>=0)arr.splice(i,1)}}
    else if(!c.it.id){const id=Date.now()+"-"+Math.floor(Math.random()*1e6);c.it.id=id;arr.push({li:c.li,E:c.E.slice(),fig:c.E.fig||null,id});if(arr.length>30)arr.shift()}}
  save()}
function miss(){view.g.e.first=false;view.g.e.msg="no"}

/* lecture à voix haute de toute une partie */
function readAll(which){const S=subj(view.id),L=S.L[view.i];const texts=which==="d"?(L.d||[]).flatMap(s=>[s[0],s[1]]):L.k;try{speechSynthesis.cancel();view.reading=true;
  texts.forEach((s,j)=>{const u=new SpeechSynthesisUtterance(plain(s));u.lang=S.lang==="ar"?"ar-SA":"fr-FR";u.rate=.85;if(j===texts.length-1)u.onend=()=>{view.reading=false;render()};speechSynthesis.speak(u)})}catch(e){view.reading=false}render()}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b||b.disabled)return;const d=b.dataset;
  if(b.id==="bLang"){lang=lang==="ar"?"fr":"ar";ls(KEY+"-lang",lang);render();return}
  if(b.id==="bSize"){size=size%3+1;ls(KEY+"-size",size);render();return}
  if(d.say!=null){speak(d.say,d.sl);return}
  if(d.readall!=null){if(view.reading){try{speechSynthesis.cancel()}catch(e){}view.reading=false;render()}else readAll(d.readall);return}
  if(d.rec!=null){if(R.on&&R.key===d.rk){stopRec();return}startRec(d.rec,d.sl,d.rk);return}
  if(d.recstop!=null){stopRec();return}
  const stopRead=()=>{try{if(view.reading)speechSynthesis.cancel()}catch(e){}view.reading=false};
  const go=v=>{resetRec();stopRead();view=v;render();scrollTo(0,0)};
  if(d.go){go({s:d.go});return}
  if(d.subj){go({s:"subj",id:d.subj});return}
  if(d.lesson!=null){go({s:"lesson",id:view.id,i:+d.lesson,step:0,lv:1});return}
  if(d.back!=null||d.backsubj!=null){go({s:"subj",id:view.id});return}
  if(d.quiz){stopRead();startQuiz(d.quiz);render();scrollTo(0,0);return}
  if(d.step!=null){resetRec();stopRead();view.step=+d.step;view.g=null;render();scrollTo(0,0);return}
  if(d.lv!=null){view.lv=+d.lv;render();return}
  if(d.wxs!=null){view.wx=view.wx||{};view.wx[d.wxs]=(view.wx[d.wxs]||0)+1;render();return}
  if(d.wxa!=null){view.wx=view.wx||{};view.wx[d.wxa]=99;render();return}
  if(d.wxr!=null){view.wx=view.wx||{};view.wx[d.wxr]=0;render();return}
  if(d.reset!=null){view.confirm=true;render();return}
  if(d.nowipe!=null){view.confirm=false;render();return}
  if(d.wipe!=null){P={read:{},ex:{},err:{},errG:{},gen:{},stars:0};save();view.confirm=false;render();return}
  if(d.set!=null){startSet(+d.set);render();scrollTo(0,0);return}
  if(d.gen!=null){view.lv=+d.gen;startGen(+d.gen);render();scrollTo(0,0);return}
  if(d.sets!=null){resetRec();view.g=null;render();scrollTo(0,0);return}
  const G=view.g;if(!G||G.end||!G.list.length)return;const S=subj(view.id),{E}=cur(S),st=G.e;
  if(d.again!=null){startSet(G.set);render();return}
  if(d.hint!=null){st.hint++;render();return}
  if(d.next!=null){resetRec();
    if(G.pos<G.list.length-1){G.pos++;G.e=newEx();G.sh=null}
    else{G.end=true;P.stars=(P.stars||0)+1;
      if(G.mode==="set"){const all=P.ex[S.id]=P.ex[S.id]||{};let e=all[view.i];if(!e||typeof e!=="object")e=all[view.i]={};const key=G.lv+"-"+G.set;e[key]=Math.max(e[key]??0,G.score)}
      if(G.mode==="gen"){const g=P.gen[S.id]=P.gen[S.id]||{};g[view.i]=(g[view.i]||0)+1}
      save()}
    render();scrollTo(0,0);return}
  if(d.opt!=null){const j=+d.opt,ans=E[0]==="q"?E[3]:(E[2]?0:1);if(j===ans)solved();else{st.tried.push(j);miss()}render();return}
  if(d.place!=null){st.placed.push(+d.place);st.ordCheck=null;st.msg=null;render();return}
  if(d.unplace!=null){st.placed.splice(+d.unplace,1);st.ordCheck=null;st.msg=null;render();return}
  if(d.oclear!=null){st.placed=[];st.ordCheck=null;st.msg=null;render();return}
  if(d.ocheck!=null){const chk=st.placed.map((j,p)=>E[2][j]===E[2][p]);if(chk.every(Boolean))solved();else{st.ordCheck=chk;miss()}render();return}
  if(d.gfill!=null){const nb=E[2].length;let k=-1;for(let i=0;i<nb;i++)if(st.gFill[i]==null){k=i;break}if(k>=0){st.gFill[k]=+d.gfill;if(st.gCheck)st.gCheck[k]=null;st.msg=null}render();return}
  if(d.gun!=null){const i=+d.gun;st.gFill[i]=null;if(st.gCheck)st.gCheck[i]=null;st.msg=null;render();return}
  if(d.gclear!=null){st.gFill=st.gFill.map((f,i)=>st.gCheck&&st.gCheck[i]===true?f:null);st.msg=null;render();return}
  if(d.gcheck!=null){const bank=E[2].concat(E[3]);const chk=E[2].map((a,i)=>st.gFill[i]!=null&&bank[st.gFill[i]]===a);if(chk.every(Boolean))solved();else{st.gCheck=chk;miss()}render();return}
  if(d.ml!=null){st.mSel=+d.ml;st.mMiss=null;st.msg=null;render();return}
  if(d.mr!=null){const j=+d.mr;if(st.mSel==null)return;
    if(j===st.mSel){st.mDone.push(j);st.mSel=null;st.mMiss=null;st.msg=null;if(st.mDone.length===E[2].length)solved()}
    else{st.mMiss=j;miss()}render();return}
});
// préparation des données
LVX.forEach(([sid,li,lv,E])=>{const S=subj(sid);if(S&&S.L[li]){E.lv=lv;S.L[li].x.push(E)}});
applyFigs();
render();
</script>
