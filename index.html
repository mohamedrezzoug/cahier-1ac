/*12*/{s:"الجغرافيا — المحور 1: مكونات وخصائص كوكبنا",t:"الأرض: شكلها وتمثيلها",
k:["الأرض <b>كروية</b> الشكل، مفلطحة قليلا عند القطبين.","من أدلة كروية الأرض: صور الأقمار الاصطناعية، اختفاء السفينة تدريجيا في الأفق، ورحلة <b>ماجلان</b> حول العالم (1519–1522).","قاس العالم الإغريقي <b>إراتوستين</b> محيط الأرض بدقة كبيرة منذ أكثر من 2000 سنة.","نمثل الأرض بـ<b>مجسم الكرة الأرضية</b> (يحترم الشكل) أو بـ<b>الخريطة</b> (مسطحة وسهلة الحمل).","عناصر الخريطة: <b>العنوان</b>، <b>المفتاح</b>، <b>السلم</b>، <b>اتجاه الشمال</b>، الإطار، المصدر.","<b>السلم</b> يبين النسبة بين المسافة على الخريطة والمسافة الحقيقية."],
w:[["مجسم الكرة الأرضية","نموذج كروي يمثل الأرض"],["الخريطة","تمثيل مسطح لسطح الأرض"],["السلم","النسبة بين المسافة على الخريطة والمسافة الحقيقية"],["المفتاح","شرح الرموز والألوان في الخريطة"],["مفلطحة","مسطحة قليلا"]],
x:[["q","شكل الأرض:",["كروي مفلطح قليلا عند القطبين","مسطح","مكعب"],0,"صور الأقمار الاصطناعية تؤكد ذلك."],
["q","العنصر الذي يشرح رموز الخريطة:",["المفتاح","السلم","العنوان"],0,"يسمى أيضا المفتاح أو الدليل."],
["q","قام برحلة حول العالم بين 1519 و1522:",["ماجلان","إراتوستين","الإدريسي"],0,"أثبتت كروية الأرض."],
["vf","الخريطة تحترم شكل الأرض أكثر من المجسم.",false,"المجسم يحترم الشكل الكروي، والخريطة تشوهه قليلا."],
["q","سلم الخريطة 1/100 000: 1 سم يساوي:",["1 كلم","100 م","10 كلم"],0,"100 000 سم = 1 كلم."]],
d:[["كيف عرف الإنسان شكل الأرض؟","لاحظ القدماء أن ظل الأرض على القمر أثناء الخسوف دائري، وأن السفينة المبتعدة يختفي هيكلها قبل شراعها. قاس إراتوستين محيط الأرض بمقارنة ظل الشمس في مدينتين مصريتين. وأخيرا أكدت صور الفضاء أن الأرض كرة."],
["المجسم والخريطة","المجسم يمثل الأرض بشكلها الحقيقي، لكنه صغير ولا يظهر التفاصيل ولا نرى إلا نصفه. الخريطة سهلة الاستعمال وتظهر التفاصيل، لكن تحويل الكرة إلى سطح مستو يسبب تشوها في المساحات والأشكال، خاصة قرب القطبين."],
["استعمال السلم","سلم 1/50 000 يعني أن 1 سم على الخريطة يمثل 50 000 سم في الواقع، أي 500 م. لحساب المسافة الحقيقية: نقيس المسافة على الخريطة بالمسطرة ونضربها في مقام السلم، ثم نحول إلى الكيلومتر."]],
wx:[["المسافة بين مدينتين على خريطة سلمها 1/1 000 000 هي 5 سم. ما المسافة الحقيقية؟",["5 × 1 000 000 = 5 000 000 سم.","5 000 000 سم = 50 000 م.","المسافة الحقيقية = 50 كلم."]]]},

/*13*/{t:"التدرب على رسم الإحداثيات وتحديد الموقع",
k:["<b>خطوط العرض</b> دوائر موازية لخط الاستواء. خط الاستواء هو <b>0°</b>، والقطبان <b>90°</b> شمالا وجنوبا.","<b>خطوط الطول</b> أنصاف دوائر تمتد من القطب الشمالي إلى القطب الجنوبي. خط <b>غرينتش</b> هو <b>0°</b>، وتصل إلى <b>180°</b> شرقا وغربا.","خط الاستواء يقسم الأرض إلى نصف شمالي ونصف جنوبي، وخط غرينتش إلى نصف شرقي ونصف غربي.","<b>الإحداثيات الجغرافية</b> لموقع: درجة العرض ودرجة الطول، مثل (34° شمالا، 6° غربا) للرباط تقريبا.","يقع المغرب في نصف الكرة <b>الشمالي</b> و<b>الغربي</b>، تقريبا بين خطي العرض 21° و36° شمالا.","يقع المغرب في شمال غرب <b>إفريقيا</b>، تحده شمالا البحر الأبيض المتوسط وغربا المحيط الأطلنتي."],
w:[["خطوط العرض","دوائر موازية لخط الاستواء"],["خطوط الطول","أنصاف دوائر من قطب إلى قطب"],["خط الاستواء","خط العرض 0°"],["خط غرينتش","خط الطول 0°"],["الإحداثيات الجغرافية","درجة العرض ودرجة الطول لموقع"]],
x:[["q","خط العرض 0° هو:",["خط الاستواء","خط غرينتش","مدار السرطان"],0,"يقسم الأرض إلى نصفين شمالي وجنوبي."],
["q","خط الطول 0° هو:",["خط غرينتش","خط الاستواء"],0,"يمر قرب لندن."],
["q","يقع المغرب في نصف الكرة:",["الشمالي الغربي","الجنوبي الشرقي","الجنوبي الغربي"],0,"شمال خط الاستواء وغرب غرينتش."],
["vf","أقصى درجة لخط العرض 180°.",false,"خطوط العرض تصل إلى 90° فقط. خطوط الطول تصل إلى 180°."],
["m","اربط.",[["خطوط العرض","من 0° إلى 90°"],["خطوط الطول","من 0° إلى 180°"],["القطب الشمالي","90° شمالا"]],"راجع الملخص."]],
d:[["لماذا نحتاج إلى الإحداثيات؟","سطح الأرض كبير جدا، ولتحديد موقع أي نقطة بدقة اتفق الجغرافيون على شبكة من الخطوط الوهمية. كل نقطة تحدد بتقاطع خط عرض وخط طول، تماما مثل المعلم في الرياضيات."],
["قراءة الإحداثيات","نكتب أولا درجة العرض مع تحديد شمالا أو جنوبا، ثم درجة الطول مع تحديد شرقا أو غربا. مثال: مدينة تقع على 30° شمالا و10° غربا. على الخريطة: نتبع خط العرض 30° حتى يلتقي بخط الطول 10° غربا."],
["موقع المغرب","المغرب بلد إفريقي يطل على واجهتين بحريتين: البحر الأبيض المتوسط والمحيط الأطلنتي. يفصله مضيق جبل طارق (حوالي 14 كلم) عن أوروبا. هذا الموقع جعله ملتقى بين إفريقيا وأوروبا والعالم العربي."]],
wx:[["نقطة على خط العرض 0° وخط الطول 0°. أين تقع؟",["خط العرض 0° هو خط الاستواء.","خط الطول 0° هو خط غرينتش.","النقطة تقع في التقاء الخطين، في خليج غينيا بالمحيط الأطلنتي."]]]},

/*14*/{t:"الأرض في الكون",
k:["<b>الكون</b> فضاء واسع يضم ملايير <b>المجرات</b>. مجرتنا هي <b>درب التبانة</b>.","<b>المجموعة الشمسية</b>: الشمس (نجم) و<b>8 كواكب</b>: عطارد، الزهرة، <b>الأرض</b>، المريخ، المشتري، زحل، أورانوس، نبتون.","الأرض هي الكوكب الثالث، والوحيد المعروف بوجود الحياة (الماء السائل، الهواء، حرارة مناسبة).","<b>دوران الأرض حول نفسها</b> يستغرق <b>24 ساعة</b>: ينتج عنه تعاقب <b>الليل والنهار</b>.","<b>دوران الأرض حول الشمس</b> يستغرق <b>365 يوما و6 ساعات</b>: ينتج عنه <b>الفصول الأربعة</b>.","<b>القمر</b> تابع للأرض، يدور حولها في حوالي <b>29.5 يوما</b>، ومنه <b>أوجه القمر</b> (هلال، بدر…)."],
w:[["المجرة","تجمع هائل من النجوم"],["درب التبانة","المجرة التي تنتمي إليها الشمس"],["الكوكب","جسم يدور حول نجم ولا يشع ضوءا"],["الدوران حول النفس","دورة الأرض حول محورها في 24 ساعة"],["الكسوف","اختفاء الشمس بسبب مرور القمر أمامها"]],
x:[["q","ترتيب الأرض بين كواكب المجموعة الشمسية:",["الثالث","الأول","الخامس"],0,"بعد عطارد والزهرة."],
["q","تعاقب الليل والنهار ناتج عن:",["دوران الأرض حول نفسها","دوران الأرض حول الشمس","دوران القمر"],0,"في 24 ساعة."],
["q","الفصول الأربعة ناتجة عن:",["دوران الأرض حول الشمس","دوران الأرض حول نفسها"],0,"في سنة، مع ميل محور الأرض."],
["vf","الشمس كوكب.",false,"الشمس نجم يشع الضوء والحرارة."],
["q","عدد كواكب المجموعة الشمسية:",["8","9","12"],0,"عطارد … نبتون."]],
d:[["من الكون إلى الأرض","الكون يضم ملايير المجرات، وكل مجرة تضم ملايير النجوم. الشمس نجم متوسط في مجرة درب التبانة. حولها تدور الكواكب الثمانية والكواكب القزمة والكويكبات. الأرض هي الكوكب الثالث، على بعد حوالي 150 مليون كلم من الشمس."],
["حركتا الأرض","تدور الأرض حول محورها المائل من الغرب إلى الشرق، لذلك تشرق الشمس من الشرق. نصف الأرض المقابل للشمس يعيش النهار والنصف الآخر الليل. وتدور حول الشمس في سنة، ومع ميل محورها تتغير زاوية أشعة الشمس فتتعاقب الفصول."],
["القمر","القمر لا يشع الضوء، بل يعكس ضوء الشمس. حسب موقعه بالنسبة للأرض والشمس نرى منه جزءا مضاء يتغير: محاق، هلال، تربيع، بدر. يعتمد التقويم الهجري على دورة القمر. الخسوف: الأرض بين الشمس والقمر. الكسوف: القمر بين الشمس والأرض."]],
wx:[["لماذا يكون النهار في المغرب حين يكون الليل في أستراليا؟",["الأرض كروية وتدور حول نفسها.","الوجه المقابل للشمس يعيش النهار، والوجه الآخر الليل.","المغرب وأستراليا في جهتين متقابلتين تقريبا من الأرض."]]]},

/*15*/{t:"الأرض كوكب في تحول مستمر",
k:["يتغير سطح الأرض باستمرار بفعل <b>عوامل باطنية</b> و<b>عوامل خارجية</b> و<b>تدخل الإنسان</b>.","العوامل الباطنية: <b>البراكين</b>، <b>الزلازل</b>، الالتواءات والانكسارات التي تكون الجبال.","العوامل الخارجية: <b>التعرية</b> بالمياه (الأمطار، الأودية، الأمواج)، والرياح، والحرارة.","<b>التعرية النهرية</b> تحفر الأودية وتنقل الرواسب وترسبها في السهول والمصبات.","<b>التعرية الريحية</b> تنحت الصخور وتكون الكثبان الرملية في الصحاري.","يغير الإنسان سطح الأرض: المناجم، السدود، المدن، الطرق، المزارع."],
w:[["العوامل الباطنية","قوى من داخل الأرض"],["التعرية","نحت ونقل الصخور بالماء والرياح"],["البركان","فتحة تخرج منها الصهارة"],["الزلزال","اهتزاز مفاجئ لسطح الأرض"],["الكثبان الرملية","تلال من الرمل تكونها الرياح"]],
x:[["q","من العوامل الباطنية:",["الزلازل","الأمطار","الرياح"],0,"قوى من داخل الأرض."],
["q","تكون الكثبان الرملية بفعل:",["الرياح","البراكين","الأمواج"],0,"التعرية الريحية."],
["vf","الإنسان لا يغير سطح الأرض.",false,"المناجم والسدود والمدن تغير السطح."],
["m","اربط.",[["البركان","عامل باطني"],["الوادي","عامل خارجي"],["السد","تدخل الإنسان"]],"صنف العوامل."]],
d:[["العوامل الباطنية","في باطن الأرض حرارة عالية وقوى كبيرة تحرك أجزاء من القشرة الأرضية. ينتج عن ذلك ارتفاع الجبال (مثل الأطلس)، والزلازل (زلزال أكادير 1960، زلزال الحوز 2023)، والبراكين. هذه العوامل غالبا بطيئة، لكن بعضها مفاجئ وخطير."],
["العوامل الخارجية","المياه والرياح والحرارة تنحت الصخور ببطء، وتنقل الفتات إلى أماكن أخرى. الأودية تحفر مجاريها في الجبال وتترك الطمي في السهول. الأمواج تنحت السواحل. الرياح في الصحراء تنقل الرمال وتنحت الصخور."],
["الإنسان عامل جيومورفولوجي","يحفر الإنسان المناجم ويبني السدود والمدن، ويشق الطرق والأنفاق. وقد يسرع بعض الظواهر مثل انجراف التربة بقطع الغابات. لذلك يجب أن يتدخل بشكل مسؤول."]],
wx:[["صنف: زلزال، تعرية الأمواج، حفر منجم.",["الزلزال: عامل باطني.","تعرية الأمواج: عامل خارجي.","حفر منجم: تدخل الإنسان."]]]},

/*16*/{t:"اليابس والمائي",
k:["يغطي <b>الماء</b> حوالي <b>71%</b> من سطح الأرض، و<b>اليابس</b> حوالي <b>29%</b>.","القارات: <b>آسيا</b> (أكبرها)، <b>إفريقيا</b>، أمريكا الشمالية، أمريكا الجنوبية، القارة القطبية الجنوبية، <b>أوروبا</b>، <b>أوقيانوسيا</b> (أصغرها).","المحيطات: <b>الهادي</b> (أكبرها)، <b>الأطلنتي</b>، الهندي، المتجمد الجنوبي، المتجمد الشمالي.","أشكال التضاريس: <b>الجبال</b> (مرتفعة، منحدرات قوية)، <b>الهضاب</b> (مرتفعة ومستوية)، <b>السهول</b> (منخفضة ومستوية).","حوالي <b>97%</b> من مياه الأرض مالحة، والمياه العذبة قليلة ومعظمها متجمد.","أعلى قمة في العالم: إفرست (حوالي 8849 م). أعلى قمة في المغرب: <b>توبقال</b> (4167 م)."],
w:[["اليابس","الأجزاء غير المغطاة بالماء"],["القارة","كتلة كبيرة من اليابس"],["المحيط","مسطح مائي مالح شاسع"],["الهضبة","أرض مرتفعة سطحها مستو"],["السهل","أرض منخفضة مستوية"]],
x:[["q","أكبر القارات:",["آسيا","إفريقيا","أوروبا"],0,"أكبرها مساحة وسكانا."],
["q","أكبر المحيطات:",["الهادي","الأطلنتي","الهندي"],0,"يغطي حوالي ثلث سطح الأرض."],
["q","نسبة الماء من سطح الأرض حوالي:",["71%","29%","50%"],0,"لذلك تسمى الكوكب الأزرق."],
["vf","أعلى قمة في المغرب هي توبقال.",true,"4167 م في الأطلس الكبير."],
["m","اربط.",[["الجبل","مرتفع بمنحدرات قوية"],["الهضبة","مرتفعة ومستوية"],["السهل","منخفض ومستو"]],"أشكال التضاريس."]],
d:[["توزيع اليابس والماء","الماء أكثر من اليابس، والتوزيع غير متساو: نصف الكرة الشمالي يضم أغلب اليابس، والنصف الجنوبي يغلب عليه الماء. القارات تفصلها المحيطات، وبعضها متصل مثل إفريقيا وآسيا عبر شبه جزيرة سيناء."],
["مكونات اليابس","يتكون اليابس من أشكال تضاريسية متنوعة. الجبال كثيرة في المغرب (الريف، الأطلس المتوسط، الأطلس الكبير، الأطلس الصغير). الهضاب مثل الهضاب العليا الشرقية. السهول مثل الغرب وسايس وتادلة والحوز، وهي مهمة للفلاحة."],
["الغلاف المائي","يضم المحيطات والبحار والأنهار والبحيرات والمياه الجوفية والجليد. المياه المالحة غير صالحة للشرب والسقي مباشرة. المياه العذبة المتاحة قليلة جدا، لذلك يجب ترشيد استهلاكها."]],
wx:[["رتب القارات التالية من الأكبر إلى الأصغر: أوروبا، آسيا، إفريقيا.",["آسيا أكبر القارات.","ثم إفريقيا.","ثم أوروبا."]]]},

/*17*/{t:"الغلاف الجوي",
k:["<b>الغلاف الجوي</b> طبقة من الهواء تحيط بالأرض، يتكون أساسا من <b>الآزوت (78%)</b> و<b>الأكسجين (21%)</b>.","طبقاته: <b>التروبوسفير</b> (القريبة من الأرض، فيها تحدث الظواهر الجوية)، <b>الستراتوسفير</b> (فيها طبقة <b>الأوزون</b>)، الميزوسفير، الثرموسفير.","<b>الطقس</b>: حالة الجو في مكان ما خلال مدة قصيرة. <b>المناخ</b>: معدل حالة الجو خلال مدة طويلة (30 سنة).","عناصر الطقس والمناخ: <b>الحرارة</b> (ميزان الحرارة، °C)، <b>التساقطات</b> (المقياس المطري، ملم)، <b>الضغط الجوي</b> (البارومتر، هكتوباسكال)، <b>الرياح</b>.","تهب الرياح من مناطق <b>الضغط المرتفع</b> نحو مناطق <b>الضغط المنخفض</b>.","المناطق المناخية: <b>الحارة</b> (قرب خط الاستواء)، <b>المعتدلة</b>، <b>الباردة</b> (قرب القطبين)."],
w:[["الغلاف الجوي","طبقة الهواء المحيطة بالأرض"],["الأوزون","غاز يحمي من الأشعة فوق البنفسجية"],["الطقس","حالة الجو في مدة قصيرة"],["المناخ","معدل حالة الجو خلال مدة طويلة"],["المقياس المطري","أداة لقياس كمية الأمطار"]],
x:[["q","الطبقة التي تحدث فيها الظواهر الجوية:",["التروبوسفير","الستراتوسفير","الثرموسفير"],0,"القريبة من سطح الأرض."],
["q","تقاس كمية الأمطار بـ:",["المقياس المطري","البارومتر","ميزان الحرارة"],0,"بالملمتر."],
["q","تهب الرياح من:",["الضغط المرتفع نحو الضغط المنخفض","الضغط المنخفض نحو المرتفع"],0,"مثل الهواء الذي يخرج من بالون."],
["vf","الطقس والمناخ لهما نفس المعنى.",false,"الطقس مدة قصيرة، المناخ مدة طويلة."],
["m","اربط كل عنصر بأداة قياسه.",[["الحرارة","ميزان الحرارة"],["الضغط الجوي","البارومتر"],["التساقطات","المقياس المطري"]],"راجع الملخص."]],
d:[["أهمية الغلاف الجوي","يوفر الهواء الذي نتنفسه، ويحمينا من الأشعة الضارة بفضل طبقة الأوزون، ويحافظ على حرارة الأرض (بدونه تكون الليالي شديدة البرودة)، ويحرق النيازك الصغيرة قبل وصولها."],
["عناصر الطقس","تقيس محطات الأرصاد الجوية الحرارة والأمطار والضغط والرياح (السرعة بالأنيمومتر والاتجاه بدوارة الرياح). تنخفض الحرارة كلما ارتفعنا: حوالي 6 درجات كل 1000 م، لذلك تكون قمم الأطلس مكسوة بالثلوج."],
["المناطق المناخية","المنطقة الحارة بين المدارين، أمطارها غزيرة قرب خط الاستواء، وصحراوية جافة قرب المدارين (الصحراء الكبرى). المنطقة المعتدلة بفصول متمايزة، ومنها المناخ المتوسطي في شمال المغرب (صيف حار جاف وشتاء معتدل ممطر). المنطقة الباردة قرب القطبين."]],
wx:[["معدل الحرارة في قمة جبل على ارتفاع 2000 م، إذا كانت 20 °C في السهل (0 م)؟",["تنخفض الحرارة حوالي 6 °C كل 1000 م.","على 2000 م: 2 × 6 = 12 °C أقل.","20 − 12 = 8 °C تقريبا."]]]},

/*18*/{s:"الجغرافيا — المحور 2: الإنسان وأنشطته الاقتصادية",t:"دينامية السكان وتوزيعهم",
k:["تجاوز عدد سكان العالم <b>8 ملايير</b> نسمة، ويتزايد باستمرار.","<b>النمو الطبيعي</b> = عدد المواليد − عدد الوفيات.","<b>معدل الولادات</b> = (عدد المواليد ÷ عدد السكان) × 1000. ونفس الطريقة لـ<b>معدل الوفيات</b>.","يختلف النمو: سريع في كثير من الدول النامية، وبطيء في الدول المتقدمة.","التوزيع <b>غير متكافئ</b>: تجمعات كبرى (شرق آسيا، جنوب آسيا، أوروبا الغربية) ومناطق شبه فارغة (الصحاري، القطبان، الغابات الاستوائية).","<b>التمدن</b>: تزايد نسبة السكان الذين يعيشون في المدن."],
w:[["النمو الطبيعي","الفرق بين المواليد والوفيات"],["معدل الولادات","عدد المواليد لكل 1000 نسمة"],["التمدن","انتقال السكان إلى المدن"],["التجمع السكاني","منطقة كثيفة السكان"],["الهجرة","انتقال السكان من مكان إلى آخر"]],
x:[["q","النمو الطبيعي يساوي:",["المواليد ناقص الوفيات","الوفيات ناقص المواليد","المواليد زائد الوفيات"],0,"تعريف."],
["q","مدينة فيها 5000 مولود و2000 وفاة. النمو الطبيعي:",["3000","7000","2500"],0,"5000 − 2000."],
["q","منطقة قليلة السكان:",["الصحراء الكبرى","شرق آسيا","أوروبا الغربية"],0,"ظروف طبيعية صعبة."],
["vf","توزيع السكان في العالم متساو.",false,"هناك تجمعات كبرى ومناطق شبه فارغة."]],
d:[["تطور عدد السكان","ظل عدد السكان ضعيفا لقرون طويلة، ثم تزايد بسرعة منذ القرن 19 والقرن 20 بفضل تقدم الطب وتحسن التغذية ونقص الوفيات. وصل إلى 8 ملايير حوالي سنة 2022."],
["عوامل التوزيع","عوامل طبيعية: المناخ المعتدل، توفر الماء، السهول الخصبة تجذب السكان؛ والصحاري والجبال العالية والمناطق الباردة تنفرهم. عوامل بشرية: التاريخ، الأنشطة الاقتصادية، المدن، فرص الشغل."],
["حساب المعدلات","في بلد عدد سكانه 2 000 000 نسمة وسجل 40 000 مولود: معدل الولادات = 40 000 ÷ 2 000 000 × 1000 = 20 في الألف. إذا سجل 10 000 وفاة: معدل الوفيات = 5 في الألف. معدل النمو الطبيعي = 20 − 5 = 15 في الألف."]],
wx:[["بلد عدد سكانه 1 000 000 نسمة، سجل 25 000 مولود. احسب معدل الولادات.",["معدل الولادات = (المواليد ÷ السكان) × 1000.","= 25 000 ÷ 1 000 000 × 1000.","= 25 في الألف."]]]},

/*19*/{t:"التدرب على تمثيل البنية السكانية والكثافة السكانية",
k:["<b>البنية السكانية</b>: توزيع السكان حسب <b>السن</b> و<b>الجنس</b>.","نمثلها بـ<b>الهرم السكاني</b>: الذكور على اليسار، الإناث على اليمين، والفئات العمرية من الأسفل (الصغار) إلى الأعلى (الكبار).","هرم بـ<b>قاعدة عريضة</b> وقمة ضيقة: سكان <b>شباب</b> (أغلب الدول النامية).","هرم بقاعدة ضيقة وقمة عريضة نسبيا: سكان <b>شائخون</b> (أغلب الدول المتقدمة).","<b>الكثافة السكانية</b> = عدد السكان ÷ المساحة (نسمة/كلم²).","نمثل الكثافة على خريطة بألوان: كلما كان اللون أغمق كانت الكثافة أكبر."],
w:[["البنية السكانية","توزيع السكان حسب السن والجنس"],["الهرم السكاني","رسم يمثل البنية السكانية"],["الكثافة السكانية","عدد السكان في كل كلم²"],["الفئة العمرية","مجموعة سكان من نفس الأعمار"],["مجتمع شاب","نسبة الأطفال والشباب مرتفعة"]],
x:[["q","هرم سكاني بقاعدة عريضة يدل على:",["سكان شباب","سكان شائخين"],0,"كثرة الأطفال."],
["q","منطقة مساحتها 100 كلم² وسكانها 5000 نسمة. الكثافة:",["50 ن/كلم²","500 ن/كلم²","5 ن/كلم²"],0,"5000 ÷ 100."],
["vf","في الهرم السكاني، الذكور على اليسار.",true,"والإناث على اليمين."],
["q","الكثافة السكانية تحسب بقسمة:",["عدد السكان على المساحة","المساحة على عدد السكان"],0,"نسمة لكل كلم²."]],
d:[["قراءة الهرم السكاني","المحور العمودي يمثل الأعمار، والأفقي عدد السكان أو نسبتهم. كل مستطيل فئة عمرية (0–4 سنوات، 5–9…). الشكل العام يخبرنا عن الولادات والوفيات: قاعدة عريضة = ولادات كثيرة؛ ضيق سريع نحو الأعلى = وفيات مرتفعة أو أمل حياة ضعيف."],
["حساب الكثافة","المغرب: حوالي 37 مليون نسمة ومساحة حوالي 710 000 كلم² (مع الأقاليم الجنوبية)، الكثافة حوالي 52 ن/كلم². لكن الكثافة تختلف كثيرا: مرتفعة جدا في المدن والسهول الأطلنتية، وضعيفة في الجنوب الصحراوي."],
["تمثيل الكثافة","نصنف المناطق إلى فئات (أقل من 10، من 10 إلى 50، أكثر من 50…) ونعطي لكل فئة لونا، من الفاتح إلى الغامق. نضيف المفتاح لشرح الألوان."]],
wx:[["إقليم سكانه 600 000 نسمة ومساحته 3000 كلم². احسب الكثافة.",["الكثافة = السكان ÷ المساحة.","600 000 ÷ 3000 = 200.","الكثافة = 200 نسمة/كلم²."]]]},

/*20*/{t:"أنشطة السكان: الفلاحة",
k:["<b>الفلاحة</b> نشاط يشمل <b>الزراعة</b> و<b>تربية الماشية</b>، ويوفر الغذاء والمواد الأولية.","مقوماتها <b>الطبيعية</b>: التربة، الماء، المناخ، التضاريس. <b>البشرية</b>: اليد العاملة، رؤوس الأموال، التقنيات، الأسواق.","<b>الفلاحة المعاشية (التقليدية)</b>: إنتاج لحاجة الأسرة، أدوات بسيطة، مردود ضعيف.","<b>الفلاحة التسويقية (العصرية)</b>: إنتاج للبيع، مكننة، أسمدة، مردود مرتفع.","<b>الفلاحة السقوية</b> تعتمد على الري، و<b>البورية</b> على الأمطار.","منتجات كبرى: <b>الحبوب</b> (القمح، الأرز في آسيا الموسمية، الذرة)، منتجات صناعية (القطن، قصب السكر)، تربية الماشية."],
w:[["الفلاحة المعاشية","إنتاج لاستهلاك الأسرة"],["الفلاحة التسويقية","إنتاج من أجل البيع"],["الفلاحة السقوية","تعتمد على الري"],["الفلاحة البورية","تعتمد على الأمطار"],["المكننة","استعمال الآلات"]],
x:[["q","الفلاحة التي تعتمد على الأمطار:",["البورية","السقوية"],0,"بور = بدون ري."],
["q","من خصائص الفلاحة التسويقية:",["المكننة والمردود المرتفع","الأدوات البسيطة"],0,"إنتاج من أجل السوق."],
["m","اربط.",[["التربة والماء","مقومات طبيعية"],["اليد العاملة والرساميل","مقومات بشرية"]],"صنف المقومات."],
["vf","الأرز يزرع بكثرة في آسيا الموسمية.",true,"يحتاج إلى الماء الكثير."]],
d:[["أهمية الفلاحة","الفلاحة تشغل نسبة كبيرة من السكان في الدول النامية، وفي المغرب يشتغل فيها جزء مهم من السكان النشيطين. توفر الغذاء والمواد الأولية للصناعة (القطن، الشمندر السكري) وتساهم في الصادرات."],
["نوعان من الفلاحة","في الفلاحة المعاشية: مساحات صغيرة، محراث تقليدي، زراعة متنوعة لحاجة الأسرة. في الفلاحة التسويقية: ضيعات كبيرة، جرارات وحاصدات، ري بالتنقيط، بذور مختارة، إنتاج للتصدير."],
["الفلاحة في العالم","تختلف الأنظمة حسب المناخ والتقنيات: الحبوب في السهول الكبرى بأمريكا الشمالية وأوروبا، الأرز في آسيا الموسمية، المزارع الاستوائية (البن، الكاكاو)، والرعي في المناطق الجافة."]],
wx:[["قارن بين الفلاحة المعاشية والتسويقية من حيث الهدف.",["المعاشية: الهدف هو توفير حاجيات الأسرة.","التسويقية: الهدف هو البيع في السوق والربح.","لذلك تستعمل التسويقية تقنيات حديثة لرفع الإنتاج."]]]},

/*21*/{t:"أنشطة السكان: الصناعة",
k:["<b>الصناعة</b> تحويل <b>المواد الأولية</b> إلى مواد مصنعة أو نصف مصنعة.","مقوماتها: المواد الأولية، <b>الطاقة</b>، <b>رؤوس الأموال</b>، <b>اليد العاملة</b>، <b>الأسواق</b>، وسائل النقل، التكنولوجيا.","بدأت <b>الثورة الصناعية</b> في <b>بريطانيا</b> في <b>القرن 18</b> مع استعمال <b>الآلة البخارية</b>.","أنواع الصناعات: <b>ثقيلة</b> (الحديد والصلب، البتروكيماويات)، <b>خفيفة</b> (النسيج، الصناعات الغذائية)، <b>تكنولوجيا عالية</b> (الإلكترونيات، الطيران).","المناطق الصناعية الكبرى: <b>أمريكا الشمالية</b>، <b>أوروبا الغربية</b>، <b>شرق آسيا</b> (الصين، اليابان، كوريا الجنوبية).","في المغرب: صناعة السيارات (طنجة، القنيطرة)، الفوسفاط ومشتقاته، النسيج، الصناعات الغذائية."],
w:[["الصناعة","تحويل المواد الأولية"],["المواد الأولية","مواد خام قبل تحويلها"],["الثورة الصناعية","التحول نحو الإنتاج بالآلات"],["الصناعة الثقيلة","صناعة تستعمل مواد وآلات ضخمة"],["الصناعة الخفيفة","صناعة لمنتجات الاستهلاك"]],
x:[["q","بدأت الثورة الصناعية في:",["بريطانيا","الصين","المغرب"],0,"القرن 18."],
["q","صناعة النسيج من الصناعات:",["الخفيفة","الثقيلة"],0,"منتجات استهلاكية."],
["q","من المقومات البشرية للصناعة:",["اليد العاملة","المعادن"],0,"المعادن مقوم طبيعي."],
["vf","شرق آسيا من المناطق الصناعية الكبرى.",true,"الصين واليابان وكوريا الجنوبية."]],
d:[["من الحرفة إلى المصنع","قبل الثورة الصناعية، كان الإنتاج يدويا في ورشات صغيرة. مع الآلة البخارية والفحم في بريطانيا، ظهرت المصانع الكبرى والإنتاج بكميات كبيرة، ثم انتشرت الصناعة في أوروبا وأمريكا. وبعدها جاءت الكهرباء والبترول ثم الإلكترونيات."],
["توطين الصناعة","تتوطن المصانع قرب المواد الأولية (مناجم الفحم والحديد)، أو قرب الموانئ لتسهيل الاستيراد والتصدير، أو قرب المدن الكبرى حيث اليد العاملة والأسواق. في المغرب، تتركز الصناعة في محور طنجة–الدار البيضاء–الجديدة."],
["أنواع الصناعة","الصناعة الثقيلة تحتاج إلى رساميل ضخمة (الحديد والصلب، صناعة السفن). الصناعة الخفيفة تنتج مواد الاستهلاك اليومي. صناعات التكنولوجيا العالية تعتمد على البحث العلمي واليد العاملة المؤهلة."]],
wx:[["لماذا تتمركز كثير من المصانع في المدن الساحلية بالمغرب؟",["قرب الموانئ يسهل استيراد المواد الأولية وتصدير المنتجات.","المدن الكبرى توفر اليد العاملة.","وتوفر أيضا الأسواق ووسائل النقل والخدمات."]]]},

/*22*/{t:"أنشطة السكان: التجارة والخدمات",
k:["<b>التجارة</b> تبادل السلع والخدمات مقابل المال. <b>الخدمات</b>: النقل، السياحة، الأبناك، التعليم، الصحة… (القطاع الثالث).","<b>التجارة الداخلية</b> داخل البلد، و<b>التجارة الخارجية</b> بين الدول: <b>الصادرات</b> والواردات.","<b>الميزان التجاري</b> = الصادرات − الواردات. إذا كان موجبا: <b>فائض</b>. إذا كان سالبا: <b>عجز</b>.","<b>نسبة التغطية</b> = (الصادرات ÷ الواردات) × 100.","وسائل النقل ضرورية للتجارة: البري، البحري (أكبر حجم)، الجوي (أسرع).","تتركز التجارة العالمية بين أمريكا الشمالية وأوروبا الغربية وشرق آسيا."],
w:[["الصادرات","سلع يبيعها بلد لبلدان أخرى"],["الواردات","سلع يشتريها بلد من الخارج"],["الميزان التجاري","الفرق بين الصادرات والواردات"],["العجز التجاري","الواردات أكبر من الصادرات"],["القطاع الثالث","التجارة والخدمات"]],

/*23*/{s:"التربية على المواطنة",t:"الكرامة",

["q","من مظاهر المس بالكرامة:",["السخرية من الآخرين","احترام الرأي"],0,"تؤذي الشخص معنويا."],

/*24*/{t:"الحرية",
k:["<b>الحرية</b> هي قدرة الإنسان على التفكير والتعبير والاختيار والتصرف دون إكراه.","من أنواعها: حرية <b>الرأي والتعبير</b>، حرية <b>التنقل</b>، حرية <b>المعتقد</b>، حرية <b>الاجتماع وتأسيس الجمعيات</b>.","للحرية <b>حدود</b>: تنتهي حرية الفرد حين تبدأ حرية الآخرين، وعليه احترام القانون.","الحرية مسؤولية: الحر يتحمل نتائج اختياراته.","تنص المواثيق الدولية والدستور المغربي على ضمان الحريات.","من مظاهر انتهاك الحرية: الرق، الاعتقال التعسفي، منع التعبير."],
w:[["الحرية","القدرة على الاختيار والتصرف دون إكراه"],["حرية التعبير","الحق في إبداء الرأي"],["حرية التنقل","الحق في الانتقال من مكان لآخر"],["حدود الحرية","احترام حرية الآخرين والقانون"]],
x:[["q","تنتهي حرية الفرد حين:",["تبدأ حرية الآخرين","يريد هو ذلك فقط"],0,"احترام الآخرين."],
["q","من أنواع الحرية:",["حرية التعبير","حرية إيذاء الآخرين"],0,"إيذاء الآخرين ليس حرية."],
["vf","الحرية تعني فعل كل ما نريد دون حدود.",false,"للحرية حدود: القانون وحرية الآخرين."],
["q","تشغيل الموسيقى بصوت مرتفع في منتصف الليل:",["يمس براحة الجيران","حرية مطلقة"],0,"تجاوز لحدود الحرية."]],
d:[["الحرية حق أساسي","ولد الإنسان حرا، ومن حقه أن يفكر ويعبر ويختار دينه ومهنته ومكان سكنه. الإعلان العالمي لحقوق الإنسان يضمن هذه الحريات، والدستور المغربي كذلك."],
["الحرية والمسؤولية","حرية التعبير لا تعني السب أو نشر الأكاذيب أو المس بكرامة الآخرين. من يعبر عن رأيه يجب أن يحترم آراء غيره. الحرية تصبح فوضى إذا لم تنظمها قواعد يحترمها الجميع."],
["في المدرسة","للتلميذ الحق في إبداء رأيه في القسم، مع احترام الدور في الكلام وآراء الزملاء والأستاذ. الحرية في المدرسة تكون في إطار النظام الداخلي."]],
wx:[["كيف تعبر عن رأي مخالف لرأي زميلك في القسم؟",["أرفع يدي وأنتظر دوري.","أعبر عن رأيي بأدب وبحجج.","أستمع لرأيه ولا أسخر منه."]]]},

/*25*/{t:"المساواة",
k:["<b>المساواة</b> أن يتمتع كل الناس بنفس الحقوق ونفس الواجبات دون <b>تمييز</b>.","التمييز ممنوع بسبب: الجنس، اللون، الأصل، الدين، اللغة، الإعاقة، الوضع الاجتماعي.","<b>المساواة أمام القانون</b>: القانون يطبق على الجميع بنفس الطريقة.","<b>المساواة بين الرجل والمرأة</b> في الحقوق والفرص، ونص عليها الدستور المغربي.","<b>اتفاقية القضاء على جميع أشكال التمييز ضد المرأة</b> اعتمدتها الأمم المتحدة سنة <b>1979</b>.","<b>تكافؤ الفرص</b>: توفير نفس الفرص للجميع في التعليم والشغل."],
w:[["المساواة","نفس الحقوق والواجبات للجميع"],["التمييز","معاملة شخص بشكل مختلف وظالم"],["تكافؤ الفرص","نفس الفرص للجميع"],["المساواة أمام القانون","تطبيق القانون على الجميع بنفس الطريقة"]],
x:[["q","من مظاهر التمييز:",["رفض تلميذ بسبب لونه","تطبيق نفس القانون على الجميع"],0,"التمييز ظلم."],
["q","اعتمدت اتفاقية القضاء على التمييز ضد المرأة سنة:",["1979","1948","1945"],0,"الأمم المتحدة."],

d:[["معنى المساواة","الناس مختلفون في أشكالهم وأصولهم وقدراتهم، لكنهم متساوون في الكرامة والحقوق. المساواة لا تعني أن الجميع متشابهون، بل أن الجميع يعاملون بعدل ودون تفضيل ظالم."],
["أشكال التمييز","التمييز قد يكون في الشغل (تفضيل شخص بسبب أصله)، أو في المدرسة، أو في الأجر بين الرجل والمرأة. محاربة التمييز تكون بالقوانين، وبالتربية على قبول الاختلاف."],
["تكافؤ الفرص","أحيانا يجب توفير دعم خاص لبعض الفئات لتحقيق المساواة الفعلية: منح دراسية للأسر المعوزة، ولوجيات للأشخاص في وضعية إعاقة، مدارس في المناطق القروية."]],
wx:[["لماذا تعتبر المساواة بين الإناث والذكور في التعليم مهمة؟",["لأن التعليم حق لكل طفل.","حرمان الفتيات من الدراسة تمييز وظلم.","تعليم الجميع يفيد الأسرة والمجتمع كله."]]]},

/*26*/{t:"العدل",
k:["<b>العدل</b> هو إعطاء كل ذي حق حقه، وعدم الظلم.","العدل أساس استقرار المجتمع وثقة المواطنين في مؤسساتهم.","<b>القضاء</b> هو المؤسسة التي تفصل في النزاعات وتحمي الحقوق.","درجات المحاكم في المغرب: <b>المحاكم الابتدائية</b>، <b>محاكم الاستئناف</b>، <b>محكمة النقض</b> (أعلى محكمة).","توجد أيضا محاكم متخصصة: <b>الإدارية</b> و<b>التجارية</b>.","من شروط القضاء العادل: <b>استقلال القضاء</b>، الحياد، حق الدفاع، المساواة أمام القضاء."],
w:[["العدل","إعطاء كل ذي حق حقه"],["القضاء","مؤسسة تفصل في النزاعات"],["محكمة النقض","أعلى محكمة في المغرب"],["الاستئناف","طلب إعادة النظر في حكم"],["استقلال القضاء","عدم تدخل أي جهة في عمل القاضي"]],
x:[["q","أعلى محكمة في المغرب:",["محكمة النقض","المحكمة الابتدائية","محكمة الاستئناف"],0,"في الرباط."],
["o","رتب درجات المحاكم من الأولى إلى الأعلى.",["المحكمة الابتدائية","محكمة الاستئناف","محكمة النقض"],"التقاضي على درجات."],
["vf","من شروط القضاء العادل استقلاله.",true,"لا تتدخل أي جهة في حكم القاضي."],
["q","العدل هو:",["إعطاء كل ذي حق حقه","تفضيل الأقوياء"],0,"تعريف."]],
d:[["قيمة العدل","حث الإسلام على العدل: ﴿إن الله يأمر بالعدل والإحسان﴾. وكتب عمر بن الخطاب رسالة إلى أبي موسى الأشعري يوصيه فيها بالمساواة بين الخصوم في المجلس والنظر في الأدلة. العدل يحمي الضعيف من القوي."],
["التنظيم القضائي","يبدأ التقاضي في المحكمة الابتدائية. إذا لم يقبل أحد الطرفين الحكم، يستأنفه أمام محكمة الاستئناف. ثم يمكن الطعن أمام محكمة النقض التي تراقب تطبيق القانون. هذا يضمن تصحيح الأخطاء المحتملة."],
["العدل في الحياة اليومية","في المدرسة: الأستاذ العادل يعامل كل التلاميذ بنفس الطريقة. في اللعب: احترام القواعد وعدم الغش. في الأسرة: توزيع المهام والحقوق بإنصاف بين الإخوة."]],
wx:[["صدر حكم ضد شخص في المحكمة الابتدائية ولم يقبله. ماذا يفعل؟",["يمكنه أن يستأنف الحكم.","تعيد محكمة الاستئناف دراسة القضية.","ثم يمكنه الطعن أمام محكمة النقض."]]]},

/*27*/{t:"التضامن",
k:["<b>التضامن</b> هو التعاون ومساعدة الآخرين، خاصة المحتاجين، والشعور بالمسؤولية تجاههم.","أشكاله: <b>أسري</b>، <b>اجتماعي</b> (بين الجيران وسكان الحي)، <b>وطني</b>، <b>دولي</b>.","من صور التضامن التقليدية بالمغرب: <b>التويزة</b> (العمل الجماعي التطوعي).","مؤسسات التضامن: <b>مؤسسة محمد الخامس للتضامن</b> (1999)، <b>الهلال الأحمر المغربي</b>، الجمعيات.","يظهر التضامن الوطني بقوة في الكوارث، كما حدث بعد زلزال الحوز سنة 2023.","التضامن الدولي: المساعدات الإنسانية بين الدول، ومنظمات مثل الصليب الأحمر والهلال الأحمر."],

["m","اربط.",[["مساعدة الجار المريض","تضامن اجتماعي"],["إرسال مساعدات لبلد منكوب","تضامن دولي"],["التبرع لضحايا زلزال في المغرب","تضامن وطني"]],"أشكال التضامن."],

["كيف أكون متضامنا؟","أساعد زميلي في فهم الدرس، أشارك في حملات النظافة والتبرع، أزور المريض، أتبرع بالملابس التي لم أعد أستعملها، وأتطوع في جمعية."]],
wx:[["اقترح ثلاثة أعمال تضامنية يمكن أن يقوم بها القسم.",["جمع ملابس وكتب للتلاميذ المحتاجين.","المشاركة في حملة نظافة الحي.","زيارة دار للمسنين أو للأطفال."]]]},

/*28*/{t:"التسامح",
k:["<b>التسامح</b> هو قبول الاختلاف واحترام آراء الآخرين ومعتقداتهم وطرق عيشهم.","يعني أيضا <b>العفو</b> عن من أساء إلينا وعدم الحقد.","ضده: <b>التعصب</b> و<b>العنف</b> و<b>الكراهية</b> ورفض الآخر.","حددت الأمم المتحدة <b>16 نونبر</b> يوما دوليا للتسامح.","التسامح لا يعني قبول الظلم أو التنازل عن الحقوق.","عرف المغرب تاريخيا التعايش بين المسلمين واليهود وغيرهم."],
w:[["التسامح","قبول الاختلاف واحترام الآخرين"],["التعصب","التمسك بالرأي ورفض رأي الآخرين"],["التعايش","العيش معا في سلام رغم الاختلاف"],["العفو","ترك معاقبة المسيء"]],
x:[["q","اليوم الدولي للتسامح:",["16 نونبر","10 دجنبر","21 شتنبر"],0,"حددته الأمم المتحدة."],
["q","عكس التسامح:",["التعصب","الاحترام","التعايش"],0,"رفض الآخر."],
["vf","التسامح يعني قبول الظلم.",false,"التسامح لا يعني التنازل عن الحقوق."],

d:[["معنى التسامح","الناس يختلفون في اللغة والدين والثقافة والرأي. التسامح هو أن نقبل هذا الاختلاف ونحترمه، وأن نتعامل مع الآخرين بلطف حتى إن لم نتفق معهم."],
["التسامح والعفو","في الحياة اليومية تحدث خلافات وإساءات. المتسامح يعفو ولا يحقد، ويفضل الحوار على العنف. لكن التسامح لا يعني السكوت عن الظلم: يمكن المطالبة بالحق بطرق سلمية."],
["التسامح في المغرب","المغرب بلد متعدد الروافد: عربية، أمازيغية، حسانية، صحراوية، أندلسية، عبرية، متوسطية. عاش فيه المسلمون واليهود قرونا في تعايش، وما زالت آثار ذلك في المدن العتيقة (الملاح)."]],

["بناء الأمر","نأخذ المضارع المجزوم ونحذف حرف المضارعة: لم يَكْتُبْ ← اُكْتُبْ (السكون)؛ لم يَكْتُبُوا ← اُكْتُبُوا (حذف النون)؛ لم يَدْعُ ← اُدْعُ (حذف حرف العلة)."],

["النواصب","أن: أريد أنْ أنجحَ. لن: لنْ أتأخرَ (نفي المستقبل). كي: أدرسُ كي أنجحَ. إذن: جوابا لكلام: «سأجتهد» — «إذنْ تنجحَ». لام التعليل: جئتُ لأتعلمَ."],
["الأفعال الخمسة","تنصب وتجزم بحذف النون: «لن تنجحوا إلا بالعمل»، «لم يتأخرا». وتبقى ألف الاثنين وواو الجماعة وياء المخاطبة."]],

d:[["لم ولما","كلاهما ينفي المضارع ويقلب زمنه إلى الماضي. «لم يحضرْ» نفي عادي. «لما يحضرْ» نفي مستمر إلى الآن مع انتظار حدوثه."],
["لام الأمر ولا الناهية","لام الأمر مكسورة، وتسكن بعد الواو والفاء: «فَلْيَجْتَهِدْ». لا الناهية تطلب الترك: «لا تُسْرِفُوا». ولا النافية تخبر فقط: «لا أحبُّ الكذبَ» (الفعل مرفوع)."],

["المتصل","يتصل بالفعل (كتبْتُ، كتبوا، أكرمَه) أو بالاسم (كتابُه) أو بالحرف (منه، إليك). محله الإعرابي حسب موقعه: مع الفعل فاعلا أو مفعولا، ومع الاسم مضافا إليه، ومع حرف الجر مجرورا."],
["«نا» و«الياء»","«نا» تكون في محل رفع (درسْنا)، أو نصب (أكرمَنا المعلمُ)، أو جر (كتابُنا). «الياء» تكون في محل رفع إذا كانت ياء المخاطبة (اكتبي)، وفي محل نصب أو جر إذا كانت ياء المتكلم (أكرمني، كتابي)."]],

["إعراب الجملة الاسمية","«العلمُ نورٌ»: العلمُ مبتدأ مرفوع بالضمة الظاهرة، نورٌ خبر مرفوع بالضمة الظاهرة. «العلمُ ينفعُ صاحبَه»: الجملة الفعلية «ينفع صاحبه» في محل رفع خبر."]],

/*3*/{t:"Le passé composé",
k:["Le <b>passé composé</b> exprime une action <b>terminée</b> dans le passé.","Il se forme avec l'<b>auxiliaire avoir ou être</b> au présent + le <b>participe passé</b> : j'<b>ai mangé</b>, il <b>est parti</b>.","Participe passé : 1er groupe en <b>-é</b> (chanté), 2e groupe en <b>-i</b> (fini), 3e groupe varié : pris, vu, fait, venu, dit, eu, été.","La plupart des verbes utilisent <b>avoir</b>. Les verbes de mouvement (aller, venir, partir, arriver, sortir, entrer, tomber, naître, mourir, rester) utilisent <b>être</b>.","Avec <b>être</b>, le participe s'<b>accorde avec le sujet</b> : elle est partie, ils sont arrivés.","Avec <b>avoir</b>, il ne s'accorde pas avec le sujet : elles <b>ont mangé</b>."],
w:[["passé composé","الماضي المركب"],["auxiliaire","فعل مساعد"],["participe passé","اسم المفعول"],["accord","مطابقة"]],
x:[["q","« Nous ___ (finir) nos devoirs. »",["avons fini","sommes finis","avons finé","finissons"],0,"Avoir + participe en -i."],
["q","« Elle ___ (partir) tôt. »",["est partie","a parti","est parti","a partie"],0,"Partir → être, accord au féminin."],

["vf","« Ils sont arrivés » : le participe est accordé avec le sujet.",true,"Avec être, on accorde."],
["g","Hier, j'___ vu un film et nous ___ allés au café.",["ai","sommes"],["suis","avons"],"Voir → avoir ; aller → être."]],
d:[["Formation","Le passé composé est un temps composé : deux mots. L'auxiliaire est conjugué au présent (j'ai, tu as, il a… / je suis, tu es, il est…), le participe passé reste fixe (sauf accord). « Tu as joué », « vous êtes venus »."],
["Avoir ou être ?","Avec être : aller, venir, arriver, partir, entrer, sortir, monter, descendre, tomber, rester, naître, mourir, retourner, devenir. Un moyen de les retenir : ce sont souvent des mouvements ou des changements d'état. Tous les autres verbes (et être, avoir eux-mêmes) utilisent avoir."],
["L'accord","Avec être, le participe prend le genre et le nombre du sujet : « Sara est venue », « Les garçons sont sortis », « Mes sœurs sont arrivées ». Avec avoir, pas d'accord avec le sujet : « Sara a chanté »."]],

/*4*/{t:"Les temps du récit : l'imparfait et le passé simple",
k:["Dans un récit au passé, on utilise surtout l'<b>imparfait</b> et le <b>passé simple</b>.","L'<b>imparfait</b> : terminaisons <b>-ais, -ais, -ait, -ions, -iez, -aient</b> (pour tous les verbes). Il sert pour les <b>descriptions</b>, les <b>habitudes</b>, les actions qui durent.","Le <b>passé simple</b> exprime les actions <b>brèves</b> et <b>successives</b> qui font avancer l'histoire.","Passé simple 1er groupe : <b>-ai, -as, -a, -âmes, -âtes, -èrent</b> (il chanta, ils chantèrent).","2e groupe et beaucoup du 3e : <b>-is, -is, -it, -îmes, -îtes, -irent</b> (il finit, il prit, il fit).","Autres : <b>-us, -ut, -urent</b> (il fut, il eut, il put) ; venir : <b>il vint</b>, ils vinrent."],

["L'imparfait","On prend le radical de « nous » au présent : nous finissons → je finissais ; nous prenons → je prenais. Seul « être » est irrégulier : j'étais. Attention : nous mangions, vous mangiez (avec -i-)."],
["Le passé simple","Il est surtout utilisé à la 3e personne dans les récits. 1er groupe : il parla, ils parlèrent. 2e groupe : il finit, ils finirent. 3e groupe : il prit, il vit, il dit, il fit, il fut, il eut, il put, il voulut, il vint."]],

/*5*/{t:"L'ordre chronologique et les indicateurs temporels",
k:["L'<b>ordre chronologique</b> est l'ordre dans lequel les événements se sont passés.","Les <b>indicateurs temporels</b> aident à suivre cet ordre : <b>d'abord</b>, <b>ensuite</b>, <b>puis</b>, <b>après</b>, <b>enfin</b>, <b>finalement</b>.","Autres indicateurs : <b>au début</b>, <b>un jour</b>, <b>quelques minutes plus tard</b>, <b>pendant ce temps</b>, <b>à la fin</b>.","Dans un récit historique, on utilise les <b>dates</b> : en 788, au VIIIe siècle.","Pour <b>rétablir l'ordre</b> d'un texte en désordre, on cherche les indicateurs et les liens logiques.","Le récit historique raconte des faits réels du passé (exemple : la fondation de l'État idrisside par Moulay Idriss Ier en 788)."],
w:[["ordre chronologique","الترتيب الزمني"],["d'abord","أولا"],["ensuite","بعد ذلك"],["enfin","أخيرا"],["récit historique","سرد تاريخي"]],
x:[["o","Range les indicateurs dans l'ordre.",["d'abord","ensuite","puis","enfin"],"Du début à la fin."],
["o","Range les étapes.",["Il se réveilla.","Il prit son petit-déjeuner.","Il partit à l'école.","Il arriva en classe."],"Ordre logique d'une matinée."],
["q","« Finalement » indique :",["la fin","le début","un retour en arrière"],0,"Dernière étape."],
["vf","Un récit historique raconte des faits imaginaires.",false,"Il raconte des faits réels du passé."],
["g","___, il ouvrit la porte. ___, il entra. ___, il s'assit.",["D'abord","Ensuite","Enfin"],["Hier","Demain"],"Trois actions successives."]],
d:[["Pourquoi l'ordre est important","Si les étapes sont mélangées, le lecteur ne comprend plus. Les indicateurs temporels sont comme des panneaux sur la route : ils indiquent où l'on se trouve dans l'histoire."],
["Rétablir l'ordre","Méthode : repérer la situation de départ (souvent avec « un jour », « il était une fois »), chercher les indicateurs (ensuite, le lendemain), vérifier les pronoms (« il » renvoie à un personnage déjà cité), puis lire le texte reconstitué pour vérifier qu'il a du sens."],
["Le récit historique","Il présente des personnages réels, des dates, des lieux. Il est écrit au passé simple et à l'imparfait. Il est souvent organisé de façon chronologique : naissance, actions importantes, mort ou conséquences."]],
wx:[["Range : « Il fonda Fès. / Moulay Idriss arriva au Maroc. / Les tribus le choisirent comme chef. »",["L'arrivée vient en premier.","Puis les tribus le choisissent.","Enfin, il fonde une ville : arrivée → choix → fondation."]]]},

/*6*/{t:"Le compte rendu de lecture",
k:["Un <b>compte rendu</b> présente un livre ou un texte lu, de façon courte et claire.","Il donne : le <b>titre</b>, l'<b>auteur</b>, le <b>genre</b> (conte, roman, BD…).","Il présente le <b>résumé</b> : personnages principaux, lieu, problème, fin.","Il se termine par l'<b>avis personnel</b> justifié : « J'ai aimé ce livre parce que… ».","Le résumé est écrit au <b>présent</b>, à la 3e personne, sans dialogues.","On utilise ses propres mots, sans recopier le texte."],
w:[["compte rendu","تقرير"],["résumé","ملخص"],["auteur","مؤلف"],["avis","رأي"],["personnage","شخصية"]],
x:[["o","Range les parties d'un compte rendu.",["la présentation du livre","le résumé","l'avis personnel"],"De l'objectif au personnel."],
["q","Le résumé d'un livre est écrit au :",["présent","futur","conditionnel"],0,"Présent de narration."],
["vf","On recopie des phrases entières du livre dans le résumé.",false,"On utilise ses propres mots."],
["q","« J'ai aimé ce conte parce qu'il est drôle. » C'est :",["un avis justifié","un résumé","un titre"],0,"Avis + justification."]],
d:[["Présenter le livre","On commence par les informations : « Le livre s'intitule… Il a été écrit par… C'est un conte / un roman… »."],
["Résumer","On garde l'essentiel : qui sont les personnages, où et quand l'histoire se passe, quel problème se pose, comment il est résolu. On écrit au présent : « Le héros part à la recherche de… »."],
["Donner son avis","On dit ce qu'on a aimé ou pas, et pourquoi : les personnages, le suspense, les illustrations, la morale. On peut conseiller le livre à quelqu'un."]],
wx:[["Écris un avis sur un conte que tu as aimé.",["J'ai beaucoup aimé ce conte.","Le héros est courageux et l'histoire est pleine de suspense.","Je le conseille à mes camarades."]]]},

/* ===== SÉQUENCE 2 ===== */
/*7*/{s:"Séquence 2 : Raconter des histoires",t:"Le complément d'objet direct et indirect",
k:["Le <b>COD</b> (complément d'objet direct) complète le verbe <b>sans préposition</b>. Il répond à <b>quoi ?</b> ou <b>qui ?</b> après le verbe : Sara lit <b>un livre</b>.","Le <b>COI</b> (complément d'objet indirect) est introduit par une <b>préposition</b> (à, de) et répond à <b>à qui ? à quoi ? de qui ? de quoi ?</b> : Il parle <b>à son ami</b>.","On ne peut généralement <b>ni supprimer ni déplacer</b> le COD et le COI.","Le COD peut être remplacé par <b>le, la, l', les</b> : Sara <b>le</b> lit.","Le COI peut être remplacé par <b>lui, leur, en, y</b> : Il <b>lui</b> parle.","Le COD et le COI peuvent être un nom, un pronom ou un groupe nominal."],
w:[["complément d'objet direct","المفعول به المباشر"],["complément d'objet indirect","المفعول به غير المباشر"],["préposition","حرف جر"],["pronom","ضمير"]],
x:[["q","« Le chat mange la souris. » « la souris » est :",["COD","COI","sujet"],0,"Mange quoi ? → la souris, sans préposition."],
["q","« Il téléphone à sa mère. » « à sa mère » est :",["COI","COD","complément circonstanciel"],0,"Téléphone à qui ? Avec préposition."],
["q","« Je mange une pomme. » → « Je ___ mange. »",["la","lui","leur"],0,"COD féminin singulier."],
["vf","Le COI est introduit par une préposition.",true,"à, de…"],
["m","Relie.",[["Il ouvre la porte.","COD"],["Il pense à ses vacances.","COI"],["Il parle de son voyage.","COI"]],"Préposition ou pas ?"]],
d:[["Trouver le COD","On pose la question « quoi ? » ou « qui ? » après le verbe : « Amine regarde le match. » Amine regarde quoi ? → le match = COD. Le COD est directement relié au verbe."],
["Trouver le COI","On pose « à qui ? à quoi ? de qui ? de quoi ? » : « Elle obéit à ses parents. » Elle obéit à qui ? → à ses parents = COI. Attention : à + le = au, de + le = du : « Il parle du film. »"],
["COD/COI ou complément circonstanciel ?","Le complément circonstanciel peut être déplacé ou supprimé : « Le matin, il lit. » / « Il lit le matin. » Le COD et le COI, eux, sont essentiels au sens du verbe."]],
wx:[["Remplace les compléments : « Karim donne le cadeau à sa sœur. »",["« le cadeau » est COD → le.","« à sa sœur » est COI → lui.","« Karim le lui donne. »"]]]},

/*8*/{t:"Actions ponctuelles et actions continues",
k:["Une <b>action ponctuelle</b> est brève, elle se produit à un moment précis : la porte <b>claqua</b>.","Une <b>action continue</b> dure dans le temps : il <b>marchait</b> depuis une heure.","Dans un récit au passé : actions ponctuelles au <b>passé simple</b>, actions continues ou répétées à l'<b>imparfait</b>.","Indicateurs de l'action ponctuelle : <b>soudain</b>, <b>tout à coup</b>, <b>à ce moment-là</b>, <b>un jour</b>.","Indicateurs de l'action continue ou répétée : <b>pendant des heures</b>, <b>chaque jour</b>, <b>souvent</b>, <b>toujours</b>, <b>depuis</b>.","Une action ponctuelle peut interrompre une action continue : il <b>dormait</b> quand le téléphone <b>sonna</b>."],
w:[["action ponctuelle","حدث آني"],["action continue","حدث مستمر"],["répété","متكرر"],["soudain","فجأة"]],
x:[["q","« Chaque matin, il ___ (courir) au parc. »",["courait","courut"],0,"Habitude → imparfait."],
["q","« Tout à coup, un bruit ___ (retentir). »",["retentit","retentissait"],0,"Action brève → passé simple."],
["vf","« Il lisait quand on frappa à la porte » : « frappa » interrompt « lisait ».",true,"Continue + ponctuelle."],
["m","Relie.",[["Il neigeait depuis trois jours.","action continue"],["La vitre se brisa.","action ponctuelle"],["Il allait souvent à la mer.","action répétée"]],"Durée, moment précis ou habitude ?"]],
d:[["Deux façons de voir l'action","Une même action peut être vue comme un point (« il traversa la rue ») ou comme une ligne qui dure (« il traversait la rue »). Le choix du temps change le sens : avec l'imparfait, on est au milieu de l'action, et quelque chose peut l'interrompre."],
["Les indicateurs","Les mots « soudain », « brusquement », « à cet instant » annoncent le passé simple. « Pendant », « depuis », « tous les jours », « autrefois » annoncent l'imparfait."],
["Dans le conte","« Il était une fois une petite fille qui vivait avec sa grand-mère (imparfait : situation). Un jour, elle décida de partir (passé simple : début de l'action). »"]],
wx:[["Complète : « Je (dormir) profondément quand l'orage (éclater). »",["« dormir » dure : imparfait → je dormais.","« éclater » est brusque : passé simple → l'orage éclata.","« Je dormais profondément quand l'orage éclata. »"]]]},

/*9*/{t:"Les verbes irréguliers au présent",
k:["Certains verbes très utilisés sont <b>irréguliers</b> : il faut apprendre leur conjugaison par cœur.","<b>Être</b> : je suis, tu es, il est, nous sommes, vous êtes, ils sont.","<b>Avoir</b> : j'ai, tu as, il a, nous avons, vous avez, ils ont.","<b>Aller</b> : je vais, tu vas, il va, nous allons, vous allez, ils vont.","<b>Faire</b> : je fais, tu fais, il fait, nous faisons, vous <b>faites</b>, ils font. <b>Dire</b> : vous <b>dites</b>.","<b>Venir</b> : je viens, nous venons, ils viennent. <b>Prendre</b> : je prends, nous prenons, ils prennent. <b>Pouvoir</b> : je peux, il peut. <b>Vouloir</b> : je veux, il veut."],
w:[["verbe irrégulier","فعل شاذ"],["présent","المضارع"],["par cœur","عن ظهر قلب"],["conjugaison","التصريف"]],
x:[["q","« Vous ___ (faire) vos devoirs. »",["faites","faisez","fais"],0,"Forme irrégulière."],
["q","« Ils ___ (aller) au marché. »",["vont","allent","vas"],0,"Aller : ils vont."],
["q","« Nous ___ (prendre) le bus. »",["prenons","prendons","prennons"],0,"Nous prenons."],
["vf","« Je peux » est la forme correcte de « pouvoir ».",true,"Je peux, tu peux, il peut."],
["g","Tu ___ (être) gentil et tu ___ (avoir) raison.",["es","as"],["est","a"],"Tu es, tu as."]],
d:[["Les deux auxiliaires","Être et avoir sont les verbes les plus utilisés : ils servent aussi à former les temps composés. Il faut les connaître parfaitement à tous les temps."],
["Pièges fréquents","« Vous faites », « vous dites », « vous êtes » (et pas faisez, disez, êtez). « Ils font », « ils vont », « ils sont », « ils ont ». Je peux / tu peux (avec -x)."],
["Une astuce","Les verbes en -dre comme prendre, apprendre, comprendre se conjuguent de la même façon : je prends, j'apprends, je comprends ; ils prennent, ils apprennent."]],
wx:[["Conjugue « venir » au présent avec nous et ils.",["Venir est irrégulier.","Nous venons.","Ils viennent (deux n)."]]]},

/*10*/{t:"Les compléments circonstanciels",
k:["Le <b>complément circonstanciel</b> (CC) donne des précisions sur les <b>circonstances</b> de l'action.","<b>CC de temps</b> : répond à <b>quand ?</b> — Le matin, il court.","<b>CC de lieu</b> : répond à <b>où ?</b> — Il court <b>dans le parc</b>.","<b>CC de manière</b> : répond à <b>comment ?</b> — Il court <b>rapidement</b>.","<b>CC de cause</b> : répond à <b>pourquoi ?</b> — Il court <b>à cause de la pluie</b>.","Le CC peut souvent être <b>déplacé</b> ou <b>supprimé</b>."],
w:[["complément circonstanciel","المفعول فيه / الظرف"],["temps","زمان"],["lieu","مكان"],["manière","كيفية"],["cause","سبب"]],
x:[["q","« Ils jouent dans la cour. » « dans la cour » est un CC de :",["lieu","temps","manière"],0,"Où ?"],
["q","« Elle parle doucement. » « doucement » est un CC de :",["manière","lieu","cause"],0,"Comment ?"],
["q","« Il est resté chez lui à cause de la fièvre. » CC de :",["cause","temps","lieu"],0,"Pourquoi ?"],
["vf","On peut souvent déplacer un complément circonstanciel.",true,"« Le soir, il lit » = « Il lit le soir »."],
["m","Relie.",[["en été","temps"],["à la montagne","lieu"],["avec soin","manière"]],"Quand ? Où ? Comment ?"]],
d:[["Reconnaître le CC","On pose les questions quand ? où ? comment ? pourquoi ? On vérifie qu'on peut le supprimer : « Hier, au marché, ma mère a acheté des fruits » → « Ma mère a acheté des fruits » (la phrase reste correcte)."],
["Formes du CC","Le CC peut être un groupe nominal (le matin), un groupe prépositionnel (dans la maison), un adverbe (vite, ici, demain) ou une proposition (quand il pleut)."],
["Enrichir un récit","Les CC rendent le récit plus précis et plus vivant : « Le chevalier partit » → « À l'aube, le chevalier partit au galop vers le château »."]],
wx:[["Enrichis : « Le chat dort. » avec un CC de lieu et un CC de temps.",["CC de lieu : sur le canapé.","CC de temps : tout l'après-midi.","« Tout l'après-midi, le chat dort sur le canapé. »"]]]},

/*11*/{t:"Donner des consignes : l'impératif",
k:["Pour donner des <b>consignes</b> ou des <b>ordres</b>, on utilise souvent l'<b>impératif</b>.","L'impératif n'a que <b>3 personnes</b> et <b>pas de sujet</b> : <b>chante</b>, <b>chantons</b>, <b>chantez</b>.","1er groupe : pas de <b>-s</b> à la 2e personne du singulier : <b>mange</b> (et pas manges).","2e groupe : <b>finis</b>, finissons, finissez. 3e groupe : <b>prends</b>, prenons, prenez.","Irréguliers : <b>sois</b>, soyons, soyez ; <b>aie</b>, ayons, ayez ; <b>va</b>, allons, allez ; <b>fais</b>, faisons, faites.","On peut aussi utiliser l'<b>infinitif</b> (recettes, notices) : « Ajouter le sucre. », ou « il faut + infinitif »."],
w:[["consigne","تعليمة"],["impératif","صيغة الأمر"],["ordre","أمر"],["notice","دليل الاستعمال"]],
x:[["q","Impératif de « regarder » (tu) :",["regarde","regardes","regardez"],0,"Pas de -s au 1er groupe."],
["q","Impératif de « être » (vous) :",["soyez","êtes","soyiez"],0,"Irrégulier."],
["q","Impératif de « aller » (tu) :",["va","vas","allez"],0,"Va !"],
["vf","À l'impératif, on écrit le sujet.",false,"L'impératif n'a pas de sujet exprimé."],
["g","___ attentivement la consigne, puis ___ la bonne réponse.",["Lis","choisis"],["Lit","choisit"],"Impératif, 2e personne du singulier."]],
d:[["Les trois personnes","L'impératif s'adresse à « tu », « nous » ou « vous », sans les écrire : « Ferme la porte ! », « Partons ! », « Asseyez-vous ». Les formes sont presque celles du présent."],
["L'orthographe","Au 1er groupe, la 2e personne du singulier n'a pas de -s : « Écoute ! », « Range ta chambre ! ». Exception devant « en » et « y » : « Manges-en », « Vas-y »."],
["Dans le conte","Les personnages donnent des consignes : « N'ouvre la porte à personne ! », « Prends ce panier et va chez ta grand-mère. » La consigne non respectée crée souvent le problème de l'histoire."]],
wx:[["Écris une consigne pour planter une graine.",["Remplis un pot de terre.","Mets la graine dans un petit trou.","Arrose un peu chaque jour."]]]},

/*12*/{t:"Le conte et le schéma narratif",
k:["Le <b>conte</b> est un récit imaginaire, souvent merveilleux, qui commence par une formule comme <b>« Il était une fois »</b>.","Le <b>schéma narratif</b> organise le récit en <b>5 étapes</b>.","1. <b>Situation initiale</b> : présentation des personnages, du lieu, du temps (imparfait).","2. <b>Élément perturbateur</b> : un événement qui change tout (« Un jour… »).","3. <b>Péripéties</b> : les actions et aventures du héros. 4. <b>Élément de résolution</b> : ce qui règle le problème.","5. <b>Situation finale</b> : la nouvelle situation, souvent heureuse (« Ils vécurent heureux… »)."],
w:[["conte","حكاية"],["schéma narratif","الخطاطة السردية"],["situation initiale","الوضعية الأولية"],["élément perturbateur","العنصر المخل"],["péripéties","الأحداث"],["situation finale","الوضعية النهائية"]],
x:[["o","Range les étapes du schéma narratif.",["situation initiale","élément perturbateur","péripéties","élément de résolution","situation finale"],"Du début à la fin."],
["q","« Il était une fois un pauvre pêcheur… » appartient à :",["la situation initiale","la situation finale","les péripéties"],0,"Présentation."],
["q","« Un jour, un dragon enleva la princesse. » C'est :",["l'élément perturbateur","la situation finale","l'élément de résolution"],0,"Le problème commence."],
["vf","Le conte se termine souvent bien.",true,"Situation finale heureuse."]],
d:[["Les caractéristiques du conte","Lieux et époque imprécis (dans un royaume lointain), personnages types (le héros, le méchant, l'adjuvant qui aide), éléments merveilleux (objets magiques, animaux qui parlent), et souvent une morale."],
["Le schéma narratif","Il permet de comprendre et de construire un récit. La situation initiale est stable ; l'élément perturbateur rompt cet équilibre ; les péripéties sont les épreuves ; l'élément de résolution met fin au problème ; la situation finale est un nouvel équilibre."],
["Écrire un conte","Choisis un héros et un problème. Commence par « Il était une fois ». Utilise l'imparfait pour la situation initiale, le passé simple pour les actions. Ajoute un élément merveilleux. Termine par une situation finale et, si tu veux, une morale."]],
wx:[["Invente un élément perturbateur pour : « Il était une fois un berger qui vivait tranquillement avec ses moutons. »",["L'élément perturbateur doit changer la situation.","Il commence souvent par « Un jour ».","« Un jour, un loup affamé enleva son plus bel agneau. »"]]]},

/*13*/{t:"Les verbes sans complément et les verbes irréguliers au passé simple",
k:["Certains verbes n'ont <b>pas besoin de complément d'objet</b> : ce sont des verbes <b>intransitifs</b> : dormir, arriver, partir, tomber, rire.","« Le bébé <b>dort</b>. » La phrase est complète.","Ils peuvent avoir un complément circonstanciel : « Le bébé dort <b>dans son lit</b> ».","Les verbes qui ont un COD ou un COI sont <b>transitifs</b>.","Passé simple des irréguliers : être → <b>il fut</b> ; avoir → <b>il eut</b> ; faire → <b>il fit</b> ; dire → <b>il dit</b> ; voir → <b>il vit</b> ; prendre → <b>il prit</b>.","Venir → <b>il vint</b>, ils vinrent ; pouvoir → <b>il put</b> ; vouloir → <b>il voulut</b> ; savoir → <b>il sut</b>."],
w:[["intransitif","فعل لازم"],["transitif","فعل متعد"],["passé simple","الماضي البسيط"],["irrégulier","شاذ"]],
x:[["q","Lequel est intransitif ?",["dormir","manger","regarder"],0,"On ne dort pas « quelque chose »."],
["q","Passé simple de « faire » (il) :",["il fit","il faisa","il faisait"],0,"Irrégulier."],
["q","Passé simple de « venir » (ils) :",["ils vinrent","ils venirent","ils vinèrent"],0,"Vin- + rent."],
["vf","« Il arriva tôt » : « tôt » est un COD.",false,"« tôt » est un CC de temps ; « arriver » est intransitif."],
["m","Relie chaque verbe à son passé simple.",[["voir","il vit"],["avoir","il eut"],["prendre","il prit"]],"Revois la liste."]],
d:[["Transitif ou intransitif ?","On essaie de poser la question « quoi ? » ou « qui ? » : « Il mange… quoi ? » → transitif. « Il tombe… quoi ? » → pas de réponse : intransitif. Certains verbes peuvent être les deux : « Il chante » / « Il chante une chanson »."],
["Le passé simple des irréguliers","Il faut les apprendre par cœur, surtout à la 3e personne : il fut, ils furent ; il eut, ils eurent ; il fit, ils firent ; il dit, ils dirent ; il vit, ils virent ; il prit, ils prirent ; il vint, ils vinrent ; il put, ils purent."],
["Dans les récits","Les verbes intransitifs de mouvement (partir, arriver, sortir, entrer) sont très utilisés dans les récits pour faire avancer l'action : « Il sortit, courut et disparut. »"]],
wx:[["Mets au passé simple : « Le roi voit le voleur et dit : Arrêtez-le ! »",["voit → vit.","dit (présent) → dit (passé simple identique).","« Le roi vit le voleur et dit : Arrêtez-le ! »"]]]},

/*14*/{t:"Conseiller, recommander, ordonner",
k:["Pour <b>conseiller</b> : « Je te conseille de… », « Tu devrais… », « À ta place, je… ».","Pour <b>recommander</b> : « Je vous recommande de… », « N'oubliez pas de… », « Il est préférable de… ».","Pour <b>ordonner</b> : l'<b>impératif</b> (« Range ta chambre ! »), « Il faut… », « Tu dois… ».","Pour <b>interdire</b> : « Ne … pas » à l'impératif (« Ne cours pas ! »), « Il est interdit de… ».","Le conseil est <b>poli</b> et laisse le choix ; l'ordre <b>oblige</b>.","Le <b>conditionnel</b> (tu devrais, il faudrait) adoucit le message."],
w:[["conseiller","ينصح"],["recommander","يوصي"],["ordonner","يأمر"],["interdire","يمنع"],["conditionnel","صيغة الشرط"]],
x:[["q","« Tu devrais te reposer. » C'est :",["un conseil","un ordre","une interdiction"],0,"Le conditionnel adoucit."],
["q","« Sortez immédiatement ! » C'est :",["un ordre","un conseil","une question"],0,"Impératif + immédiatement."],
["q","« Il est interdit de fumer. » C'est :",["une interdiction","un conseil"],0,"Il est interdit de…"],
["m","Relie.",[["À ta place, je lirais ce livre.","conseiller"],["N'oubliez pas vos cahiers.","recommander"],["Ferme la fenêtre !","ordonner"]],"Le ton et la forme."]],
d:[["Choisir la bonne formule","On adapte la formule à la situation et à la personne. À un ami : « Tu devrais… ». À un professeur : « Je vous conseillerais de… » serait étrange ; on préfère poser une question. Un panneau public utilise « Il est interdit de… »."],
["Le rôle du conditionnel","Le conditionnel rend la phrase plus douce et plus polie : « Tu dois partir » (obligation) → « Tu devrais partir » (conseil). « Je veux un verre d'eau » → « Je voudrais un verre d'eau »."],
["Dans les contes","Le sage ou la fée donne souvent un conseil au héros : « Ne te retourne pas avant d'avoir traversé le pont. » Le héros qui suit le conseil réussit."]],

/*15*/{s:"Séquence 3 : Raconter en images",t:"Le vocabulaire de l'image : la BD et l'affiche",
k:["Une <b>bande dessinée</b> (BD) raconte une histoire par des images et des textes.","La <b>planche</b> est une page de BD ; la <b>bande</b> est une ligne d'images ; la <b>vignette</b> (ou case) est une image.","La <b>bulle</b> contient les paroles des personnages ; une bulle en nuage contient les <b>pensées</b>.","Le <b>récitatif</b> (ou cartouche) est un encadré qui contient le texte du narrateur.","Les <b>onomatopées</b> imitent les bruits : <b>Boum !</b>, <b>Splash !</b>, <b>Toc toc !</b>","Les <b>plans</b> : plan d'ensemble (tout le décor), plan moyen (personnage entier), gros plan (visage). L'<b>affiche</b> combine image, slogan et informations."],

/*16*/{t:"Situer un événement dans le passé et par rapport à d'autres",
k:["Pour situer un événement dans le passé : <b>autrefois</b>, <b>jadis</b>, <b>il y a longtemps</b>, <b>l'an dernier</b>, <b>en 1990</b>.","Un événement peut être <b>antérieur</b> (avant), <b>simultané</b> (en même temps) ou <b>postérieur</b> (après) à un autre.","<b>Antériorité</b> : avant, avant que, auparavant, la veille, plus tôt.","<b>Simultanéité</b> : pendant que, au moment où, en même temps, tandis que, lorsque.","<b>Postériorité</b> : après, après que, ensuite, le lendemain, plus tard.","« <b>Depuis</b> » indique une durée qui continue : « Il habite ici depuis cinq ans »."],

d:[["Trois relations","Quand on raconte plusieurs événements, il faut indiquer leur rapport dans le temps. « Il mangea, puis il partit » (postériorité). « Il mangeait pendant que son frère lisait » (simultanéité). « Avant de manger, il se lava les mains » (antériorité)."],

["Depuis / il y a","« Il y a » indique un moment précis du passé : « Il est parti il y a deux jours. » « Depuis » indique une durée qui continue jusqu'à maintenant : « Il est malade depuis deux jours »."]],

/*17*/{t:"Les verbes à un complément et à deux compléments",
k:["Certains verbes se construisent avec <b>un seul complément</b> : un COD (<b>lire un livre</b>) ou un COI (<b>obéir à ses parents</b>).","D'autres se construisent avec <b>deux compléments</b> : un COD et un COI (appelé aussi <b>COS</b>, complément d'objet second).","Exemples : <b>donner</b> quelque chose <b>à</b> quelqu'un ; <b>dire</b>, <b>offrir</b>, <b>prêter</b>, <b>envoyer</b>, <b>montrer</b>, <b>demander</b>.","« Sara offre <b>un cadeau</b> (COD) <b>à sa mère</b> (COS). »","Avec les pronoms : « Sara <b>le lui</b> offre. »","Le verbe peut changer de sens selon sa construction : <b>penser à</b> quelqu'un / <b>penser que</b>…"],

/*18*/{s:"Séquence 4 : Décrire des êtres",t:"Le groupe nominal : genre et nombre",
k:["Le <b>groupe nominal</b> (GN) est formé d'un <b>nom</b> et des mots qui l'accompagnent : <b>un petit chat noir</b>.","Le nom a un <b>genre</b> : <b>masculin</b> (un livre) ou <b>féminin</b> (une table).","Formation du féminin : on ajoute <b>-e</b> (ami → amie) ; -er → <b>-ère</b> (boulanger → boulangère) ; -eur → <b>-euse</b> (danseur → danseuse) ; -teur → <b>-trice</b> (acteur → actrice) ; -ien → <b>-ienne</b>.","Le nom a un <b>nombre</b> : singulier ou pluriel. On ajoute généralement <b>-s</b> au pluriel.","Pluriels particuliers : -al → <b>-aux</b> (cheval → chevaux) ; -eau, -au, -eu → <b>-x</b> (bateau → bateaux, jeu → jeux) ; -s, -x, -z ne changent pas.","Exceptions : bal<b>s</b>, festival<b>s</b> ; bijou<b>x</b>, chou<b>x</b>, genou<b>x</b>, hibou<b>x</b>, caillou<b>x</b>, joujou<b>x</b>, pou<b>x</b>."],

d:[["Le genre","Le genre des noms d'objets ne s'explique pas : il faut l'apprendre avec l'article (un livre, une chaise). Pour les êtres vivants, on forme souvent le féminin à partir du masculin. Certains noms ont une forme très différente : homme/femme, père/mère, coq/poule."],
["Le pluriel","La règle générale est d'ajouter -s. Les noms en -eau, -au, -eu prennent un -x (sauf pneus, bleus). Les noms en -al font -aux (sauf bals, carnavals, festivals, récitals). Les noms en -ail font -ails (sauf travaux, vitraux, coraux, émaux)."],

/*22*/{t:"Les adjectifs possessifs et démonstratifs",
k:["L'<b>adjectif possessif</b> indique à qui appartient la chose : <b>mon, ton, son, ma, ta, sa, mes, tes, ses</b>, <b>notre, votre, leur, nos, vos, leurs</b>.","Il s'accorde avec le <b>nom</b> qui suit : <b>ma</b> trousse, <b>mon</b> cahier, <b>mes</b> livres.","Devant un nom féminin commençant par une voyelle, on écrit <b>mon, ton, son</b> : <b>mon</b> amie, <b>son</b> école.","L'<b>adjectif démonstratif</b> montre une chose ou une personne : <b>ce, cet, cette, ces</b>.","<b>Ce</b> devant un nom masculin (ce livre) ; <b>cet</b> devant un nom masculin commençant par une voyelle ou un h muet (cet arbre, cet homme) ; <b>cette</b> devant un nom féminin ; <b>ces</b> au pluriel.","On peut ajouter <b>-ci</b> (proche) ou <b>-là</b> (loin) : ce livre-ci, cette maison-là."],

d:[["Épithète ou attribut","L'épithète fait partie du groupe nominal : « Le vieux pêcheur répare son filet ». L'attribut est relié au sujet par un verbe d'état : « Le pêcheur est vieux ». On peut supprimer l'épithète, mais pas l'attribut."],

["Enrichir avec des adjectifs","Un bon adjectif rend la description précise : « une maison » → « une petite maison blanche aux volets bleus ». Mais trop d'adjectifs alourdissent la phrase : il faut choisir."]],

/*24*/{t:"Le complément du nom",
k:["Le <b>complément du nom</b> (CDN) complète un nom pour le préciser.","Il est généralement introduit par une <b>préposition</b> : <b>de</b>, <b>à</b>, <b>en</b>, <b>pour</b>, <b>sans</b> : une tasse <b>de thé</b>, une robe <b>en soie</b>.","Il peut indiquer : la <b>matière</b> (une table en bois), l'<b>usage</b> (une tasse à café), l'<b>appartenance</b> (le livre de Sara), le <b>contenu</b> (un verre d'eau).","Il fait partie du <b>groupe nominal</b>.","On peut parfois le remplacer par un adjectif : la lumière <b>du soleil</b> → la lumière <b>solaire</b>.","Le CDN ne s'accorde pas avec le nom qu'il complète."],
w:[["complément du nom","المضاف إليه / متمم الاسم"],["matière","مادة"],["usage","استعمال"],["appartenance","ملكية"]],
x:[["q","« une boîte en fer » : le CDN indique :",["la matière","l'usage","l'appartenance"],0,"En fer → matière."],
["q","« une machine à laver » : le CDN indique :",["l'usage","la matière","le lieu"],0,"Sert à laver."],
["q","Dans « le cartable de Youssef », le CDN est :",["de Youssef","le cartable","cartable"],0,"Il précise à qui."],
["vf","Le complément du nom fait partie du groupe nominal.",true,"Il complète le nom."]],
d:[["Reconnaître le CDN","Il suit le nom et commence souvent par « de » ou « à ». On le distingue du COI : le COI complète un verbe (« Il parle de son voyage »), le CDN complète un nom (« le récit de son voyage »)."],
["Ses différents sens","Matière : un pull en laine. Contenu : un panier de fruits. Usage : une brosse à dents. Lieu : les plages du Maroc. Appartenance : la voiture de mon père. Caractéristique : une fille aux yeux verts."],
["Dans la description","Le CDN est très utile pour décrire un objet avec précision : « un vieux gunbri en bois de noyer aux cordes de boyau »."]],
wx:[["Ajoute un CDN de matière et un CDN d'usage : « un sac ».",["Matière : un sac en cuir.","Usage : un sac de sport.","« un sac en cuir » / « un sac de sport »."]]]},

/*25*/{t:"Décrire en énumérant",
k:["<b>Énumérer</b>, c'est citer une suite d'éléments pour décrire.","Les éléments sont séparés par des <b>virgules</b>, et le dernier est souvent introduit par <b>et</b> : « Il y avait des pommes, des poires, des oranges et des figues. »","On peut annoncer l'énumération par les <b>deux-points</b> : « Dans le panier, il y a : … »","L'énumération peut suivre un <b>ordre</b> : du plus grand au plus petit, de gauche à droite, du premier plan à l'arrière-plan.","Elle crée une impression d'<b>abondance</b> ou de <b>richesse</b>.","On peut utiliser des mots d'organisation : <b>d'abord</b>, <b>puis</b>, <b>enfin</b>, <b>au premier plan</b>, <b>à l'arrière-plan</b>."],
w:[["énumérer","يعدد"],["énumération","تعداد"],["virgule","فاصلة"],["deux-points","نقطتان"],["abondance","وفرة"]],
x:[["q","Dans une énumération, les éléments sont séparés par :",["des virgules","des points","des points d'interrogation"],0,"Et le dernier par « et »."],
["q","Le signe qui annonce une énumération :",["les deux-points","le point d'exclamation","les guillemets"],0,"« : »"],
["vf","L'énumération peut créer une impression d'abondance.",true,"Beaucoup d'éléments."],
["o","Range les mots pour former une phrase.",["Sur","la","table,","il","y","a","du","pain,","du","miel","et","des","olives."],"Commence par le lieu."]],
d:[["La ponctuation","« Au marché, on trouve des légumes, des fruits, des épices et des tissus. » Les virgules séparent les éléments, « et » annonce le dernier. Les deux-points s'emploient quand on annonce la liste : « Il a apporté trois choses : une lampe, une corde et un couteau. »"],
["Ordonner l'énumération","Une énumération désordonnée est difficile à suivre. On choisit un ordre logique : dans l'espace (de haut en bas), par importance, par catégories (les couleurs, puis les odeurs, puis les bruits)."],
["Effet sur le lecteur","Une longue énumération donne une impression de richesse, de foule ou d'abondance (un souk animé). Une énumération de verbes donne une impression de rapidité : « Il courut, sauta, grimpa et disparut. »"]],
wx:[["Décris ton cartable en énumérant.",["On annonce : Dans mon cartable, il y a :","On cite : des cahiers, une trousse, deux livres","et le dernier avec « et » : et une bouteille d'eau."]]]},

/*26*/{t:"La proposition subordonnée relative",
k:["La <b>proposition subordonnée relative</b> complète un nom, appelé <b>antécédent</b>.","Elle commence par un <b>pronom relatif</b> : <b>qui</b>, <b>que</b>, <b>dont</b>, <b>où</b>.","<b>Qui</b> est sujet du verbe de la relative : « Le garçon <b>qui</b> chante est mon frère. »","<b>Que</b> est COD : « Le livre <b>que</b> je lis est passionnant. »","<b>Où</b> indique le lieu ou le temps : « La ville <b>où</b> j'habite est belle. »","<b>Dont</b> remplace un complément introduit par « de » : « Le film <b>dont</b> je parle… » (je parle de ce film)."],

x:[["q","« La maison ___ je vis est grande. »",["où","que","qui"],0,"Lieu."],
["q","« Le chat ___ dort est blanc. »",["qui","que","dont"],0,"Sujet de « dort »."],
["q","« La robe ___ tu portes est jolie. »",["que","qui","où"],0,"COD de « portes »."],
["q","« L'ami ___ je t'ai parlé arrive. »",["dont","que","où"],0,"Parler de quelqu'un."],
["g","Voici le livre ___ m'a plu et ___ je relis souvent.",["qui","que"],["dont","où"],"Qui : sujet. Que : COD."]],
d:[["À quoi sert la relative ?","Elle permet de réunir deux phrases et de préciser un nom sans répétition : « J'ai un chat. Ce chat est noir. » → « J'ai un chat qui est noir. » Elle fonctionne comme un adjectif : « un chat noir » / « un chat qui est noir »."],
["Choisir le pronom","On regarde la fonction du pronom dans la relative. S'il n'y a pas de sujet après le pronom : qui. S'il y a déjà un sujet et que le verbe a besoin d'un COD : que. Pour un lieu ou un moment : où. Pour un verbe construit avec « de » : dont."],

/*27*/{t:"Localiser dans l'espace",
k:["Pour <b>situer</b> des objets ou des personnes dans un lieu, on utilise des <b>indicateurs de lieu</b>.","Prépositions et locutions : <b>sur</b>, <b>sous</b>, <b>dans</b>, <b>devant</b>, <b>derrière</b>, <b>entre</b>, <b>à côté de</b>, <b>en face de</b>, <b>près de</b>, <b>loin de</b>, <b>au-dessus de</b>, <b>au-dessous de</b>.","Adverbes : <b>ici</b>, <b>là</b>, <b>là-bas</b>, <b>partout</b>, <b>dedans</b>, <b>dehors</b>.","Pour un paysage : <b>au premier plan</b>, <b>au second plan</b>, <b>à l'arrière-plan</b>, <b>à gauche</b>, <b>à droite</b>, <b>au centre</b>, <b>au loin</b>.","Ces indicateurs sont souvent des <b>compléments circonstanciels de lieu</b>.","Pour décrire un lieu, on suit un ordre : de près à loin, de gauche à droite, de bas en haut."],

["o","Range de l'avant vers le fond.",["au premier plan","au second plan","à l'arrière-plan"],"Du plus proche au plus lointain."]],
d:[["Décrire un lieu avec ordre","Sans ordre, le lecteur ne peut pas imaginer le lieu. Exemple : « Au premier plan, un petit pont de pierre traverse la rivière. Au second plan, on voit un village aux maisons blanches. À l'arrière-plan, les montagnes enneigées se dressent contre le ciel. »"],

/*28*/{t:"Le vocabulaire des sensations et la gradation",
k:["Les <b>cinq sens</b> : la <b>vue</b> (voir), l'<b>ouïe</b> (entendre), l'<b>odorat</b> (sentir), le <b>goût</b> (goûter), le <b>toucher</b> (toucher).","Vocabulaire de la vue : couleurs, lumière (brillant, sombre, éclatant). De l'ouïe : bruits (murmure, grondement, cri).","De l'odorat : odeur, parfum, senteur, puanteur. Du goût : sucré, salé, amer, acide, épicé. Du toucher : doux, rugueux, lisse, piquant, brûlant.","La <b>gradation</b> est une suite de mots rangés par ordre d'intensité.","<b>Gradation croissante</b> : du plus faible au plus fort : « Il marchait, courait, volait. »","<b>Gradation décroissante</b> : du plus fort au plus faible : « un cri, un murmure, un souffle »."],
w:[["sensation","إحساس"],["vue","البصر"],["ouïe","السمع"],["odorat","الشم"],["goût","الذوق"],["toucher","اللمس"],["gradation","تدرج"]],

d:[["Décrire avec les sens","Une bonne description ne se limite pas à la vue. « Dans le souk, on entend les marchands crier, on sent l'odeur de la menthe et des épices, on touche les tissus soyeux. » Le lecteur a l'impression d'y être."],
["Enrichir le vocabulaire","Au lieu de « bruit », on peut dire : murmure, bourdonnement, craquement, grincement, vacarme. Au lieu de « odeur » : parfum, arôme, senteur (agréable) ou puanteur (désagréable)."],

/*30*/{t:"La synonymie et l'antonymie",
k:["Des <b>synonymes</b> sont des mots de même nature qui ont un <b>sens proche</b> : content / heureux, maison / demeure.","Les synonymes permettent d'<b>éviter les répétitions</b>.","Le synonyme dépend souvent du <b>contexte</b> : « un vieux livre » → ancien ; « un vieux monsieur » → âgé.","Des <b>antonymes</b> (ou contraires) sont des mots de sens <b>opposé</b> : grand / petit, monter / descendre.","On forme parfois l'antonyme avec un <b>préfixe</b> : <b>in-</b> (utile → inutile), <b>im-</b> (possible → impossible), <b>dé-</b> (faire → défaire), <b>mal-</b> (heureux → malheureux), <b>il-</b> (légal → illégal), <b>ir-</b> (réel → irréel).","Un synonyme et un antonyme sont de même nature que le mot de départ : un verbe pour un verbe."],
w:[["synonyme","مرادف"],["antonyme","ضد"],["contexte","السياق"],["préfixe","سابقة"],["répétition","تكرار"]],
x:[["q","Synonyme de « rapide » :",["vif","lent","calme"],0,"Sens proche."],
["q","Antonyme de « possible » :",["impossible","inpossible","dépossible"],0,"im- devant p."],
["q","Antonyme de « monter » :",["descendre","grimper","sauter"],0,"Sens opposé."],
["vf","« Commencer » et « débuter » sont des synonymes.",true,"Même sens."],
["m","Relie les contraires.",[["ouvrir","fermer"],["joyeux","triste"],["honnête","malhonnête"]],"Sens opposé."]],
d:[["Utiliser les synonymes","Dans une rédaction, on évite de répéter le même mot. « Le chien aboie. Le chien court. Le chien saute. » → « Le chien aboie. L'animal court, puis le fidèle compagnon saute. »"],
["Le contexte","Un mot peut avoir plusieurs synonymes selon la phrase : « un temps doux » (agréable), « une voix douce » (faible, tendre), « une eau douce » (non salée)."],
["Les préfixes négatifs","in- devient im- devant m, b, p (immobile, imbuvable, impatient), il- devant l (illisible), ir- devant r (irrégulier). dé- / dés- : faire / défaire, obéir / désobéir."]],

k:["Des <b>homonymes</b> se prononcent de la même façon mais ont un sens différent : <b>vers</b> (poème) / <b>verre</b> / <b>vert</b> / <b>ver</b> (de terre).","Certains homonymes s'écrivent pareil : le <b>livre</b> (à lire) / la <b>livre</b> (poids).","Les homonymes grammaticaux : <b>a</b> / <b>à</b>, <b>et</b> / <b>est</b>, <b>son</b> / <b>sont</b>, <b>ou</b> / <b>où</b>, <b>on</b> / <b>ont</b>.","Astuce : <b>a</b> → on peut dire « avait » ; <b>est</b> → « était » ; <b>sont</b> → « étaient » ; <b>ont</b> → « avaient ».","Des <b>paronymes</b> se ressemblent mais ne se prononcent pas exactement pareil : <b>éruption</b> / <b>irruption</b>, <b>conjecture</b> / <b>conjoncture</b>, <b>affliger</b> / <b>infliger</b>.","Le <b>contexte</b> permet de choisir le bon mot."],
