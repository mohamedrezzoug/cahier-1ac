/*0*/{s:"Unité 1 — Ch. 1 : Observation des milieux naturels",t:"La diversité des milieux naturels",
k:["Un <b>milieu naturel</b> est un endroit de la nature où vivent des êtres vivants : forêt, prairie, mare, désert, littoral…","Pour étudier un milieu, on fait une <b>sortie</b> : on observe, on note, on photographie, on prélève des échantillons.","Chaque milieu a des <b>êtres vivants</b> (animaux, végétaux, champignons) : ce sont les facteurs <b>biotiques</b>.","Chaque milieu a aussi des facteurs <b>abiotiques</b> (non vivants) : sol, eau, lumière, température, humidité.","Les milieux sont <b>divers</b> : ils n'ont pas les mêmes êtres vivants ni les mêmes conditions.","Au Maroc : forêt de cèdres du Moyen Atlas, arganeraie, oasis, littoral, steppes."],
w:[["milieu naturel","وسط طبيعي"],["sortie","خرجة"],["facteur biotique","عامل حيوي"],["facteur abiotique","عامل لاحيوي"],["échantillon","عينة"],["êtres vivants","كائنات حية"]],
x:[["q","Lequel est un facteur abiotique ?",["la température","l'arbre","le lapin","le champignon"],0,"Abiotique = non vivant."],
["q","La forêt de cèdres se trouve dans :",["le Moyen Atlas","le Sahara","la côte atlantique"],0,"Région d'Ifrane, Azrou."],
["vf","Tous les milieux naturels ont les mêmes êtres vivants.",false,"Chaque milieu a ses propres espèces."],
["m","Classe.",[["l'humidité","abiotique"],["la fourmi","biotique"],["la lumière","abiotique"]],"Vivant ou non vivant ?"],
["q","Pendant une sortie, on note les observations dans :",["un carnet de terrain","un livre de cuisine"],0,"On note tout avec la date et le lieu."]],
d:[["Qu'est-ce qu'un milieu ?","Un milieu naturel est un espace avec des caractéristiques propres : type de sol, quantité d'eau, lumière, température. Une forêt est ombragée et humide ; un désert est sec, très chaud le jour et froid la nuit ; une mare est un milieu aquatique."],
["Préparer et réaliser une sortie","Avant la sortie, on prépare le matériel : carnet, crayon, loupe, sachets, thermomètre, appareil photo. Sur le terrain, on respecte la nature : on n'arrache pas les plantes inutilement, on ne laisse pas de déchets. On note le lieu, la date et la météo."],
["Les composantes d'un milieu","Tout milieu comprend des êtres vivants (biotiques) et un environnement physique (abiotique). Ensemble, ils forment un écosystème. Les êtres vivants dépendent des conditions du milieu : sans eau, peu de plantes ; sans plantes, peu d'animaux."]],
wx:[["Compare une forêt et un désert.",["Forêt : beaucoup d'arbres, ombre, humidité, sol riche, nombreux animaux.","Désert : peu de plantes, beaucoup de lumière, sécheresse, fortes variations de température.","Les êtres vivants sont différents car les conditions du milieu sont différentes."]]]},

/*1*/{t:"La diversité des constituants des milieux naturels",
k:["Dans un même milieu, les êtres vivants ne sont pas répartis au hasard : ils dépendent des <b>facteurs du milieu</b>.","On mesure les facteurs avec des instruments : <b>thermomètre</b> (température), <b>hygromètre</b> (humidité), <b>luxmètre</b> (lumière).","Les plantes qui aiment l'ombre (fougères, mousses) vivent dans les endroits sombres et humides.","La <b>répartition</b> des êtres vivants change avec l'altitude, l'exposition au soleil, la nature du sol.","On peut représenter les relevés par un <b>tableau</b> ou un <b>graphique</b>.","Les êtres vivants sont adaptés à leur milieu (le cactus garde l'eau, le chameau supporte la soif)."],
w:[["répartition","توزيع"],["hygromètre","مقياس الرطوبة"],["luxmètre","مقياس الإضاءة"],["altitude","ارتفاع"],["adaptation","تكيف"]],
x:[["q","L'humidité de l'air se mesure avec :",["un hygromètre","un thermomètre","un luxmètre"],0,"Hygro = humidité."],
["q","Les mousses vivent surtout dans les endroits :",["ombragés et humides","secs et ensoleillés"],0,"Elles ont besoin d'humidité."],
["vf","La répartition des êtres vivants dépend des facteurs du milieu.",true,"Lumière, humidité, température…"],
["m","Relie l'instrument au facteur mesuré.",[["thermomètre","température"],["hygromètre","humidité"],["luxmètre","lumière"]],"Chaque instrument a son facteur."]],
d:[["Faire des relevés","Pendant la sortie, on mesure les facteurs en plusieurs endroits (sous les arbres, en plein soleil, près de l'eau) et à plusieurs heures. On note aussi les êtres vivants trouvés à chaque endroit. En comparant, on comprend ce qui influence leur répartition."],
["L'influence de la lumière et de l'humidité","Sous les grands arbres, il fait sombre et humide : on trouve des mousses et des fougères. Dans une clairière ensoleillée, on trouve des herbes et des fleurs. Les escargots sortent quand il pleut, les lézards aiment les pierres chaudes."],
["L'adaptation","Chaque être vivant possède des caractères qui lui permettent de vivre dans son milieu. Le chêne-liège a une écorce épaisse qui le protège ; l'arganier résiste à la sécheresse grâce à ses racines profondes."]],
wx:[["On trouve des fougères au fond d'un ravin mais pas sur la colline ensoleillée. Explique.",["Au fond du ravin, il y a peu de lumière et beaucoup d'humidité.","Sur la colline, il y a beaucoup de lumière et le sol est sec.","Les fougères ont besoin d'humidité et d'ombre : leur répartition dépend de ces facteurs."]]]},

/*2*/{t:"La cellule, unité structurelle de l'être vivant",
k:["Tous les êtres vivants sont formés de <b>cellules</b> : c'est l'unité de base de la vie.","Les cellules sont très petites : on les observe au <b>microscope</b>.","Toute cellule a une <b>membrane</b>, un <b>cytoplasme</b> et un <b>noyau</b>.","La cellule <b>végétale</b> a en plus une <b>paroi</b> rigide, une grande <b>vacuole</b> et souvent des <b>chloroplastes</b> (verts).","Certains êtres vivants n'ont qu'une seule cellule : ils sont <b>unicellulaires</b> (paramécie, levure). Les autres sont <b>pluricellulaires</b>.","Grossissement du microscope = grossissement de l'oculaire × grossissement de l'objectif."],
w:[["cellule","خلية"],["noyau","نواة"],["cytoplasme","سيتوبلازم"],["membrane","غشاء"],["paroi","جدار"],["microscope","مجهر"],["chloroplaste","بلاستيدة خضراء"]],
x:[["q","Quel élément existe seulement dans la cellule végétale ?",["la paroi","le noyau","la membrane","le cytoplasme"],0,"La paroi est rigide, autour de la membrane."],
["q","Oculaire ×10 et objectif ×40. Grossissement :",["×400","×50","×4","×30"],0,"`10×40=400`."],
["vf","La paramécie est un être unicellulaire.",true,"Elle est formée d'une seule cellule."],
["m","Relie chaque partie à son rôle.",[["noyau","dirige la cellule"],["membrane","entoure la cellule"],["chloroplaste","fabrique la matière avec la lumière"]],"Revois le schéma."],
["q","Les chloroplastes donnent à la feuille sa couleur :",["verte","rouge","bleue"],0,"Ils contiennent la chlorophylle."]],
d:[["Utiliser le microscope","On place la préparation sur la platine, on commence par le plus faible objectif, on règle avec la vis macrométrique puis micrométrique. On observe une fine couche (épiderme d'oignon, cellules de la joue) colorée pour mieux voir le noyau."],
["Cellule animale et cellule végétale","Une cellule de la joue est arrondie, avec une membrane souple, un cytoplasme et un noyau. Une cellule d'épiderme d'oignon est rectangulaire, entourée d'une paroi, avec une grande vacuole. Une cellule de feuille contient en plus des chloroplastes verts."],
["Du simple au complexe","Notre corps contient des milliards de cellules qui forment des tissus, puis des organes. Les cellules ne sont pas toutes pareilles : cellules de la peau, des muscles, nerveuses, sanguines. Mais toutes ont une membrane, un cytoplasme et un noyau (sauf les globules rouges adultes)."]],
wx:[["Comment savoir si une cellule observée est végétale ?",["On cherche une paroi épaisse autour de la cellule.","On cherche une grande vacuole et des chloroplastes.","Si on les trouve, c'est une cellule végétale."]]]},

/*3*/{s:"Ch. 2 : La respiration dans différents milieux",t:"La respiration chez les êtres vivants",
k:["Respirer, c'est <b>absorber du dioxygène</b> (O₂) et <b>rejeter du dioxyde de carbone</b> (CO₂) : ce sont les <b>échanges gazeux respiratoires</b>.","L'<b>eau de chaux</b> se <b>trouble</b> en présence de dioxyde de carbone.","L'air expiré contient moins de dioxygène et plus de dioxyde de carbone que l'air inspiré.","Tous les êtres vivants respirent : animaux, <b>végétaux</b> (le jour et la nuit), champignons.","Les graines en germination respirent : elles troublent l'eau de chaux.","La respiration libère l'<b>énergie</b> dont l'organisme a besoin."],
w:[["respiration","تنفس"],["dioxygène","ثنائي الأوكسجين"],["dioxyde de carbone","ثنائي أوكسيد الكربون"],["eau de chaux","ماء الجير"],["échanges gazeux","التبادلات الغازية"]],
x:[["q","L'eau de chaux se trouble en présence de :",["dioxyde de carbone","dioxygène","diazote"],0,"C'est le test du CO₂."],
["q","Pendant la respiration, on absorbe :",["du dioxygène","du dioxyde de carbone"],0,"Et on rejette du CO₂."],
["vf","Les plantes ne respirent pas.",false,"Les plantes respirent jour et nuit."],
["vf","L'air expiré contient plus de CO₂ que l'air inspiré.",true,"Le CO₂ est produit par l'organisme."],
["q","Des graines en germination dans un flacon fermé avec de l'eau de chaux : l'eau de chaux :",["se trouble","reste limpide"],0,"Les graines respirent et rejettent du CO₂."]],
d:[["Mettre en évidence les échanges gazeux","On souffle avec une paille dans l'eau de chaux : elle se trouble. L'air que nous expirons contient du dioxyde de carbone. Avec un appareil (sonde), on mesure que l'air inspiré contient 21 % de dioxygène et l'air expiré environ 16 %."],
["Chez les animaux et les végétaux","Un petit animal (criquet) placé dans un bocal avec de l'eau de chaux la trouble. Une plante placée à l'obscurité dans une cloche trouble aussi l'eau de chaux. Les champignons et les graines qui germent respirent aussi."],
["Pourquoi respirer ?","Le dioxygène sert à « brûler » les aliments dans les cellules pour produire l'énergie nécessaire pour bouger, grandir et garder la chaleur du corps. Cette réaction produit du dioxyde de carbone, que l'organisme rejette."]],
wx:[["Comment prouver qu'une plante verte respire ?",["On place la plante sous une cloche à l'obscurité, avec un récipient d'eau de chaux.","On fait la même expérience sans plante (témoin).","Seule l'eau de chaux avec la plante se trouble : la plante rejette du CO₂, elle respire."]]]},

/*4*/{t:"La respiration en milieu aérien chez les animaux",
k:["Chez l'Homme et les mammifères, l'organe respiratoire est le <b>poumon</b>.","Trajet de l'air : <b>fosses nasales</b> → <b>pharynx</b> → <b>trachée</b> → <b>bronches</b> → <b>bronchioles</b> → <b>alvéoles</b>.","Les échanges gazeux ont lieu au niveau des <b>alvéoles pulmonaires</b>, entourées de vaisseaux sanguins (capillaires).","<b>Inspiration</b> : la cage thoracique augmente de volume, l'air entre. <b>Expiration</b> : elle diminue, l'air sort.","Le <b>diaphragme</b> et les muscles des côtes permettent les mouvements respiratoires.","Le rythme respiratoire augmente pendant l'effort. Le tabac abîme les poumons."],
w:[["poumon","رئة"],["trachée","القصبة الهوائية"],["bronches","القصيبات"],["alvéole","حويصلة رئوية"],["inspiration","شهيق"],["expiration","زفير"],["diaphragme","الحجاب الحاجز"]],
x:[["o","Range le trajet de l'air inspiré.",["fosses nasales","trachée","bronches","alvéoles"],"De l'extérieur vers l'intérieur des poumons."],
["q","Les échanges gazeux se font dans :",["les alvéoles","la trachée","l'estomac"],0,"Les alvéoles sont entourées de capillaires."],
["q","Pendant l'inspiration, le volume de la cage thoracique :",["augmente","diminue"],0,"L'air entre."],
["vf","Pendant un effort, le rythme respiratoire diminue.",false,"Il augmente : le corps a besoin de plus de dioxygène."],
["m","Relie.",[["inspiration","l'air entre"],["expiration","l'air sort"],["diaphragme","muscle respiratoire"]],"Revois le cours."]],
d:[["L'appareil respiratoire","L'air entre par le nez, où il est filtré, réchauffé et humidifié. Il descend par la trachée, qui se divise en deux bronches, une pour chaque poumon. Les bronches se ramifient en bronchioles très fines qui se terminent par des alvéoles, petits sacs à paroi très mince."],
["Les échanges dans les alvéoles","Les alvéoles sont entourées de petits vaisseaux sanguins. Le dioxygène de l'air passe dans le sang, qui le transporte vers tous les organes. Le dioxyde de carbone fait le chemin inverse et est rejeté à l'expiration. La surface totale des alvéoles est immense, comme un terrain de tennis."],
["Les mouvements respiratoires","À l'inspiration, le diaphragme descend et les côtes se soulèvent : la cage thoracique s'agrandit et l'air entre. À l'expiration, ils reprennent leur place et l'air sort. Un adulte au repos respire environ 16 fois par minute."]],
wx:[["Pourquoi respire-t-on plus vite en courant ?",["Les muscles travaillent plus et ont besoin de plus d'énergie.","Ils consomment plus de dioxygène et rejettent plus de CO₂.","Le rythme respiratoire augmente pour apporter plus de dioxygène."]]]},

/*5*/{t:"La respiration des insectes et des plantes en milieu aérien",
k:["Les <b>insectes</b> respirent par des <b>trachées</b> : de fins tubes qui conduisent l'air directement aux organes.","L'air entre dans les trachées par des orifices sur les côtés de l'abdomen : les <b>stigmates</b>.","Les mouvements de l'abdomen du criquet font entrer et sortir l'air.","Les <b>plantes</b> échangent les gaz par des petits orifices, surtout sur la face inférieure des feuilles : les <b>stomates</b>.","Chaque stomate est formé de deux <b>cellules stomatiques</b> qui entourent un <b>ostiole</b>.","Les tiges et les racines respirent aussi (lenticelles, air du sol)."],
w:[["trachées (insectes)","القصيبات الهوائية"],["stigmate","ثغرة تنفسية"],["stomate","ثغر"],["ostiole","فتحة الثغر"],["abdomen","البطن"]],
x:[["q","Chez les insectes, l'air entre par :",["les stigmates","la bouche","les branchies"],0,"Orifices sur l'abdomen."],
["q","Les stomates se trouvent surtout sur :",["la face inférieure des feuilles","les racines","les fleurs"],0,"Observation au microscope."],
["vf","Les insectes ont des poumons.",false,"Ils respirent par des trachées."],
["m","Relie chaque être vivant à son organe respiratoire.",[["criquet","trachées"],["Homme","poumons"],["plante","stomates"]],"Chacun son organe."]],
d:[["Chez le criquet","On observe sur les côtés de l'abdomen une rangée de petits points : les stigmates. Ils s'ouvrent sur des tubes, les trachées, qui se ramifient dans tout le corps. L'air arrive directement aux cellules sans passer par le sang. Si on bouche les stigmates avec de la graisse, l'insecte s'asphyxie."],
["Chez les plantes","On décolle un fragment de l'épiderme inférieur d'une feuille et on l'observe au microscope : on voit de nombreux stomates. Le gaz entre et sort par l'ostiole. Les stomates servent aussi à la photosynthèse et à la transpiration (sortie de vapeur d'eau)."]],
wx:[["On enduit de vaseline la face inférieure de feuilles. Que se passe-t-il ?",["La vaseline bouche les stomates.","Les échanges gazeux ne peuvent plus se faire par ces feuilles.","Les feuilles finissent par jaunir et se faner."]]]},

/*6*/{t:"La respiration en milieu aquatique",
k:["Dans l'eau, le dioxygène est <b>dissous</b>. Les animaux aquatiques l'extraient de l'eau.","Le <b>poisson</b> respire par des <b>branchies</b>, protégées par les <b>opercules</b>.","Trajet de l'eau : elle entre par la <b>bouche</b>, passe sur les branchies et sort par les <b>ouïes</b>.","Les branchies sont rouges car très riches en vaisseaux sanguins : les échanges gazeux s'y font.","Le <b>têtard</b> respire par des branchies, la grenouille adulte par des poumons et sa peau. Certains animaux aquatiques (dauphin, baleine) remontent respirer l'air.","La pollution et la chaleur <b>diminuent</b> le dioxygène dissous : les poissons peuvent mourir."],
w:[["branchies","خياشيم"],["opercule","غطاء خيشومي"],["ouïes","فتحات خيشومية"],["dissous","مذاب"],["têtard","شرغوف"]],
x:[["q","Le poisson respire par :",["des branchies","des poumons","des trachées"],0,"Organes rouges sous les opercules."],
["o","Range le trajet de l'eau chez le poisson.",["bouche","branchies","ouïes"],"L'eau entre par la bouche."],
["vf","Le dauphin respire par des branchies.",false,"C'est un mammifère : il a des poumons."],
["q","Pourquoi les branchies sont-elles rouges ?",["elles sont riches en vaisseaux sanguins","elles sont malades","à cause de la nourriture"],0,"Le sang capte le dioxygène."],
["q","Si l'eau d'un aquarium chauffe trop, le dioxygène dissous :",["diminue","augmente"],0,"L'eau chaude contient moins d'O₂."]],
d:[["Le dioxygène dissous","L'eau contient du dioxygène dissous, en bien plus petite quantité que l'air. L'eau froide et agitée (torrents) en contient plus que l'eau chaude et calme. On aère les aquariums avec une pompe pour ajouter du dioxygène."],
["Les branchies du poisson","Sous chaque opercule, il y a quatre arcs branchiaux portant des lamelles fines et rouges. L'eau qui passe sur ces lamelles cède son dioxygène au sang et reçoit le dioxyde de carbone. Le poisson ouvre et ferme la bouche et les opercules pour faire circuler l'eau."],
["D'autres animaux aquatiques","Le têtard a des branchies, puis devient une grenouille qui respire par ses poumons et sa peau humide. Les larves de moustique respirent l'air grâce à un tube. Les plantes aquatiques absorbent le dioxygène dissous à travers toute leur surface."]],
wx:[["Un poisson sorti de l'eau meurt. Pourquoi ?",["Hors de l'eau, les lamelles des branchies se collent et sèchent.","La surface d'échange devient très petite.","Le poisson ne peut plus prendre le dioxygène : il s'asphyxie."]]]},

/*7*/{s:"Ch. 3 : L'alimentation chez les êtres vivants",t:"Le régime alimentaire omnivore de l'Homme",
k:["L'Homme est <b>omnivore</b> : il mange des aliments d'origine <b>animale</b> et <b>végétale</b>.","Les aliments <b>bâtisseurs</b> (riches en protéines : viande, poisson, œufs, lentilles) servent à la croissance.","Les aliments <b>énergétiques</b> (glucides et lipides : pain, riz, huile, sucre) donnent l'énergie.","Les aliments <b>fonctionnels</b> (vitamines, sels minéraux : fruits, légumes, lait) protègent la santé.","Une <b>ration alimentaire équilibrée</b> contient tous les groupes d'aliments en bonnes quantités, et de l'eau.","Les excès (sucre, gras, sel) et les manques causent des maladies : obésité, carences, anémie."],
w:[["omnivore","قارت"],["aliment bâtisseur","غذاء بنائي"],["aliment énergétique","غذاء طاقي"],["aliment fonctionnel","غذاء وظيفي"],["ration alimentaire","الحصة الغذائية"],["carence","نقص"]],
x:[["q","Un aliment bâtisseur est :",["les lentilles","le sucre","l'huile"],0,"Riche en protéines."],
["q","L'Homme est :",["omnivore","herbivore","carnivore"],0,"Il mange de tout."],
["m","Relie chaque aliment à son groupe.",[["le pain","énergétique"],["le poisson","bâtisseur"],["l'orange","fonctionnel"]],"Revois les groupes d'aliments."],
["vf","Manger beaucoup de sucre est bon pour la santé.",false,"L'excès de sucre cause l'obésité et les caries."],
["q","Le manque de fer peut causer :",["l'anémie","l'obésité","la fièvre"],0,"Une carence."]],
d:[["Les groupes d'aliments","On classe les aliments selon leur rôle. Les bâtisseurs construisent et réparent le corps (protéines). Les énergétiques fournissent le carburant (glucides : pain, pâtes ; lipides : huile, beurre). Les fonctionnels assurent le bon fonctionnement (vitamines et minéraux des fruits et légumes, calcium du lait)."],
["La ration équilibrée","Un repas équilibré contient un aliment de chaque groupe : par exemple un tajine de légumes avec de la viande, du pain, un fruit et de l'eau. Les besoins changent avec l'âge, l'activité et le sexe : un adolescent qui grandit a besoin de beaucoup de protéines et de calcium."],
["Les troubles alimentaires","Trop d'aliments gras et sucrés et pas assez d'activité physique mènent à l'obésité. Un manque de vitamine C cause le scorbut, un manque de fer l'anémie, un manque de calcium fragilise les os. Il faut manger varié et boire de l'eau."]],
wx:[["Le petit-déjeuner de Sara : thé sucré et pain avec confiture. Est-il équilibré ?",["Il contient surtout des aliments énergétiques (sucre, pain).","Il manque des bâtisseurs (lait, œuf) et des fonctionnels (fruit).","Il faudrait ajouter un verre de lait ou un œuf, et un fruit."]]]},

/*8*/{t:"Régimes alimentaires herbivore et carnivore",
k:["Un animal <b>herbivore</b> mange des végétaux (mouton, vache, lapin). Un <b>carnivore</b> mange d'autres animaux (chien, chat, lion).","La <b>dentition</b> est adaptée au régime : <b>incisives</b> (couper), <b>canines</b> (déchirer), <b>molaires</b> (broyer).","Le <b>carnivore</b> a de grandes canines pointues et des molaires tranchantes.","L'<b>herbivore</b> n'a pas de canines (ou petites) ; il a un espace sans dents (<b>barre</b>) et des molaires larges et plates pour broyer l'herbe.","Le tube digestif d'un herbivore est <b>long</b> (la cellulose est difficile à digérer). Celui d'un carnivore est <b>court</b>.","Le mouton est un <b>ruminant</b> : il a un estomac à 4 poches et remâche l'herbe."],
w:[["herbivore","عاشب"],["carnivore","لاحم"],["incisive","قاطعة"],["canine","ناب"],["molaire","ضرس"],["ruminant","مجتر"],["dentition","التسنن"]],
x:[["q","Les canines servent à :",["déchirer","broyer","couper"],0,"Grandes et pointues chez les carnivores."],
["q","Le mouton est :",["herbivore","carnivore","omnivore"],0,"Il mange de l'herbe."],
["vf","Le tube digestif d'un herbivore est plus long que celui d'un carnivore.",true,"L'herbe est longue à digérer."],
["m","Relie chaque dent à son rôle.",[["incisive","couper"],["canine","déchirer"],["molaire","broyer"]],"Les trois types de dents."],
["q","La « barre » est :",["un espace sans dents chez l'herbivore","une dent du chien","un os de la mâchoire du lion"],0,"Entre les incisives et les molaires."]],
d:[["La dentition du carnivore","Le chien a des incisives petites, des canines longues et pointues pour saisir et déchirer la viande, et des molaires tranchantes (carnassières) qui coupent comme des ciseaux. Sa mâchoire bouge de haut en bas."],
["La dentition de l'herbivore","Le mouton n'a pas d'incisives sur la mâchoire supérieure : il coupe l'herbe entre ses incisives inférieures et un bourrelet dur. Il n'a pas de canines. Ses molaires larges, aux crêtes d'émail, broient l'herbe par un mouvement de la mâchoire de gauche à droite."],
["Le régime et le tube digestif","Les végétaux contiennent de la cellulose, difficile à digérer. Les herbivores ont un tube digestif très long (environ 25 fois la longueur du corps chez le mouton) et des microbes qui les aident. Les ruminants avalent vite, puis ramènent l'herbe dans la bouche pour la mâcher à nouveau."]],
wx:[["On trouve un crâne avec de grandes canines et des molaires pointues. Quel est le régime de l'animal ?",["Les grandes canines servent à déchirer la chair.","Les molaires pointues coupent la viande.","L'animal est carnivore."]]]},

/*9*/{t:"La nutrition chez les plantes",
k:["Les plantes vertes fabriquent leur propre matière organique : ce sont des <b>producteurs</b>.","Elles ont besoin d'<b>eau</b>, de <b>sels minéraux</b>, de <b>dioxyde de carbone</b> et de <b>lumière</b>.","Les racines absorbent l'eau et les sels minéraux (la <b>sève brute</b>) grâce aux <b>poils absorbants</b>.","Dans les feuilles, la <b>chlorophylle</b> capte la lumière : c'est la <b>photosynthèse</b>. Elle produit de la matière organique (amidon) et rejette du <b>dioxygène</b>.","L'<b>eau iodée</b> colore l'amidon en <b>bleu-noir</b>.","La matière fabriquée (<b>sève élaborée</b>) est distribuée à toute la plante et mise en réserve (tubercule de pomme de terre)."],
w:[["photosynthèse","التركيب الضوئي"],["chlorophylle","اليخضور"],["poils absorbants","الأوبار الماصة"],["sève brute","النسغ الخام"],["sève élaborée","النسغ الكامل"],["amidon","النشا"],["eau iodée","الماء اليودي"]],
x:[["q","L'eau iodée colore l'amidon en :",["bleu-noir","rouge","jaune","vert"],0,"Test de l'amidon."],
["q","La photosynthèse se fait en présence de :",["lumière","obscurité totale"],0,"La chlorophylle capte la lumière."],
["q","Pendant la photosynthèse, la plante rejette :",["du dioxygène","du dioxyde de carbone"],0,"Et absorbe du CO₂."],
["vf","Les racines absorbent l'eau grâce aux poils absorbants.",true,"Ils augmentent la surface d'absorption."],
["m","Relie.",[["sève brute","eau et sels minéraux"],["sève élaborée","matière organique fabriquée"],["chlorophylle","capte la lumière"]],"Revois le schéma de la plante."]],
d:[["Les besoins de la plante","Une plante sans lumière jaunit et meurt. Sans eau, elle se fane. Un sol pauvre en sels minéraux donne une plante chétive (on ajoute des engrais). Une plante placée sous une cloche sans dioxyde de carbone ne produit pas d'amidon."],
["L'absorption par les racines","Près de l'extrémité des racines, il y a une zone couverte de poils absorbants très fins, qui augmentent beaucoup la surface d'absorption. L'eau et les sels minéraux forment la sève brute, qui monte par les vaisseaux jusqu'aux feuilles."],
["La photosynthèse","Dans les feuilles, grâce à la chlorophylle et à l'énergie de la lumière, la plante transforme l'eau et le dioxyde de carbone en matière organique (sucre, amidon) et rejette du dioxygène. Une feuille cachée par du papier aluminium pendant une journée ne contient pas d'amidon : le test à l'eau iodée reste jaune-brun."]],
wx:[["Comment montrer que la lumière est nécessaire à la production d'amidon ?",["On cache une partie d'une feuille avec du papier aluminium pendant 24 h au soleil.","On décolore la feuille puis on la plonge dans l'eau iodée.","Seule la partie éclairée devient bleu-noir : l'amidon est produit à la lumière."]]]},

/*10*/{s:"Ch. 4 : Relations alimentaires et flux de matière et d'énergie",t:"Les chaînes et les réseaux alimentaires",
k:["Une <b>chaîne alimentaire</b> est une suite d'êtres vivants où chacun <b>est mangé par</b> le suivant. La flèche signifie « est mangé par ».","Elle commence toujours par un <b>producteur</b> : un végétal chlorophyllien.","Viennent ensuite les <b>consommateurs</b> : primaires (herbivores), secondaires et tertiaires (carnivores).","Les <b>décomposeurs</b> (bactéries, champignons, vers de terre) transforment les cadavres et déchets en sels minéraux.","Plusieurs chaînes reliées entre elles forment un <b>réseau alimentaire</b>.","Si un maillon disparaît, tout le réseau est perturbé."],
w:[["chaîne alimentaire","سلسلة غذائية"],["réseau alimentaire","شبكة غذائية"],["producteur","منتج"],["consommateur","مستهلك"],["décomposeur","محلل"],["maillon","حلقة"]],
x:[["o","Range la chaîne alimentaire.",["herbe","sauterelle","lézard","serpent"],"Commence par le producteur."],
["q","Le premier maillon d'une chaîne alimentaire est :",["un végétal vert","un carnivore","un décomposeur"],0,"Le producteur."],
["q","Dans « herbe → lapin → renard », le lapin est :",["consommateur primaire","producteur","consommateur secondaire"],0,"Il mange le producteur."],
["vf","La flèche signifie « mange ».",false,"Elle signifie « est mangé par »."],
["q","Les champignons qui décomposent les feuilles mortes sont des :",["décomposeurs","producteurs","consommateurs primaires"],0,"Ils recyclent la matière."]],
d:[["Écrire une chaîne","On place à gauche le végétal, puis les animaux dans l'ordre, reliés par des flèches qui vont vers celui qui mange. Exemple : feuille de chêne → chenille → mésange → épervier. La flèche montre le chemin de la matière."],
["Les niveaux","Les producteurs fabriquent la matière. Les consommateurs primaires (herbivores) mangent les producteurs. Les consommateurs secondaires mangent les herbivores. Un omnivore peut occuper plusieurs niveaux. Les décomposeurs agissent à tous les niveaux."],
["Les réseaux","Dans la nature, un animal mange souvent plusieurs espèces et est mangé par plusieurs autres. Les chaînes s'entrecroisent et forment un réseau. Si on supprime les renards, les lapins se multiplient et mangent toute l'herbe : l'équilibre est rompu."]],
wx:[["Avec : blé, souris, chouette, construis une chaîne et nomme les niveaux.",["Chaîne : blé → souris → chouette.","Blé : producteur. Souris : consommateur primaire.","Chouette : consommateur secondaire."]]]},

/*11*/{t:"La production de matière et le flux d'énergie",
k:["Les producteurs utilisent l'énergie <b>lumineuse</b> du Soleil pour fabriquer la matière organique.","Cette matière et son énergie passent d'un maillon à l'autre de la chaîne alimentaire.","À chaque niveau, une grande partie de l'énergie est <b>perdue</b> (respiration, chaleur, déchets) : environ 90 %.","Il faut donc beaucoup de producteurs pour nourrir peu de carnivores : c'est la <b>pyramide des biomasses</b>.","La <b>biomasse</b> est la masse totale des êtres vivants d'un niveau.","La matière est <b>recyclée</b> par les décomposeurs ; l'énergie, elle, ne se recycle pas."],
w:[["biomasse","الكتلة الحيوية"],["flux d'énergie","تدفق الطاقة"],["pyramide","هرم"],["matière organique","مادة عضوية"],["recyclage","تدوير"]],
x:[["q","La source d'énergie de presque toutes les chaînes alimentaires est :",["le Soleil","le sol","l'eau"],0,"Les producteurs captent la lumière."],
["q","D'un niveau à l'autre, l'énergie :",["diminue","augmente","reste la même"],0,"Une grande partie est perdue."],
["vf","Il y a plus de biomasse de carnivores que de végétaux.",false,"La base de la pyramide (végétaux) est la plus grande."],
["q","Si un niveau a 1000 kg de biomasse, le niveau suivant a environ :",["100 kg","1000 kg","10 000 kg"],0,"Seulement 10 % passent environ."]],
d:[["Le passage de la matière","Le lapin mange l'herbe : une partie sert à construire son corps, une partie est rejetée (excréments), une partie est utilisée pour son énergie (respiration). Le renard qui mange le lapin ne récupère donc qu'une petite partie de ce que le lapin a mangé."],
["La pyramide","On représente chaque niveau par un rectangle proportionnel à sa biomasse. On obtient une pyramide : large à la base (végétaux), étroite au sommet (grands carnivores). C'est pourquoi les grands carnivores sont peu nombreux et ont besoin de grands territoires."],
["Le cycle de la matière","Les décomposeurs transforment les restes en sels minéraux que les plantes absorbent à nouveau. La matière tourne en boucle. L'énergie, elle, arrive du Soleil et se perd en chaleur : elle ne fait qu'un passage."]],
wx:[["Pourquoi un champ de blé peut-il nourrir plus de personnes que le bétail élevé avec ce blé ?",["Le blé mangé directement donne presque toute son énergie aux humains.","Donné aux animaux, environ 90 % de l'énergie est perdue à ce niveau.","Manger au début de la chaîne nourrit donc plus de personnes."]]]},

/*12*/{s:"Ch. 5 : Classification des êtres vivants et équilibres naturels",t:"La classification des végétaux",
k:["<b>Classer</b>, c'est regrouper les êtres vivants selon les <b>caractères</b> qu'ils partagent.","On sépare les plantes <b>à fleurs</b> et les plantes <b>sans fleurs</b>.","Plantes à fleurs : les <b>angiospermes</b> (graines dans un fruit : oranger, blé) et les <b>gymnospermes</b> (graines nues, souvent dans des cônes : pin, cèdre).","Plantes sans fleurs : les <b>fougères</b> (racines, tiges, feuilles, spores), les <b>mousses</b> (pas de vraies racines), les <b>algues</b> (pas de racines, tiges ni feuilles).","Les plantes sans fleurs se reproduisent par des <b>spores</b>.","On utilise une <b>clé de détermination</b> pour identifier une plante."],
w:[["classification","تصنيف"],["angiospermes","كاسيات البذور"],["gymnospermes","عاريات البذور"],["fougère","سرخس"],["mousse","حزاز"],["algue","طحلب"],["spore","بوغ"]],
x:[["q","Le pin est :",["une gymnosperme","une angiosperme","une fougère"],0,"Ses graines sont nues, dans un cône."],
["q","Les fougères se reproduisent par :",["des spores","des graines","des fruits"],0,"Plantes sans fleurs."],
["vf","Les algues ont des racines, des tiges et des feuilles.",false,"Elles n'ont pas de vrais organes."],
["m","Relie.",[["oranger","angiosperme"],["cèdre","gymnosperme"],["fougère","plante sans fleurs à spores"]],"Revois les groupes."]],
d:[["Les critères de classification","On ne classe pas selon ce que la plante n'a pas, mais selon ce qu'elle possède : des fleurs ? des graines ? un fruit ? des vaisseaux conducteurs ? Les groupes s'emboîtent comme des boîtes : toutes les angiospermes ont des fleurs, toutes les plantes à fleurs ont des graines."],
["Les plantes à fleurs","Les angiospermes ont des graines enfermées dans un fruit (pomme, olive, amande). Les gymnospermes (pin, cèdre, thuya) ont des graines sur les écailles des cônes, sans fruit. Elles gardent souvent leurs feuilles en aiguilles toute l'année."],
["Les plantes sans fleurs","Sous les feuilles de fougère, on voit des petits points bruns qui contiennent les spores. Les mousses forment des tapis verts sur les pierres humides. Les algues vivent dans l'eau : algues vertes, brunes, rouges."]],
wx:[["Une plante a des fleurs et ses graines sont dans un fruit. Dans quel groupe la placer ?",["Elle a des fleurs : c'est une plante à fleurs.","Ses graines sont enfermées dans un fruit.","C'est une angiosperme."]]]},

/*13*/{t:"La classification des animaux",
k:["Les <b>vertébrés</b> ont un squelette interne avec une colonne vertébrale.","Cinq classes de vertébrés : <b>poissons</b> (écailles, nageoires), <b>amphibiens</b> (peau nue humide), <b>reptiles</b> (écailles sèches), <b>oiseaux</b> (plumes), <b>mammifères</b> (poils, mamelles).","Les <b>invertébrés</b> n'ont pas de colonne vertébrale.","Les <b>arthropodes</b> ont des pattes articulées : <b>insectes</b> (6 pattes), <b>arachnides</b> (8 pattes), crustacés, myriapodes.","Les <b>mollusques</b> ont un corps mou, souvent avec une coquille (escargot). Les <b>annélides</b> ont un corps en anneaux (ver de terre).","Les groupes se définissent par des <b>caractères partagés</b>."],
w:[["vertébrés","فقريات"],["invertébrés","لافقريات"],["mammifères","ثدييات"],["arthropodes","مفصليات الأرجل"],["mollusques","رخويات"],["insecte","حشرة"],["arachnide","عنكبيات"]],
x:[["q","L'araignée a combien de pattes ?",["8","6","10","4"],0,"C'est un arachnide."],
["q","Un animal à poils qui allaite ses petits est :",["un mammifère","un oiseau","un reptile"],0,"Poils et mamelles."],
["q","L'escargot est :",["un mollusque","un insecte","un vertébré"],0,"Corps mou et coquille."],
["vf","La chauve-souris est un oiseau car elle vole.",false,"Elle a des poils et allaite : c'est un mammifère."],
["m","Relie chaque animal à sa classe.",[["grenouille","amphibien"],["lézard","reptile"],["sardine","poisson"]],"Regarde la peau et le mode de vie."]],
d:[["Les vertébrés","Les poissons respirent par des branchies et ont des nageoires. Les amphibiens (grenouille) vivent entre l'eau et la terre, avec une peau nue. Les reptiles (tortue, serpent) ont des écailles sèches. Les oiseaux ont des plumes et un bec. Les mammifères ont des poils et nourrissent leurs petits avec du lait."],
["Les arthropodes","C'est le groupe qui compte le plus d'espèces. Leur corps est couvert d'une carapace et leurs pattes sont articulées. Insectes : 3 parties (tête, thorax, abdomen), 6 pattes, souvent des ailes. Arachnides : 8 pattes, pas d'antennes. Crustacés (crabe) : carapace dure, deux paires d'antennes."],
["Les pièges de la classification","On ne classe pas selon le mode de vie : la baleine vit dans l'eau mais c'est un mammifère, la chauve-souris vole mais c'est un mammifère, le manchot ne vole pas mais c'est un oiseau."]],
wx:[["Classe le scorpion.",["Il n'a pas de colonne vertébrale : invertébré.","Il a des pattes articulées : arthropode.","Il a 8 pattes : arachnide."]]]},

/*14*/{t:"Les équilibres naturels",
k:["Dans un milieu naturel, les êtres vivants et leur environnement forment un <b>équilibre</b>.","Cet équilibre peut être rompu par des causes <b>naturelles</b> (sécheresse, inondations) ou <b>humaines</b>.","Actions humaines néfastes : <b>pollution</b>, <b>déforestation</b>, <b>surpâturage</b>, incendies, chasse excessive, urbanisation.","Conséquences : disparition d'espèces, désertification, érosion des sols.","Protection : <b>parcs nationaux</b> et réserves (Toubkal, Souss-Massa), <b>reboisement</b>, lois contre la chasse, tri des déchets.","Chacun peut agir : ne pas jeter de déchets, économiser l'eau, respecter les animaux."],
w:[["équilibre naturel","التوازن الطبيعي"],["déforestation","اجتثاث الغابات"],["surpâturage","الرعي الجائر"],["reboisement","التشجير"],["désertification","التصحر"],["parc national","منتزه وطني"]],
x:[["q","Le surpâturage, c'est :",["trop d'animaux qui broutent au même endroit","planter des arbres","chasser les loups"],0,"La végétation n'a pas le temps de repousser."],
["q","Pour lutter contre la déforestation, on fait :",["du reboisement","des incendies","plus de routes"],0,"Planter des arbres."],
["vf","La disparition d'un prédateur peut déséquilibrer un milieu.",true,"Ses proies se multiplient trop."],
["m","Relie chaque cause à sa conséquence.",[["déforestation","érosion des sols"],["pollution de l'eau","mort des poissons"],["chasse excessive","disparition d'espèces"]],"Causes et conséquences."]],
d:[["Un équilibre fragile","Dans une forêt, les arbres, les herbivores, les carnivores et les décomposeurs sont liés. Le nombre de chaque espèce varie peu d'une année à l'autre : c'est l'équilibre naturel. Si un élément change beaucoup, tout le reste est touché."],
["L'action de l'Homme","Couper trop d'arbres expose le sol au vent et à la pluie : il s'érode et le désert avance. Les déchets plastiques tuent les tortues et les oiseaux marins. Les pesticides tuent aussi les abeilles utiles. Au Maroc, la forêt d'arganiers et le cèdre de l'Atlas sont menacés."],
["Protéger la nature","Le Maroc a créé des parcs nationaux et des réserves où la nature est protégée. On replante des arbres, on organise le pâturage, on interdit la chasse de certaines espèces (magot de l'Atlas, ibis chauve). À l'école et à la maison, on trie et on réduit les déchets."]],
wx:[["Dans une forêt, on tue tous les renards. Que se passe-t-il ?",["Les lapins ne sont plus mangés : leur nombre augmente beaucoup.","Ils mangent toute l'herbe et les jeunes pousses.","La végétation recule et le sol s'érode : l'équilibre est rompu."]]]},

/*15*/{s:"Unité 2 — Ch. 1 : Préparation et exploitation d'une sortie géologique",t:"La carte topographique et la sortie géologique",
k:["Une <b>carte topographique</b> représente le relief d'une région vu d'en haut, à une certaine <b>échelle</b>.","Le relief est représenté par des <b>courbes de niveau</b> : lignes qui relient les points de même <b>altitude</b>.","L'<b>équidistance</b> est la différence d'altitude entre deux courbes voisines.","Courbes <b>serrées</b> : pente forte. Courbes <b>espacées</b> : pente faible.","Le <b>profil topographique</b> est une coupe du relief le long d'une ligne.","Pendant une sortie géologique : boussole, marteau, loupe, carnet, sachets, flacon d'acide chlorhydrique dilué."],
w:[["carte topographique","خريطة طبوغرافية"],["courbe de niveau","منحنى المستوى"],["équidistance","تساوي البعد"],["altitude","ارتفاع"],["profil topographique","مقطع طبوغرافي"],["boussole","بوصلة"]],
x:[["q","Des courbes de niveau très serrées indiquent :",["une pente forte","une plaine","une rivière"],0,"L'altitude change vite."],
["q","Échelle `1/50 000` : 2 cm sur la carte représentent :",["1 km","100 m","50 km"],0,"`2×50 000=100 000 cm=1 km`."],
["vf","Une courbe de niveau relie des points de même altitude.",true,"Définition."],
["q","Courbes de niveau 200 m, 220 m, 240 m. L'équidistance :",["20 m","200 m","240 m"],0,"`220−200=20`."]],
d:[["Lire une carte topographique","La carte donne l'orientation (nord en haut), l'échelle, la légende (routes, rivières, villages) et les courbes de niveau. Certaines courbes portent leur altitude. Les sommets sont représentés par des courbes fermées emboîtées."],
["Réaliser un profil","On trace un segment sur la carte. On pose une bande de papier le long, et on marque chaque point où une courbe coupe le segment, avec son altitude. On reporte ces points sur un graphique (distance horizontale, altitude verticale) et on les relie par une ligne régulière."],
["La sortie géologique","On observe les paysages, les affleurements de roches, on prend des échantillons étiquetés. On note la position avec la boussole et la carte. On teste les roches à l'acide : une effervescence indique du calcaire. On respecte la sécurité : pas de falaises, toujours en groupe."]],
wx:[["Sur une carte au `1/25 000`, deux villages sont à 8 cm. Distance réelle ?",["`8×25 000=200 000 cm`.","`200 000 cm=2000 m`.","Distance réelle : `2 km`."]]]},

/*16*/{s:"Ch. 2 : Formation des roches sédimentaires",t:"L'action de l'érosion sur les paysages",
k:["L'<b>érosion</b> est l'usure et la destruction des roches à la surface de la Terre.","Les agents de l'érosion : l'<b>eau</b> (pluie, rivières, vagues), le <b>vent</b>, les <b>variations de température</b> (gel/dégel), les êtres vivants.","L'<b>altération mécanique</b> fragmente la roche (gel qui fait éclater les fissures, racines).","L'<b>altération chimique</b> transforme la roche : l'eau de pluie légèrement acide dissout le calcaire.","L'érosion façonne les paysages : vallées, gorges, falaises, champignons de roche, dunes.","Les débris formés (blocs, galets, sable, argile) sont des <b>sédiments</b>."],
w:[["érosion","التعرية"],["altération","التجوية"],["sédiments","رواسب"],["agent d'érosion","عامل التعرية"],["gel","التجمد"]],
x:[["q","Un agent d'érosion est :",["le vent","le noyau de la Terre","un volcan"],0,"Agents externes : eau, vent, température."],
["q","L'eau de pluie dissout surtout :",["le calcaire","le granite","le fer"],0,"Altération chimique."],
["vf","Le gel peut faire éclater les roches.",true,"L'eau gelée augmente de volume dans les fissures."],
["m","Relie.",[["altération mécanique","fragmenter la roche"],["altération chimique","dissoudre la roche"],["sédiments","débris de roches"]],"Revois les définitions."]],
d:[["Les agents de l'érosion","La pluie ruisselle et arrache les particules du sol. Les rivières creusent leur lit et forment des vallées. Les vagues attaquent les falaises. Le vent transporte le sable qui use les roches. Dans les montagnes, l'eau gèle la nuit dans les fissures et fait éclater les roches."],
["Mécanique et chimique","L'altération mécanique ne change pas la nature de la roche, elle la casse en morceaux. L'altération chimique change sa composition : le calcaire est dissous par l'eau chargée de dioxyde de carbone, ce qui forme des grottes. Le granite s'altère en sable (arène granitique)."],
["Facteurs aggravants","Un sol nu, sans végétation, s'érode beaucoup plus vite : les racines retiennent la terre. La déforestation et le surpâturage augmentent l'érosion. Les fortes pentes et les pluies violentes l'accélèrent."]],
wx:[["Pourquoi plante-t-on des arbres sur les pentes des montagnes ?",["Sur une pente nue, la pluie emporte facilement la terre.","Les racines des arbres retiennent le sol.","Le reboisement réduit donc l'érosion."]]]},

/*17*/{t:"Le transport et la sédimentation",
k:["Les sédiments sont <b>transportés</b> par l'eau, le vent et les glaciers.","Plus le courant est <b>rapide</b>, plus il transporte de gros éléments.","Pendant le transport, les débris s'<b>usent</b> et s'arrondissent : ils deviennent des <b>galets</b>.","Quand la vitesse diminue, les sédiments se <b>déposent</b> : c'est la <b>sédimentation</b>. Les plus gros se déposent en premier.","Les dépôts forment des couches horizontales superposées : les <b>strates</b>.","La sédimentation se fait dans les lacs, les deltas, les mers et les océans (milieux de sédimentation)."],
w:[["transport","النقل"],["sédimentation","الترسيب"],["strate","طبقة"],["galet","حصى"],["delta","دلتا"],["granoclassement","التصنيف الحبيبي"]],
x:[["q","Quand la vitesse de l'eau diminue, les sédiments :",["se déposent","remontent","disparaissent"],0,"C'est la sédimentation."],
["q","Les éléments qui se déposent en premier sont :",["les plus gros","les plus fins"],0,"Ils sont les plus lourds."],
["vf","Les galets sont arrondis à cause de l'usure pendant le transport.",true,"Ils se frottent et s'usent."],
["o","Range de l'amont vers la mer (dépôts d'une rivière).",["blocs","galets","sable","argile"],"Des plus gros aux plus fins."]],
d:[["Le transport","Un torrent de montagne rapide roule de gros blocs. Une rivière de plaine plus lente ne transporte que du sable et de la boue. Le vent transporte seulement le sable et les poussières, parfois très loin (poussières du Sahara)."],
["L'expérience de la sédimentation","On met dans une bouteille d'eau un mélange de gravier, sable et argile, on agite puis on laisse reposer. Le gravier se dépose d'abord, puis le sable, puis l'argile : on obtient des couches triées par taille. L'eau s'éclaircit peu à peu."],
["Les strates","Dans la mer, les sédiments s'accumulent en couches horizontales, les plus anciennes en bas. Chaque couche correspond à une période de dépôt. On observe ces strates dans les falaises et les tranchées de routes."]],
wx:[["Pourquoi trouve-t-on du sable fin à l'embouchure d'une rivière et des galets près de sa source ?",["Près de la source, le courant est rapide : seuls les gros galets se déposent.","Vers l'embouchure, le courant ralentit.","Les éléments fins comme le sable se déposent alors."]]]},

/*18*/{t:"La diagenèse et la classification des roches sédimentaires",
k:["La <b>diagenèse</b> transforme les sédiments meubles en roche dure (consolidée).","Étapes : <b>tassement</b> (compaction) sous le poids des couches, perte d'eau, puis <b>cimentation</b> des grains.","Exemples : sable → <b>grès</b> ; galets → <b>conglomérat</b> ; argile → argilite ; boue calcaire → <b>calcaire</b>.","Roches <b>détritiques</b> : faites de débris (sable, grès, argile, conglomérat).","Roches d'origine <b>chimique ou biochimique</b> : calcaire, sel gemme, gypse ; d'origine organique : charbon, pétrole.","Test du calcaire : une goutte d'<b>acide chlorhydrique</b> dilué provoque une <b>effervescence</b>."],
w:[["diagenèse","التصخر"],["grès","الحث"],["calcaire","الكلس"],["argile","الطين"],["roche détritique","صخرة فتاتية"],["effervescence","فوران"]],
x:[["q","Le sable consolidé donne :",["le grès","le calcaire","le granite"],0,"Diagenèse du sable."],
["q","Une roche qui fait effervescence avec l'acide est :",["le calcaire","l'argile","le grès"],0,"Test du calcaire."],
["o","Range les étapes de la diagenèse.",["dépôt des sédiments","tassement","perte d'eau","cimentation"],"Du sédiment meuble à la roche dure."],
["vf","Le sable est une roche meuble.",true,"Ses grains ne sont pas soudés."],
["m","Relie la roche à son groupe.",[["grès","détritique"],["sel gemme","chimique"],["charbon","organique"]],"Revois la classification."]],
d:[["De la boue à la roche","Au fond de la mer, les couches s'empilent. Le poids des couches supérieures tasse les sédiments du dessous et chasse l'eau. Des sels dissous précipitent entre les grains et les collent comme du ciment. Après des millions d'années, le sable est devenu grès."],
["Classer les roches sédimentaires","On observe la roche : est-elle meuble ou consolidée ? Voit-on des grains ? Fait-elle effervescence ? Raye-t-elle le verre ? Les roches détritiques sont faites de grains (sable : grains libres, grès : grains soudés). Les calcaires réagissent à l'acide. L'argile est douce, se raye à l'ongle et devient plastique avec de l'eau."],
["Les roches utiles","Le calcaire sert à faire le ciment et la chaux. L'argile sert à la poterie et aux briques. Le phosphate marocain, roche sédimentaire, sert d'engrais. Le sel gemme est extrait de mines."]],
wx:[["Une roche faite de grains de sable soudés ne réagit pas à l'acide. Identifie-la.",["Les grains de sable soudés : roche détritique consolidée.","Pas d'effervescence : ce n'est pas du calcaire.","C'est un grès."]]]},

/*19*/{s:"Ch. 3 : Fossiles, fossilisation et échelle stratigraphique",t:"Les fossiles et leur intérêt géologique",
k:["Un <b>fossile</b> est un reste ou une trace d'un être vivant ancien conservé dans une roche.","La <b>fossilisation</b> se fait surtout dans les roches sédimentaires : l'être vivant est vite recouvert de sédiments, à l'abri de l'air.","Les parties dures (coquilles, os, dents) se fossilisent mieux.","Un fossile renseigne sur le <b>milieu de vie ancien</b> (paléoenvironnement) : un fossile de corail indique une mer chaude et peu profonde.","Les <b>fossiles stratigraphiques</b> ont vécu peu de temps et sur une grande surface : ils permettent de <b>dater</b> les couches.","Exemples : trilobites (ère primaire), ammonites (ère secondaire)."],
w:[["fossile","مستحاثة"],["fossilisation","التحجر"],["fossile stratigraphique","مستحاثة طبقية"],["ammonite","أمونيت"],["trilobite","ثلاثي الفصوص"],["paléoenvironnement","الوسط القديم"]],
x:[["q","Les fossiles se trouvent surtout dans les roches :",["sédimentaires","volcaniques","métamorphiques"],0,"Formées par dépôt de sédiments."],
["q","Un bon fossile stratigraphique a vécu :",["peu de temps sur une grande surface","longtemps dans un petit lac"],0,"Il permet de dater les couches."],
["vf","Un fossile de corail indique une mer chaude.",true,"Les coraux vivent dans les mers chaudes peu profondes."],
["q","Les ammonites caractérisent l'ère :",["secondaire","primaire","quaternaire"],0,"Elles ont disparu à la fin du secondaire."]],
d:[["Comment se forme un fossile ?","Un animal meurt au fond de la mer. Son corps mou est décomposé, mais sa coquille est vite recouverte de sédiments. Avec la diagenèse, la coquille est remplacée par des minéraux ou laisse son empreinte. Des millions d'années plus tard, l'érosion fait apparaître le fossile."],
["Reconstituer le passé","Les fossiles nous disent quels êtres vivaient autrefois et dans quel milieu. Des fossiles marins trouvés en montagne montrent que la région était sous la mer. Au Maroc, la région d'Erfoud est célèbre pour ses trilobites et ses ammonites."],
["Dater les roches","Deux couches qui contiennent le même fossile stratigraphique ont le même âge, même si elles sont loin l'une de l'autre. C'est la datation relative : on dit qu'une couche est plus vieille ou plus jeune qu'une autre."]],
wx:[["Dans deux régions éloignées, on trouve la même espèce d'ammonite. Que conclure ?",["Cette ammonite est un fossile stratigraphique.","Les deux couches qui la contiennent se sont formées à la même époque.","Elles ont donc le même âge."]]]},

/*20*/{t:"L'échelle stratigraphique et le cycle sédimentaire",
k:["<b>Principe de superposition</b> : une couche est plus récente que celle qu'elle recouvre.","<b>Principe de continuité</b> : une même couche a le même âge sur toute son étendue.","<b>Principe de recoupement</b> : un élément qui coupe une couche est plus récent qu'elle.","L'<b>échelle stratigraphique</b> divise l'histoire de la Terre en ères : <b>primaire</b>, <b>secondaire</b>, <b>tertiaire</b>, <b>quaternaire</b>.","Un <b>cycle sédimentaire</b> : la mer avance sur le continent (<b>transgression</b>), puis recule (<b>régression</b>).","Les sédiments changent avec la profondeur de la mer : grossiers près de la côte, fins au large."],
w:[["superposition","التراكب"],["continuité","الاستمرارية"],["recoupement","التقاطع"],["ère","حقبة"],["transgression","تقدم البحر"],["régression","تراجع البحر"]],
x:[["q","Selon le principe de superposition, la couche du bas est :",["la plus ancienne","la plus récente"],0,"Elle s'est déposée en premier."],
["o","Range les ères de la plus ancienne à la plus récente.",["primaire","secondaire","tertiaire","quaternaire"],"Dans l'ordre des numéros."],
["vf","Une faille qui coupe des couches est plus ancienne qu'elles.",false,"Principe de recoupement : elle est plus récente."],
["q","Quand la mer avance sur le continent, c'est :",["une transgression","une régression"],0,"Trans = au-delà."]],
d:[["Les principes de datation relative","On lit les couches comme les pages d'un livre empilé : la page du bas a été posée la première. Si une couche est cassée par une faille ou traversée par une roche volcanique, cet événement s'est produit après le dépôt de la couche."],
["L'échelle des temps géologiques","Les géologues ont découpé le passé de la Terre grâce aux fossiles et aux grands changements. Ère primaire : trilobites, premiers poissons. Ère secondaire : dinosaures et ammonites. Ère tertiaire : développement des mammifères. Ère quaternaire : apparition de l'Homme."],
["Le cycle sédimentaire","Quand la mer avance, des sédiments marins se déposent sur d'anciens sédiments continentaux. Quand elle recule, ce sont des sédiments de plus en plus côtiers. Une série complète transgression puis régression forme un cycle sédimentaire."]],
wx:[["Trois couches A (en bas), B, C (en haut) sont coupées par une faille F qui ne touche pas C. Range A, B, C, F.",["Superposition : A, puis B, puis C.","F coupe A et B : elle est plus récente qu'elles.","F ne touche pas C : C s'est déposée après. Ordre : A, B, F, C."]]]},

/*21*/{s:"Ch. 4 : Les ressources en eau",t:"Les ressources en eau et leur protection",
k:["Un <b>bassin hydrographique</b> (versant) est la région dont toutes les eaux coulent vers la même rivière.","Les <b>eaux de surface</b> : rivières (oueds), lacs, barrages. Les <b>eaux souterraines</b> : les <b>nappes phréatiques</b>.","Une nappe se forme dans une roche <b>perméable</b> (sable, grès) au-dessus d'une roche <b>imperméable</b> (argile).","On exploite les nappes par des <b>puits</b> et des <b>forages</b> ; l'eau sort naturellement par les <b>sources</b>.","Dangers : <b>pollution</b> (déchets, engrais, eaux usées), <b>surexploitation</b>, sécheresse.","Protection : traitement des eaux usées, économie de l'eau, irrigation goutte à goutte, construction de barrages."],
w:[["bassin hydrographique","حوض مائي"],["nappe phréatique","فرشة مائية"],["perméable","نفوذ"],["imperméable","كتيم"],["source","عين"],["forage","ثقب"],["surexploitation","الاستغلال المفرط"]],
x:[["q","Une nappe d'eau souterraine se forme dans une roche :",["perméable","imperméable"],0,"L'eau s'infiltre entre les grains."],
["q","L'argile est :",["imperméable","perméable"],0,"Elle retient l'eau."],
["vf","Les engrais en excès peuvent polluer les nappes.",true,"Ils s'infiltrent avec l'eau de pluie."],
["q","L'irrigation qui économise le plus l'eau :",["le goutte à goutte","l'inondation des champs"],0,"L'eau va directement aux racines."],
["m","Relie.",[["oued","eau de surface"],["nappe phréatique","eau souterraine"],["surexploitation","pomper trop d'eau"]],"Revois le cours."]],
d:[["Le bassin hydrographique","Quand il pleut sur une montagne, l'eau ruisselle vers les ruisseaux qui se rejoignent dans une rivière principale. Toute la zone qui alimente cette rivière est son bassin (bassin du Sebou, de l'Oum Er-Rbia). Les lignes de crête séparent les bassins voisins."],
["Les eaux souterraines","Une partie de la pluie s'infiltre dans le sol. Elle descend à travers les roches perméables jusqu'à une couche imperméable, où elle s'accumule : c'est la nappe. Le niveau de la nappe monte après les pluies et baisse quand on pompe trop ou pendant la sécheresse."],
["Protéger l'eau","Au Maroc, l'eau est rare et irrégulière. Il faut éviter de jeter des déchets dans les oueds, traiter les eaux usées, utiliser moins d'engrais, et économiser l'eau à la maison et dans l'agriculture (goutte à goutte). Pomper trop dans les nappes côtières y fait entrer l'eau salée de la mer."]],
wx:[["Pourquoi un puits creusé dans l'argile ne donne pas d'eau ?",["L'argile est imperméable : l'eau ne la traverse pas.","L'eau ne peut pas s'y accumuler ni couler vers le puits.","Il faut creuser jusqu'à une couche perméable qui contient une nappe."]]]}
]});

/*0*/{s:"التاريخ — المحور 1: نماذج من الحضارات القديمة",t:"حضارة بلاد الرافدين",
k:["بلاد الرافدين هي الأرض الواقعة بين نهري <b>دجلة والفرات</b> (العراق حاليا)، وتسمى أيضا «ميزوبوتاميا».","تعاقبت على حكمها دول: <b>السومريون</b>، ثم الأكاديون، ثم <b>البابليون</b>، ثم الآشوريون.","ابتكر السومريون <b>الكتابة المسمارية</b> حوالي <b>3200 ق.م</b>، على ألواح من الطين بقلم من القصب.","وضع الملك البابلي <b>حمورابي</b> قانونا مكتوبا حوالي <b>1750 ق.م</b>، يضم 282 مادة، ويقوم على مبدأ <b>القصاص</b>.","اعتمد السكان على <b>الزراعة</b> بفضل مياه النهرين وقنوات الري.","من آثارهم المعمارية <b>الزقورات</b>: معابد مدرجة على شكل طوابق."],
w:[["بلاد الرافدين","الأرض بين دجلة والفرات"],["الكتابة المسمارية","كتابة على شكل مسامير على الطين"],["قانون حمورابي","أقدم قانون مكتوب كامل تقريبا"],["القصاص","معاقبة الجاني بمثل ما فعل"],["الزقورة","معبد مدرج في بلاد الرافدين"]],
x:[["q","تقع بلاد الرافدين بين نهري:",["دجلة والفرات","النيل والفرات","سبو وملوية"],0,"العراق حاليا."],
["q","ابتكر الكتابة المسمارية:",["السومريون","المصريون","الإغريق"],0,"حوالي 3200 ق.م."],
["q","صاحب أشهر قانون مكتوب في بلاد الرافدين:",["حمورابي","الفرعون مينا","بريكليس"],0,"ملك بابلي."],
["vf","كتب أهل الرافدين على ورق البردي.",false,"كتبوا على ألواح من الطين."],
["o","رتب الدول حسب تعاقبها.",["السومريون","الأكاديون","البابليون","الآشوريون"],"من الأقدم إلى الأحدث."]],
d:[["الموطن والظروف الطبيعية","بلاد الرافدين سهل خصب يسقيه نهرا دجلة والفرات. فيضانات النهرين تحمل الطمي الخصب، فحفر السكان القنوات لتنظيم الري، وزرعوا الحبوب والنخيل. هذه الظروف شجعت على الاستقرار وبناء المدن مثل أور وبابل ونينوى."],
["الكتابة المسمارية","احتاج السومريون إلى تسجيل المحاصيل والضرائب والتجارة، فابتكروا الكتابة. كانوا يضغطون بقلم من القصب على ألواح الطين الطري، فتظهر علامات تشبه المسامير، ثم يجففون الألواح. بفضل الكتابة انتقلت البشرية من «ما قبل التاريخ» إلى «التاريخ»."],
["قانون حمورابي","نقش حمورابي قوانينه على مسلة حجرية كبيرة ليعرفها الجميع. تنظم هذه القوانين الزواج والتجارة والزراعة والعقوبات. تعتمد مبدأ «العين بالعين والسن بالسن»، لكن العقوبة كانت تختلف حسب الطبقة الاجتماعية."]],
wx:[["لماذا تعتبر الكتابة المسمارية حدثا مهما؟",["سمحت بتسجيل القوانين والتجارة والأحداث.","بها بدأت الفترة التاريخية، لأننا نعرف الماضي من الوثائق المكتوبة.","انتقلت إلى شعوب أخرى وأثرت في تطور الكتابة."]]]},

/*1*/{t:"حضارة مصر القديمة",
k:["قامت الحضارة المصرية على ضفاف <b>نهر النيل</b>، لذلك قيل: «مصر هبة النيل».","وحد الملك <b>مينا</b> مصر العليا ومصر السفلى حوالي <b>3200 ق.م</b>.","مرت الحضارة المصرية بثلاث مراحل: <b>الدولة القديمة</b> (عصر الأهرام)، الدولة الوسطى، <b>الدولة الحديثة</b>.","كان <b>الفرعون</b> يملك كل السلطات، ويعتبر إلها أو ابنا للإله.","كتب المصريون بـ<b>الهيروغليفية</b> على ورق <b>البردي</b> والجدران.","اعتمدت <b>الفلاحة</b> على فيضان النيل، واستعمل الفلاح <b>الشادوف</b> لرفع الماء. بنى المصريون <b>الأهرام</b> قبورا للفراعنة، مثل هرم خوفو."],
w:[["الفرعون","ملك مصر القديمة"],["الهيروغليفية","الكتابة المصرية القديمة بالرموز"],["البردي","نبات صنع منه المصريون الورق"],["الشادوف","آلة لرفع الماء من النهر"],["التحنيط","حفظ جثث الموتى من التحلل"]],
x:[["q","وحد مصر حوالي 3200 ق.م:",["مينا","حمورابي","خوفو"],0,"وحد مصر العليا والسفلى."],
["q","قيل «مصر هبة النيل» لأن:",["الحياة والفلاحة قامت على مياه النيل","النيل يمر في وسط القاهرة الحديثة"],0,"الفيضان يجلب الماء والطمي."],
["q","الكتابة المصرية القديمة هي:",["الهيروغليفية","المسمارية","الأبجدية الفينيقية"],0,"رموز وصور."],
["vf","الأهرام قبور للفراعنة.",true,"بنيت لحفظ جثث الفراعنة المحنطة."],
["m","اربط.",[["الشادوف","رفع الماء"],["البردي","صناعة الورق"],["التحنيط","حفظ الجثث"]],"راجع الكلمات."]],
d:[["النيل والفلاحة","يفيض النيل كل صيف فيغمر الأراضي ويترك طميا خصبا. بعد انحسار الماء يزرع الفلاحون القمح والشعير والكتان. نظم المصريون الري بالقنوات والسدود الصغيرة، واستعملوا الشادوف، وابتكروا تقويما شمسيا لمعرفة موعد الفيضان."],
["المجتمع المصري","على رأس المجتمع الفرعون، ثم الكهنة وكبار الموظفين (الوزير، الكتبة)، ثم الحرفيون والتجار، وفي القاعدة الفلاحون الذين يشكلون الأغلبية، وأخيرا العبيد. كان الفلاحون يدفعون الضرائب ويشاركون في الأشغال الكبرى."],
["الأهرام","تطورت القبور من «المصطبة» البسيطة إلى الهرم المدرج (هرم زوسر)، ثم إلى الهرم الكامل مثل هرم خوفو بالجيزة، أحد عجائب الدنيا السبع. بناؤه تطلب آلاف العمال وتنظيما دقيقا."]],
wx:[["رتب المجتمع المصري من الأعلى إلى الأسفل.",["الفرعون في القمة.","ثم الكهنة وكبار الموظفين.","ثم الحرفيون والتجار، ثم الفلاحون، وأخيرا العبيد."]]]},

/*2*/{t:"الحضارة الإغريقية",
k:["قامت الحضارة الإغريقية في <b>بلاد اليونان</b> وجزر بحر إيجة، وهي منطقة جبلية.","كانت مقسمة إلى <b>مدن-دول</b> مستقلة، أشهرها <b>أثينا</b> و<b>أسبرطة</b>.","<b>أسبرطة</b>: نظام عسكري، يحكمها ملكان ومجلس الشيوخ، ويتربى الأطفال على الحرب منذ سن السابعة.","<b>أثينا</b>: مهد <b>الديمقراطية</b>، يشارك المواطنون في «جمعية الشعب»، ومن أشهر قادتها بريكليس.","المواطنة في أثينا كانت محصورة في <b>الذكور الأحرار</b> من أب وأم أثينيين؛ أما النساء والعبيد والأجانب فلم يكونوا مواطنين.","نظم الإغريق <b>الألعاب الأولمبية</b> في مدينة أولمبيا منذ <b>776 ق.م</b> تكريما للإله زيوس."],
w:[["المدينة-الدولة","مدينة مستقلة لها حكومتها وجيشها"],["الديمقراطية","حكم الشعب"],["أسبرطة","مدينة إغريقية ذات نظام عسكري"],["أثينا","مدينة إغريقية مهد الديمقراطية"],["الألعاب الأولمبية","مسابقات رياضية في أولمبيا"]],
x:[["q","مهد الديمقراطية:",["أثينا","أسبرطة","بابل"],0,"جمعية الشعب."],
["q","بدأت الألعاب الأولمبية سنة:",["776 ق.م","1750 ق.م","622 م"],0,"في أولمبيا."],
["vf","كانت النساء مواطنات في أثينا.",false,"المواطنة للذكور الأحرار الأثينيين فقط."],
["m","اربط.",[["أسبرطة","نظام عسكري"],["أثينا","الديمقراطية"],["أولمبيا","الألعاب الرياضية"]],"راجع الملخص."],
["q","كان الطفل الأسبرطي يبدأ التدريب العسكري في سن:",["السابعة","العشرين","الأربعين"],0,"تتكفل الدولة بتربيته."]],
d:[["بيئة جبلية ومدن مستقلة","تضاريس اليونان الجبلية فصلت السهول الصغيرة عن بعضها، فنشأت مدن مستقلة لكل منها حكومتها وجيشها وعملتها. لكن الإغريق كانت تجمعهم اللغة والديانة والألعاب الأولمبية. واتجهوا نحو البحر للتجارة وتأسيس المستعمرات."],
["أسبرطة وأثينا","في أسبرطة كان المجتمع مقسما إلى المواطنين المحاربين، وفئة حرة بدون حقوق سياسية، والعبيد الذين يزرعون الأرض. في أثينا تطورت الديمقراطية: المواطنون يجتمعون في جمعية الشعب ويصوتون على القوانين ويختارون المسؤولين بالقرعة أو بالانتخاب."],
["الألعاب الأولمبية","كانت تنظم كل أربع سنوات في أولمبيا، وتتوقف خلالها الحروب. من مسابقاتها الجري والمصارعة ورمي القرص وسباق العربات. يحصل الفائز على إكليل من أغصان الزيتون. أعيد إحياؤها في العصر الحديث سنة 1896."]],
wx:[["قارن بين نظام الحكم في أسبرطة وأثينا.",["أسبرطة: ملكان ومجلس شيوخ، والمجتمع منظم للحرب.","أثينا: الديمقراطية، المواطنون يقررون في جمعية الشعب.","في المدينتين، لم تكن الحقوق السياسية لكل السكان."]]]},

/*3*/{t:"المغرب القديم: الفينيقيون والقرطاجيون",
k:["<b>فينيقيا</b> منطقة على الساحل الشرقي للبحر المتوسط (لبنان حاليا). اشتهر الفينيقيون بالتجارة البحرية.","ابتكر الفينيقيون <b>الأبجدية</b> التي تطورت منها أبجديات كثيرة.","أسس الفينيقيون مدينة <b>قرطاج</b> (تونس حاليا) حسب الرواية سنة <b>814 ق.م</b>.","أنشأ الفينيقيون ثم القرطاجيون <b>مراكز تجارية</b> على سواحل المغرب: ليكسوس (قرب العرائش)، تينجيس (طنجة)، موكادور (الصويرة)…","قام القرطاجي <b>حنون</b> برحلة استكشافية على السواحل الأطلسية لإفريقيا.","من تأثيراتهم: صناعة <b>الأرجوان</b> (صباغة)، تمليح السمك، زراعة الكروم والزيتون، وانتشار الكتابة."],
w:[["الفينيقيون","شعب تجار بحريين من الشرق"],["قرطاج","مدينة أسسها الفينيقيون في تونس"],["المركز التجاري","مكان على الساحل لتبادل السلع"],["الأرجوان","صباغة حمراء ثمينة"],["الأبجدية","مجموعة حروف تمثل الأصوات"]],
x:[["q","ابتكر الأبجدية:",["الفينيقيون","السومريون","المصريون"],0,"حروف تمثل الأصوات."],
["q","أسست قرطاج حسب الرواية سنة:",["814 ق.م","776 ق.م","40 م"],0,"في تونس حاليا."],
["q","مركز تجاري فينيقي قرب العرائش:",["ليكسوس","وليلي","أولمبيا"],0,"على مصب وادي اللوكوس."],
["vf","جاء الفينيقيون إلى المغرب من أجل التجارة.",true,"أسسوا مراكز تجارية على الساحل."],
["m","اربط.",[["موكادور","الصويرة"],["تينجيس","طنجة"],["ليكسوس","العرائش"]],"الأسماء القديمة والحديثة."]],
d:[["أسباب وصول الفينيقيين","كانت فينيقيا ضيقة وفقيرة في الأراضي الزراعية، فاتجه سكانها إلى البحر. كانوا يبحثون عن المعادن (الذهب، الفضة، القصدير) والعاج وجلود الحيوانات، ويبيعون الأقمشة والأواني والزجاج. أسسوا على طول المتوسط مراكز لرسو السفن والتبادل."],
["القرطاجيون في المغرب","ورثت قرطاج نفوذ الفينيقيين في غرب المتوسط. ازدهرت المراكز التجارية المغربية، ونظم القرطاجيون رحلات بحرية مثل رحلة حنون نحو السواحل الأطلسية. كانت التجارة بالمقايضة مع السكان المحليين."],
["تأثيرات ما زالت حاضرة","تعلم سكان المغرب القديم من الفينيقيين والقرطاجيين تقنيات تمليح السمك وصناعة الصباغة والفخار، وغراسة الكروم والزيتون والتين. وما زالت بعض العادات الحرفية المغربية تحمل آثار تلك المرحلة."]],
wx:[["لماذا اختار الفينيقيون مواقع ساحلية لمراكزهم؟",["لأنهم تجار يتنقلون بالسفن.","المواقع الساحلية تسمح برسو السفن وحمايتها.","وتسهل التبادل مع السكان المحليين."]]]},

/*4*/{t:"المغرب القديم: الممالك الأمازيغية ومقاومة الرومان",
k:["عرف شمال إفريقيا ممالك أمازيغية: <b>موريطانيا</b> (المغرب) و<b>نوميديا</b> (الجزائر).","من ملوك موريطانيا: باكا، بوكوس، <b>يوبا الثاني</b> (حكم من 25 ق.م إلى 23 م) وكان عالما ومثقفا، ثم ابنه <b>بطليموس</b>.","من أشهر المدن: <b>وليلي</b> قرب مكناس.","سنة <b>40 م</b> قتل الإمبراطور الروماني كاليغولا الملك بطليموس، وضمت روما المغرب.","قاد <b>أيدمون</b> ثورة ضد الرومان دفاعا عن الاستقلال.","في نوميديا، قاوم <b>يوغرطة</b> الرومان، وكان ماسينيسا قد وحد نوميديا من قبل."],
w:[["موريطانيا الطنجية","المغرب في العهد الروماني"],["وليلي","مدينة أثرية قرب مكناس"],["يوبا الثاني","ملك موريطاني عالم ومثقف"],["أيدمون","قائد ثورة ضد الرومان"],["المقاومة","الدفاع عن الأرض ضد المحتل"]],
x:[["q","المملكة الأمازيغية في المغرب القديم:",["موريطانيا","نوميديا","قرطاج"],0,"نوميديا في الجزائر."],
["q","ضم الرومان المغرب سنة:",["40 م","814 ق.م","622 م"],0,"بعد قتل بطليموس."],

["vf","وليلي مدينة أثرية قرب مكناس.",true,"من أهم المواقع الأثرية في المغرب."],
["o","رتب الأحداث.",["حكم يوبا الثاني","حكم بطليموس","مقتل بطليموس وضم المغرب","ثورة أيدمون"],"من الأقدم إلى الأحدث."]],
d:[["الممالك الأمازيغية","استقر الأمازيغ في شمال إفريقيا منذ زمن بعيد، وأسسوا ممالك منظمة. كان الملوك يتعاملون مع القرطاجيين ثم مع الرومان، ويتحالفون أحيانا ويتصارعون أحيانا أخرى. يوبا الثاني كتب مؤلفات في التاريخ والجغرافيا والنباتات."],
["أسباب الاحتلال الروماني","أرادت روما السيطرة على كل حوض البحر المتوسط، والاستفادة من خيرات شمال إفريقيا: القمح والزيتون والحيوانات البرية للعروض. بعد مقتل بطليموس، قسمت روما المنطقة إلى ولايتين، منها موريطانيا الطنجية."],
["المقاومة ونتائجها","لم يقبل الأمازيغ الاحتلال، فثاروا مع أيدمون، ثم استمرت القبائل في المقاومة، خاصة في الجبال. لم يسيطر الرومان إلا على جزء من شمال المغرب. خلفوا مدنا وطرقا وآثارا مثل وليلي وليكسوس."]],
wx:[["لماذا ثار أيدمون ضد الرومان؟",["لأن روما قتلت الملك بطليموس.","ثم ضمت مملكة موريطانيا وأنهت استقلالها.","فقاد أيدمون الثورة دفاعا عن الأرض والاستقلال."]]]},

/*5*/{t:"الديانات في الحضارات القديمة بين التعدد والتوحيد",
k:["عبدت أغلب الشعوب القديمة <b>آلهة متعددة</b>: هذه ديانات <b>تعددية</b>.","في مصر: <b>آمون رع</b> إله الشمس، أوزيريس إله العالم الآخر. في الرافدين: مردوخ، عشتار. عند الإغريق: <b>زيوس</b> كبير الآلهة.","آمن المصريون بالحياة بعد الموت، لذلك <b>حنطوا</b> موتاهم.","حاول الفرعون <b>إخناتون</b> فرض عبادة إله واحد هو «آتون» (قرص الشمس)، لكن محاولته لم تستمر بعده.","جاءت الديانات السماوية بالتوحيد: <b>اليهودية</b> (موسى عليه السلام)، <b>المسيحية</b> (عيسى عليه السلام)، <b>الإسلام</b> (محمد ﷺ).","<b>التوحيد</b> هو الإيمان بإله واحد."],

d:[["ديانات تعددية","فسر الإنسان القديم الظواهر الطبيعية (الشمس، المطر، الفيضان، الموت) بوجود آلهة كثيرة، لكل منها مهمة. بنى لها المعابد وقدم لها القرابين، وكان للكهنة دور كبير في المجتمع."],
["الحياة بعد الموت في مصر","اعتقد المصريون أن الميت يحاسب أمام أوزيريس، وأن الروح تحتاج إلى الجسد، فحنطوا الموتى ووضعوا معهم الطعام والأدوات. لهذا بنوا القبور الكبيرة كالأهرام."],
["نحو التوحيد","كانت محاولة إخناتون فكرة جديدة لكنها فرضت بالقوة ولم تقنع الكهنة والناس، فعادوا بعد موته إلى التعدد. أما الديانات السماوية فقد دعت إلى عبادة الله الواحد، وانتشرت بفضل الرسل."]],
wx:[["ما الفرق بين التعدد والتوحيد؟",["التعدد: الإيمان بآلهة كثيرة، لكل منها دور.","التوحيد: الإيمان بإله واحد.","الديانات السماوية الثلاث ديانات توحيد."]]]},

/*6*/{s:"التاريخ — المحور 2: إشعاع الحضارة الإسلامية في العصر الوسيط",t:"نشأة الدولة الإسلامية",
k:["قبل الإسلام، كانت شبه الجزيرة العربية تعيش حياة قبلية، وأغلب سكانها يعبدون الأصنام، ومكة مركز تجاري وديني.","بعث النبي محمد ﷺ سنة <b>610 م</b> في مكة.","هاجر النبي ﷺ إلى المدينة (يثرب) سنة <b>622 م</b>، وأصبحت <b>الهجرة</b> بداية التقويم الهجري.","أسس النبي ﷺ الدولة في المدينة: بناء <b>المسجد</b>، <b>المؤاخاة</b> بين المهاجرين والأنصار، و<b>الصحيفة</b> التي نظمت العلاقات بين سكان المدينة.","فتح المسلمون مكة سنة <b>8 هـ / 630 م</b>.","توفي النبي ﷺ سنة <b>11 هـ / 632 م</b>، بعد أن توحدت أغلب الجزيرة العربية."],
w:[["البعثة","بداية نزول الوحي على النبي ﷺ"],["الهجرة","انتقال النبي ﷺ من مكة إلى المدينة"],["المؤاخاة","جعل المهاجر والأنصاري أخوين"],["الصحيفة","وثيقة نظمت العلاقات في المدينة"],["التقويم الهجري","تقويم قمري يبدأ من الهجرة"]],
x:[["q","بداية التقويم الهجري:",["الهجرة 622 م","البعثة 610 م","فتح مكة"],0,"اختارها عمر بن الخطاب."],

["o","رتب الأحداث.",["البعثة","الهجرة","فتح مكة","وفاة النبي ﷺ"],"610 ثم 622 ثم 630 ثم 632."],
["vf","التقويم الهجري تقويم قمري.",true,"يعتمد على دوران القمر، والسنة حوالي 354 يوما."],

d:[["الجزيرة العربية قبل الإسلام","كانت القبائل تعيش على الرعي والتجارة، وتتنقل بحثا عن الماء والكلأ. كانت مكة مدينة تجارية تمر بها القوافل بين اليمن والشام، وفيها الكعبة. انتشرت الحروب بين القبائل، والعصبية القبلية."],
["تأسيس الدولة في المدينة","بعد الهجرة، بنى النبي ﷺ المسجد ليكون مكانا للصلاة والاجتماع والحكم. آخى بين المهاجرين والأنصار لتقوية التضامن. وكتب الصحيفة التي حددت حقوق وواجبات المسلمين واليهود وغيرهم في المدينة، فكانت أشبه بدستور."],
["مقابلة التاريخين","السنة الهجرية قمرية (حوالي 354 يوما) والسنة الميلادية شمسية (365 يوما). لذلك تتقدم السنوات الهجرية أسرع. للتحويل التقريبي: م = هـ − (هـ ÷ 33) + 622. مثال: 1447 هـ ≈ 1447 − 44 + 622 = 2025 م."]],
wx:[["حول تقريبيا 100 هـ إلى التاريخ الميلادي.",["نقسم 100 على 33: النتيجة حوالي 3.","100 − 3 = 97.","97 + 622 = 719 م تقريبا."]]]},

k:["بعد وفاة النبي ﷺ، حكم المسلمين أربعة خلفاء سموا <b>الراشدين</b> (11–40 هـ / 632–661 م).","<b>أبو بكر الصديق</b> (11–13 هـ)، ثم <b>عمر بن الخطاب</b> (13–23 هـ)، ثم <b>عثمان بن عفان</b> (23–35 هـ)، ثم <b>علي بن أبي طالب</b> (35–40 هـ).","قام اختيار الخليفة على مبدأ <b>الشورى</b> والبيعة.","وقعت <b>الفتنة الكبرى</b> بعد مقتل عثمان، ومن أحداثها معركتا الجمل وصفين.","حقق المسلمون <b>فتوحات</b> كبرى: الشام، العراق، فارس، مصر.","نظم عمر بن الخطاب الدولة: <b>الدواوين</b>، والتقويم الهجري."],

d:[["الشورى والبيعة","لم يعين النبي ﷺ خليفة بعده، فاجتمع المسلمون في سقيفة بني ساعدة واختاروا أبا بكر. ورشح أبو بكر عمر، ووضع عمر ستة من الصحابة ليختاروا منهم الخليفة فاختاروا عثمان. ثم بويع علي. فكان الحكم قائما على الاختيار والبيعة، لا على الوراثة."],
["الفتوحات","انتشر الإسلام بسرعة: في عهد عمر فتحت الشام والعراق ومصر، وانهزمت الإمبراطورية الفارسية. ساهم في ذلك إيمان المسلمين وتنظيمهم، وضعف الإمبراطوريتين البيزنطية والفارسية."],
["الفتنة الكبرى","ظهرت معارضة في آخر عهد عثمان، وانتهت بمقتله. ثم اختلف المسلمون حول الثأر له، فوقعت معركة الجمل ثم صفين بين علي ومعاوية. بعد مقتل علي سنة 40 هـ، انتقلت الخلافة إلى معاوية."]],

/*8*/{t:"الخلافة الإسلامية الكبرى: الأمويون والعباسيون",
k:["<b>الدولة الأموية</b> (41–132 هـ / 661–750 م): أسسها <b>معاوية بن أبي سفيان</b>، وعاصمتها <b>دمشق</b>، وأصبح الحكم وراثيا.","<b>الدولة العباسية</b> (132–656 هـ / 750–1258 م): أسسها أبو العباس السفاح، وعاصمتها <b>بغداد</b>.","في عهد الأمويين فتح المغرب (عقبة بن نافع، موسى بن نصير)، وفتحت <b>الأندلس</b> سنة <b>92 هـ / 711 م</b> بقيادة <b>طارق بن زياد</b>.","تطورت مؤسسات الخلافة: الوزارة، الدواوين، الشرطة، القضاء، البريد.","بلغت الدولة الإسلامية أقصى اتساعها من الصين شرقا إلى الأندلس غربا.","سقطت بغداد على يد <b>المغول</b> سنة <b>656 هـ / 1258 م</b>."],
w:[["الدولة الأموية","خلافة عاصمتها دمشق"],["الدولة العباسية","خلافة عاصمتها بغداد"],["الحكم الوراثي","انتقال الحكم من الأب إلى الابن"],["الوزارة","منصب مساعد الخليفة في تسيير الدولة"],["الأندلس","شبه الجزيرة الإيبيرية تحت الحكم الإسلامي"]],

d:[["من الشورى إلى الوراثة","مع معاوية تحول الحكم إلى نظام وراثي داخل الأسرة الأموية. نظم الأمويون الدولة: عربوا الدواوين، وضربوا العملة الإسلامية، وأنشؤوا البريد. انتهت دولتهم سنة 750 م بثورة العباسيين، فهرب عبد الرحمن الداخل إلى الأندلس وأسس فيها إمارة أموية."],
["العصر العباسي","نقل العباسيون العاصمة إلى بغداد، التي أصبحت أكبر مدينة في العالم. ظهر منصب الوزير، وازدهرت التجارة والعلوم. ضعفت الدولة تدريجيا بسبب استقلال الأقاليم، إلى أن سقطت بغداد بيد المغول سنة 1258 م."],
["الفتوحات","وصل المسلمون شرقا إلى حدود الصين والهند، وغربا إلى المغرب والأندلس. فتح المغرب استغرق وقتا طويلا بسبب مقاومة القبائل، ثم دخل الأمازيغ في الإسلام وشاركوا في فتح الأندلس، ومنهم طارق بن زياد."]],
wx:[["رتب: فتح الأندلس، قيام الدولة العباسية، قيام الدولة الأموية، سقوط بغداد.",["قيام الدولة الأموية: 661 م.","فتح الأندلس: 711 م.","قيام الدولة العباسية: 750 م، ثم سقوط بغداد: 1258 م."]]]},

d:[["عوامل الازدهار","دعا الإسلام إلى طلب العلم والتفكر. شجع الخلفاء العلماء ومنحوهم الأموال. ترجمت كتب الإغريق والفرس والهنود إلى العربية. وانتشر الورق بعد أن تعلم المسلمون صناعته، فكثرت الكتب والمكتبات."],
["العلوم النقلية والعقلية","العلوم النقلية مرتبطة بالدين واللغة: التفسير، الحديث، الفقه، النحو. العلوم العقلية تعتمد على العقل والتجربة: الرياضيات، الطب، الفلك، الكيمياء، الجغرافيا. برع المسلمون في الصنفين."],
["المغرب والأندلس","كانت فاس وقرطبة ومراكش مراكز علمية كبرى. رسم الإدريسي خريطة للعالم في القرن 12 للملك روجر في صقلية. وكتب ابن خلدون «المقدمة» التي يعتبر بها مؤسسا لعلم الاجتماع، ودرس في فاس."]],
wx:[["لماذا كانت الترجمة مهمة لازدهار العلوم؟",["سمحت بالاطلاع على علوم الإغريق والفرس والهنود.","أضاف العلماء المسلمون إليها وصححوها وطوروها.","ثم انتقلت هذه المعارف إلى أوروبا."]]]},

/*10*/{t:"النظام الفيودالي في أوروبا في العصر الوسيط",
k:["يمتد <b>العصر الوسيط</b> في أوروبا من سقوط روما الغربية (<b>476 م</b>) إلى سقوط القسطنطينية (<b>1453 م</b>).","<b>النظام الفيودالي</b> (الإقطاعي): السيد يمنح أرضا (<b>الإقطاعة</b>) لتابعه مقابل الولاء والخدمة العسكرية.","انقسم المجتمع إلى ثلاث فئات: <b>رجال الدين</b> (يصلون)، <b>النبلاء والفرسان</b> (يحاربون)، <b>الفلاحون والأقنان</b> (يعملون).","<b>القن</b> فلاح مرتبط بالأرض، لا يستطيع مغادرتها، ويدفع الضرائب ويقوم بالأعمال المجانية (السخرة).","عاش السيد في <b>قصر محصن</b> يحمي سكان الإقطاعة.","كانت <b>الكنيسة</b> قوية جدا: تملك الأراضي وتجمع ضريبة العشر."],

d:[["نشأة النظام الفيودالي","بعد سقوط روما ضعفت السلطة المركزية، وانتشرت الحروب والغزوات. احتاج الناس إلى الحماية، فأصبح الأقوياء (السادة) يحمون الضعفاء مقابل خدمتهم. هكذا نشأت شبكة من العلاقات بين سيد وتابع."],
["العلاقة بين السيد والتابع","في حفل «التبعية»، يضع التابع يديه في يدي السيد ويقسم على الولاء، ويمنحه السيد الإقطاعة. التابع يقاتل مع السيد ويقدم له النصيحة، والسيد يحمي التابع."],
["حياة الفلاحين","كان الفلاحون يعيشون في قرى حول القصر، يزرعون أرض السيد مجانا أياما في الأسبوع، ويدفعون له جزءا من المحصول، ويدفعون العشر للكنيسة، ويستعملون فرن السيد وطاحونته مقابل رسوم."]],
wx:[["لماذا قبل الفلاحون هذا النظام؟",["كانت أوروبا تعيش حروبا وغزوات وعدم أمن.","السيد يوفر لهم الحماية داخل قصره المحصن.","مقابل ذلك كانوا يعملون ويدفعون الضرائب."]]]},

/*11*/{t:"الحروب الصليبية: المواجهة واحتكاك الحضارات",
k:["<b>الحروب الصليبية</b> حملات عسكرية قام بها المسيحيون الأوروبيون نحو الشرق الإسلامي بين <b>1096 و1291 م</b>.","دعا إليها البابا <b>أوربان الثاني</b> سنة <b>1095 م</b> بهدف السيطرة على <b>بيت المقدس</b>.","احتل الصليبيون <b>القدس</b> سنة <b>1099 م</b> وأسسوا إمارات في الشام.","انتصر <b>صلاح الدين الأيوبي</b> في <b>معركة حطين</b> سنة <b>583 هـ / 1187 م</b> واسترجع القدس.","انتهت الحروب بخروج الصليبيين من عكا سنة 1291 م.","نتج عنها <b>احتكاك حضاري</b>: نقل الأوروبيون منتجات ومعارف من الشرق (السكر، الورق، الأرقام العربية، علوم الطب)."],
w:[["الحروب الصليبية","حملات أوروبية نحو الشرق الإسلامي"],["معركة حطين","انتصار صلاح الدين سنة 1187 م"],["بيت المقدس","مدينة القدس"],["الاحتكاك الحضاري","تبادل التأثير بين حضارتين"]],
x:[["q","انتصر صلاح الدين في معركة:",["حطين","بلاط الشهداء","الزلاقة"],0,"سنة 1187 م."],
["q","دعا إلى الحروب الصليبية:",["البابا أوربان الثاني","الإمبراطور كاليغولا","الفرعون مينا"],0,"سنة 1095 م."],
["o","رتب الأحداث.",["دعوة البابا أوربان الثاني","احتلال القدس","معركة حطين","خروج الصليبيين من عكا"],"1095، 1099، 1187، 1291."],
["vf","من نتائج الحروب الصليبية تبادل المعارف بين الشرق والغرب.",true,"احتكاك حضاري."]],
d:[["الأسباب","أسباب دينية: السيطرة على الأماكن المقدسة في فلسطين. أسباب اقتصادية: البحث عن الثروات والأراضي، ومصالح المدن التجارية الإيطالية. أسباب اجتماعية: كثرة السكان في أوروبا ورغبة النبلاء الصغار في امتلاك أراض."],
["مراحل المواجهة","نجحت الحملة الأولى في احتلال القدس سنة 1099 م بسبب تفرق المسلمين. ثم بدأت مرحلة المقاومة مع عماد الدين زنكي ونور الدين محمود، وبلغت ذروتها مع صلاح الدين الذي وحد مصر والشام وانتصر في حطين. استمرت حملات أخرى دون نتيجة حاسمة حتى 1291 م."],
["الاحتكاك الحضاري","رغم الحرب، تعرف الأوروبيون على الحضارة الإسلامية المتقدمة. نقلوا منتجات جديدة (السكر، الأرز، التوابل، الأقمشة) وتقنيات ومعارف (الطب، الرياضيات، صناعة الورق)، مما ساهم في نهضة أوروبا لاحقا."]],
wx:[["لماذا تعتبر معركة حطين حاسمة؟",["انتصر فيها صلاح الدين على الصليبيين سنة 1187 م.","مهدت لاسترجاع القدس في نفس السنة.","وأضعفت الإمارات الصليبية في الشام."]]]},
