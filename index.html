<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f7a5c"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>دفتر الأولى إعدادي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Alegreya+Sans:wght@400;500;700&family=STIX+Two+Text:wght@400;600&display=swap">
<style>
/* Layout : cahier Seyès calme — une colonne, un écran = une tâche, grandes cibles tactiles, aucune animation surprise */
:root{
  --paper:#f5f7fa; --sheet:#ffffff; --ink:#1c2a44; --soft:#58647a;
  --rule:#cfdaee; --rule-v:#e6d9ec; --margin:#c8513f; --accent:#2350a8; --on-accent:#ffffff;
  --ok:#1b7348; --ok-bg:#e2f3e9; --no:#9a4a12; --no-bg:#fbefe3; --hint:#6b5a12; --hint-bg:#fbf5dc;
  --line:#dde4ef; --chip:#edf1f8;
  --c1:#2350a8; --c2:#c8513f; --c3:#1b8a6b; --c4:#d19a1c; --fill-a:#d9e4f8; --fill-s:#eef2f8; --sky:#d6ebfb; --earth:#4f8a5b; --water:#cfe6f5; --rock:#c9b79a; --crust:#a5927a; --mantle:#e8a35c; --core:#d9722e; --icore:#f2c94c; --magma:#e0592f;
  --f-disp:"Reem Kufi","Noto Naskh Arabic",system-ui,sans-serif;
  --f-ar:"Noto Naskh Arabic","Alegreya Sans",system-ui,sans-serif;
  --f-lat:"Alegreya Sans","Noto Naskh Arabic",system-ui,sans-serif;
  --f-math:"STIX Two Text","Cambria Math",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1625; --sheet:#151e30; --ink:#e4eaf5; --soft:#9ba8bf;
  --rule:#233250; --rule-v:#2c2742; --margin:#e07a66; --accent:#86a9ff; --on-accent:#0f1625;
  --ok:#78d6a6; --ok-bg:#16301f; --no:#f0a86b; --no-bg:#35240f; --hint:#e6cf72; --hint-bg:#302810;
  --line:#26324a; --chip:#1c2740;  --c1:#86a9ff; --c2:#e07a66; --c3:#56c49e; --c4:#e8c862; --fill-a:#22355e; --fill-s:#1a2438; --sky:#1d3550; --earth:#3f7a4d; --water:#1d3a52; --rock:#6b5d48; --crust:#5a4c3a; --mantle:#9a6232; --core:#a3521f; --icore:#b89130; --magma:#c24a26; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1625; --sheet:#151e30; --ink:#e4eaf5; --soft:#9ba8bf;
  --rule:#233250; --rule-v:#2c2742; --margin:#e07a66; --accent:#86a9ff; --on-accent:#0f1625;
  --ok:#78d6a6; --ok-bg:#16301f; --no:#f0a86b; --no-bg:#35240f; --hint:#e6cf72; --hint-bg:#302810;
  --line:#26324a; --chip:#1c2740;  --c1:#86a9ff; --c2:#e07a66; --c3:#56c49e; --c4:#e8c862; --fill-a:#22355e; --fill-s:#1a2438; --sky:#1d3550; --earth:#3f7a4d; --water:#1d3a52; --rock:#6b5d48; --crust:#5a4c3a; --mantle:#9a6232; --core:#a3521f; --icore:#b89130; --magma:#c24a26; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ar);font-size:var(--fs,18px);line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
:root[data-size="2"]{--fs:21px} :root[data-size="3"]{--fs:24px}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.lat{font-family:var(--f-lat)}
[dir="ltr"].content{font-family:var(--f-lat);line-height:1.65}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;flex:none;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:14px}
.brand h1{font-family:var(--f-disp);font-weight:700;font-size:1.05em;margin:0;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex:none}
.tbtn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;min-width:44px;height:40px;padding:0 10px;font-weight:700;font-size:15px;font-family:var(--f-lat)}

.nav{display:flex;gap:8px;margin-block:16px 6px;flex-wrap:wrap}
.nav button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:8px 18px;font-weight:600;min-height:44px}
.nav button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
h2{font-family:var(--f-disp);font-weight:700;font-size:1.35em;line-height:1.35;margin:18px 0 6px;text-wrap:balance}
h3{font-family:var(--f-disp);font-weight:500;font-size:.95em;color:var(--soft);margin:24px 0 8px;letter-spacing:.02em}
.lead{color:var(--soft);margin:0 0 14px}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:10px 0;margin-top:6px;min-height:44px}

/* subjects */
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.subj{text-align:start;border:1px solid var(--line);background:var(--sheet);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.subj .sym{font-family:var(--f-math);font-size:1.4em;line-height:1;color:var(--accent)}
.subj b{font-family:var(--f-disp);font-weight:700;line-height:1.35}
.subj span{font-size:.78em;color:var(--soft)}
.bar{height:6px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--accent)}

/* lesson list */
.lessons{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.lessons li{border-bottom:1px solid var(--line)}
.lessons button{width:100%;border:0;background:none;text-align:start;display:grid;grid-template-columns:2.1em 1fr;gap:2px 10px;padding:12px 2px;align-items:start;min-height:52px}
.num{font-family:var(--f-math);color:var(--margin);text-align:center;line-height:1.7}
.tt{font-weight:600;line-height:1.5;min-width:0}
.chips{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.72em;border-radius:999px;padding:1px 10px;background:var(--chip);color:var(--soft)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}

/* steps bar */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--chip);border-radius:14px;padding:4px;margin-block:10px 16px}
.steps button{border:0;background:none;border-radius:11px;padding:6px 2px;font-size:.8em;font-weight:600;line-height:1.3;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.steps button small{font-family:var(--f-math);font-size:.95em;color:var(--margin)}
.steps button[aria-selected="true"]{background:var(--sheet);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--accent)}

/* Seyès sheet */
.sheet{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:6px;
  background-image:linear-gradient(to bottom,transparent calc(100% - 1px),var(--rule) 0),linear-gradient(to right,transparent calc(100% - 1px),var(--rule-v) 0);
  background-size:100% 2em,2em 100%;padding:10px 16px 14px;padding-inline-start:44px;overflow:hidden}
.sheet::before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:30px;width:2px;background:var(--margin);opacity:.7}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:k}
.keys li{line-height:2;display:flex;gap:8px;align-items:flex-start}
.keys li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.keys b,.qtext b{color:var(--accent);font-weight:700}
.say{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;width:36px;height:36px;font-size:15px;line-height:1;display:grid;place-items:center;margin-top:2px}
.say svg{width:16px;height:16px}

.gloss{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gloss td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.gloss tr:last-child td{border-bottom:0}
.gloss td:first-child{font-weight:700;color:var(--accent)}
.gloss td.ar{font-family:var(--f-ar)}
.gloss td.la{font-family:var(--f-lat)}

/* exercise player */
.dots{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--chip);border:1.5px solid var(--line)}
.dot.cur{background:var(--accent);border-color:var(--accent)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dots span{font-size:.8em;color:var(--soft);margin-inline-start:6px;font-family:var(--f-lat)}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px}
.kind{font-size:.75em;color:var(--soft);font-weight:600;margin-bottom:4px}
.qrow{display:flex;gap:8px;align-items:flex-start}
.qtext{flex:1;min-width:0;font-weight:600;line-height:2;margin:0 0 12px;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px;min-height:52px;text-align:start;line-height:1.6;overflow-wrap:anywhere}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.tried{background:var(--no-bg);border-color:var(--no);color:var(--no);text-decoration:line-through;text-decoration-thickness:1px}
.opt[disabled]{cursor:default}
.vfrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vfrow .opt{text-align:center;font-weight:700}
/* order */
.slot{min-height:56px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--paper);margin-bottom:10px}
.slot:empty::before{content:attr(data-empty);color:var(--soft);font-size:.85em;padding-inline:6px}
.tok{border:1.5px solid var(--accent);background:var(--sheet);color:var(--ink);border-radius:10px;padding:6px 12px;min-height:44px;line-height:1.5;overflow-wrap:anywhere;max-width:100%;text-align:start}
.tok.placed{background:var(--chip)}
.tok.good{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.tok.bad{border-color:var(--no);background:var(--no-bg);color:var(--no)}
.pool{display:flex;flex-wrap:wrap;gap:6px}
/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mi{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 10px;min-height:52px;text-align:start;line-height:1.5;overflow-wrap:anywhere}
.mi.sel{border-color:var(--accent);background:var(--chip);box-shadow:0 0 0 1px var(--accent) inset}
.mi.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);cursor:default}
.mi.miss{border-color:var(--no);background:var(--no-bg)}
.mi .pair{display:inline-block;font-family:var(--f-math);font-size:.8em;margin-inline-end:6px;color:var(--ok)}

.feedback{margin-top:12px;border-radius:12px;padding:12px 14px;line-height:1.9}
.feedback.ok{background:var(--ok-bg);color:var(--ink);border-inline-start:4px solid var(--ok)}
.feedback.no{background:var(--no-bg);color:var(--ink);border-inline-start:4px solid var(--no)}
.feedback b{display:block}
.hint{margin-top:12px;background:var(--hint-bg);border-radius:12px;padding:12px 14px}
.hint h4{margin:0 0 4px;font-family:var(--f-disp);color:var(--hint);font-size:.9em}
.hint ol{margin:0;padding-inline-start:1.3em;line-height:1.9}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:8px 20px;font-weight:700;min-height:46px}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.help{background:var(--hint-bg);color:var(--hint);border:1.5px solid transparent}
.btn[disabled]{opacity:.45;cursor:default}
.end{text-align:center;padding:22px 16px}
.end .big{font-family:var(--f-math);font-size:2.4em;line-height:1.2;color:var(--accent)}
.end p{margin:6px 0 0}

.tip{background:var(--hint-bg);border-radius:14px;padding:14px 16px;line-height:1.9}
.tip h4{margin:0 0 4px;font-family:var(--f-disp);color:var(--hint);font-size:.95em}
.tip p{margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--f-math);font-size:1.4em;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:.72em;color:var(--soft)}
.ptable{width:100%;border-collapse:collapse;font-size:.88em}
.ptable td,.ptable th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start}
.ptable th{color:var(--soft);font-weight:600;font-size:.85em}
.ptable td.n{font-family:var(--f-math);font-variant-numeric:tabular-nums;white-space:nowrap}
.advice{margin:0;padding-inline-start:1.2em;display:flex;flex-direction:column;gap:8px}
.reset{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 16px;color:var(--soft);margin-top:18px;min-height:44px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.note{font-size:.8em;color:var(--soft);margin-top:22px}



/* figures */
.figw{margin:8px 0 12px;padding:10px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.figli{display:block!important}
.fig{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.figw figcaption{font-size:.82em;color:var(--soft);text-align:center;margin-top:6px;line-height:1.6}
.fig .l{stroke:var(--ink);stroke-width:1.6;fill:none;stroke-linejoin:round;stroke-linecap:round}
.fig .thin{stroke-width:1} .fig .thick{stroke-width:2.6} .fig .d{stroke-dasharray:5 4}
.fig .a{stroke:var(--accent)} .fig .m{stroke:var(--margin)} .fig .grid{stroke:var(--line);stroke-width:1}
.fig .fi{fill:var(--ink)} .fig .fa{fill:var(--accent)} .fig .fm{fill:var(--margin)}
.fig .fov{fill:var(--accent);opacity:.55} .fig .fs{fill:var(--fill-s)} .fig .fs2{fill:var(--chip)} .fig .fa2{fill:var(--fill-a)}
.fig .p1{fill:var(--c1)} .fig .p2{fill:var(--c2)} .fig .p3{fill:var(--c3)} .fig .p4{fill:var(--c4)} .fig .ls{stroke:var(--sheet);stroke-width:2}
.fig text{font-family:var(--f-lat);font-size:13px;fill:var(--ink)}
.fig .t.b{font-weight:700} .fig .t.s{font-size:11.5px} .fig .t.big{font-size:18px;font-weight:700}
.fig .t.a{fill:var(--accent)} .fig .t.m{fill:var(--margin)} .fig .t.inv{fill:#fff}
.fig .atO{fill:#d64541} .fig .atC{fill:#3a3f47} .fig .atN{fill:#3d6fd6} .fig .atH{fill:#ffffff}
.fig .sun{fill:#f6c343} .fig .sky{fill:var(--sky)} .fig .earth{fill:var(--earth)} .fig .water{fill:var(--water)}
.fig .rock{fill:var(--rock)} .fig .crust{fill:var(--crust)} .fig .ground{fill:var(--rock);opacity:.6} .fig .mantle{fill:var(--mantle)} .fig .core{fill:var(--core)} .fig .icore{fill:var(--icore)}
.fig .magma{fill:var(--magma)} .fig .lava{stroke:var(--magma);fill:none;stroke-linecap:round}
.fig .rk1{fill:var(--rock)} .fig .rk2{fill:var(--crust)} .fig .rk3{fill:var(--fill-a)}
.fig .glass{fill:var(--fill-a);opacity:.85} .fig .glass2{fill:var(--chip)} .fig .hole{fill:var(--sheet)} .fig .shadow{fill:var(--ink);opacity:.18}
.fig .flame{fill:#f39c34;opacity:.9} .fig .flameB{fill:#4f86e8} .fig .flameY{fill:#f4b63a}
.fig .sR{stroke:#e53935}.fig .sO{stroke:#fb8c00}.fig .sY{stroke:#fdd835}.fig .sG{stroke:#43a047}.fig .sB{stroke:#1e88e5}.fig .sI{stroke:#3949ab}.fig .sV{stroke:#8e24aa}
.fig .wP{stroke:#d64541;stroke-width:2.4} .fig .wN{stroke:#3d6fd6;stroke-width:2.4} .fig .wT{stroke:#3c9d4e;stroke-width:2.4;stroke-dasharray:8 4}
.fig .stem{stroke:var(--c3)} .fig .petal{fill:var(--c2);opacity:.75} .fig .sepal{fill:none;stroke:var(--c3);stroke-width:2.4} .fig .pollen{fill:var(--c4)}
/* nouveautés */
.starbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--hint-bg);color:var(--hint);border-radius:14px;padding:8px 16px;margin-top:8px}
.starbar b{font-family:var(--f-math);font-size:1.15em}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.quick .set{min-height:70px}.qi{display:flex;flex-direction:column;gap:2px;min-width:0}
.set[disabled]{opacity:.55;cursor:default}
.from{font-size:.75em;color:var(--margin);font-weight:600;margin-bottom:2px}
.star{color:var(--hint);font-weight:700}
@media (max-width:420px){.quick{grid-template-columns:1fr}}


/* niveaux, séries nouvelles, explications */
.lvtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 12px}
.lvtabs button{border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;padding:8px 4px;min-height:58px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.3}
.lvtabs button .stars{font-size:.75em;letter-spacing:1px}
.lvtabs button[aria-selected="true"]{border-color:var(--accent);background:var(--chip);color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.lvtabs button.empty{opacity:.5}
.set.gen{border-color:var(--accent);background:var(--chip)}
.lvtag{font-size:.85em;margin-inline-start:6px}
.details{display:flex;flex-direction:column;gap:10px}
.detail{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.detail h4{margin:0 0 4px;font-family:var(--f-disp);font-weight:700;color:var(--accent);font-size:1em;line-height:1.4}
.detail p{margin:0;flex:1;min-width:0;line-height:1.95;overflow-wrap:anywhere}
.wx{margin-bottom:12px}
.wxq{display:flex;gap:10px;align-items:flex-start}
.wxq p{margin:0;font-weight:600;line-height:1.9;flex:1;min-width:0;overflow-wrap:anywhere}
.wxn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-math);font-weight:700}
.wxs{margin:10px 0 0;padding-inline-start:1.4em;display:flex;flex-direction:column;gap:6px;line-height:1.9}
.wxs li{background:var(--ok-bg);border-radius:8px;padding:4px 10px}
@media (max-width:420px){.steps button{font-size:.66em}.lvtabs button{font-size:.85em}}

/* gap fill */
.gap{line-height:2.4;font-weight:600;margin:0 0 12px;overflow-wrap:anywhere}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:4.5em;min-height:40px;padding:0 10px;margin:2px 3px;border-bottom:2.5px solid var(--soft);border-radius:8px 8px 0 0;background:var(--paper);vertical-align:middle;font-weight:700}
.blank.next{border-bottom-color:var(--accent);background:var(--chip)}
.blank.filled{border:1.5px solid var(--accent);border-radius:10px;background:var(--sheet)}
.blank.good{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.blank.bad{border-color:var(--no);background:var(--no-bg);color:var(--no)}
/* series */
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;padding:12px 16px;min-height:60px;text-align:start}
.set b{font-family:var(--f-disp)}
.set span{font-size:.8em;color:var(--soft)}
.set .chip{font-size:.75em}
/* mic */
.lineTools{display:flex;gap:6px;flex:none}
.mic{border-color:var(--margin);color:var(--margin)}
.mic.on{background:var(--margin);color:var(--paper)}
.recpanel{margin-top:8px;background:var(--chip);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;line-height:1.7}
.recpanel audio{width:100%;max-width:100%;height:40px}
.recpanel .heard{font-size:.9em}
.recpanel .heard b{color:var(--accent)}
.recpanel .err{color:var(--no);font-size:.9em}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--margin);margin-inline-end:6px}
.keys li{flex-wrap:wrap}
.keys li .recpanel{flex-basis:100%}

/* math */
.m{font-family:var(--f-math);unicode-bidi:isolate;padding-inline:1px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;font-size:.88em;margin-inline:2px}
.fr>span:first-child{border-bottom:1.3px solid currentColor;padding-inline:3px}
.vec{display:inline-block;position:relative;padding-top:.32em;line-height:1;font-family:var(--f-math)}
.vec::before{content:"";position:absolute;top:.14em;left:.04em;right:.2em;border-top:1.3px solid currentColor}
.vec::after{content:"";position:absolute;top:-.01em;right:0;border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
@media (max-width:420px){.steps button{font-size:.72em}h2{font-size:1.2em}}

/* ===== أيقونات 3D ===== */
.ic{--s:44px;width:var(--s);height:var(--s);flex:none;position:relative;display:inline-grid;place-items:center;border-radius:30%;color:var(--g2);
 background:radial-gradient(130% 100% at 28% 12%,var(--g1) 0%,var(--g2) 78%);
 box-shadow:inset 0 2px 1px rgba(255,255,255,.55),inset 0 -4px 7px rgba(0,0,0,.22),0 7px 14px -6px var(--g2),0 2px 3px rgba(0,0,0,.14)}
.ic::after{content:"";position:absolute;left:9%;right:9%;top:4%;height:46%;border-radius:45% 45% 60% 60%/60% 60% 40% 40%;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0));pointer-events:none}
.ic svg{width:64%;height:64%;position:relative;z-index:1;filter:drop-shadow(0 2px 1.6px rgba(0,0,0,.3));overflow:visible}
.ict{position:relative;z-index:1;color:#fff;font-family:var(--f-math);font-weight:600;font-size:calc(var(--s)*.46);line-height:1;text-shadow:0 1.5px 1.5px rgba(0,0,0,.3)}
.mark{background:radial-gradient(130% 100% at 28% 12%,#3fd3a0,#0b6b52 78%);color:#fff;border-radius:12px;box-shadow:inset 0 2px 1px rgba(255,255,255,.5),inset 0 -3px 6px rgba(0,0,0,.25),0 6px 12px -6px #0b6b52}
.subj{position:relative;overflow:hidden;gap:8px;transition:transform .15s ease,box-shadow .15s ease;
 background:linear-gradient(165deg,color-mix(in srgb,var(--g1) 16%,var(--sheet)) 0%,var(--sheet) 55%);border-color:color-mix(in srgb,var(--g2) 22%,var(--line))}
.subj:hover{transform:translateY(-2px);box-shadow:0 10px 22px -12px var(--g2)}
.subj .ic{margin-bottom:4px}
.subj .bar i,.sbar i{background:linear-gradient(90deg,var(--g1),var(--g2))}
.shead{display:flex;align-items:center;gap:14px;margin:8px 0 6px;padding:14px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--g1) 22%,var(--sheet)),color-mix(in srgb,var(--g2) 8%,var(--sheet)))}
.shead h2{margin:0}
.shead p{margin:2px 0 0;color:var(--soft);font-size:.82em}
.lessons button{grid-template-columns:40px 1fr;align-items:center;gap:4px 12px}
.lessons .ic{--s:34px;border-radius:32%}
.lessons .chips{grid-column:2}
.lhead{display:flex;align-items:center;gap:12px}
.lhead .ic{--s:40px}
.steps button{gap:4px;padding:8px 2px;min-height:74px}
.steps button .ic{--s:34px;transition:transform .15s}
.steps button[aria-selected="true"] .ic{transform:scale(1.12)}
.steps button:not([aria-selected="true"]) .ic{filter:saturate(.75);opacity:.85}
.quick .set,.set.gen{justify-content:flex-start;gap:12px}
.quick .ic,.set .ic{--s:42px}
.set.gen{background:linear-gradient(135deg,color-mix(in srgb,#5fb0ff 14%,var(--sheet)),var(--sheet));border-color:color-mix(in srgb,#1f5fd0 35%,var(--line))}
.set .qi{flex:1}
.starbar{justify-content:flex-start;gap:12px}.starbar b{margin-inline-start:auto}
.starbar .ic{--s:36px}
.nav button{display:inline-flex;align-items:center;gap:8px;padding:6px 16px 6px 8px}
[dir="rtl"] .nav button{padding:6px 8px 6px 16px}
.nav .ic{--s:30px}
.lvtabs button{gap:4px}
.lvtabs .ic{--s:24px;margin:0 1px}.lvtabs .stars{display:flex;gap:3px}
.lvtabs button[aria-selected="true"]{border-color:var(--g2);box-shadow:0 0 0 1px var(--g2) inset;color:var(--ink);background:color-mix(in srgb,var(--g1) 14%,var(--sheet))}
.qhead{display:flex;align-items:center;gap:12px}.qhead h2{margin:0}
@media (prefers-reduced-motion:reduce){.subj,.steps .ic{transition:none}.subj:hover{transform:none}}
</style>

d:[["Écriture d'un nombre décimal","Chaque chiffre a un rang : unités, dizaines, centaines à gauche de la virgule ; dixièmes, centièmes, millièmes à droite. Dans `52,308` : 5 dizaines, 2 unités, 3 dixièmes, 0 centième, 8 millièmes. On peut ajouter ou enlever des zéros à la fin de la partie décimale : `4,5=4,50=4,500`."],
["Ranger des nombres décimaux","Ranger dans l'ordre croissant, c'est du plus petit au plus grand ; décroissant, du plus grand au plus petit. Astuce : écrire tous les nombres avec le même nombre de chiffres après la virgule. `2,3 ; 2,25 ; 2,305` devient `2,300 ; 2,250 ; 2,305`, donc `2,25 &lt; 2,3 &lt; 2,305`."],
["La division décimale","Pour diviser par un nombre entier, on pose la division et on place la virgule au quotient quand on « descend » le chiffre des dixièmes. Pour diviser par un décimal, on multiplie les deux nombres par 10, 100… pour que le diviseur devienne entier : `7,2÷0,4=72÷4=18`."],
["Calculer avec les priorités","Dans une expression sans parenthèses, on effectue d'abord les multiplications et divisions, puis les additions et soustractions, de gauche à droite. S'il y a des parenthèses, on commence par elles. Exemple : `(6+4)×3=10×3=30` mais `6+4×3=6+12=18`."]],

d:[["Fractions égales","Une fraction représente un partage. `[[3/4]]` d'une tarte : on coupe en 4 parts égales et on en prend 3. Si on coupe chaque part en deux, on a `[[6/8]]` : c'est la même quantité. Le produit en croix permet de vérifier : `[[a/b]]=[[c/d]]` si `a×d=b×c`."],
["Comparer des fractions","Avec le même dénominateur, la plus grande est celle qui a le plus grand numérateur. Avec le même numérateur, la plus grande est celle qui a le plus petit dénominateur (`[[1/3]] &gt; [[1/5]]`). Sinon, on les met au même dénominateur. Une fraction est plus grande que 1 quand son numérateur dépasse son dénominateur."],
["Additionner et soustraire","On cherche un dénominateur commun, de préférence le plus petit multiple commun. Pour `[[5/6]]−[[1/4]]` : 12 est multiple de 6 et de 4. `[[10/12]]−[[3/12]]=[[7/12]]`. On simplifie le résultat si possible."],

["Comparer des relatifs","Un positif est toujours plus grand qu'un négatif. Entre deux positifs, le plus grand est le plus loin de zéro. Entre deux négatifs, c'est l'inverse : le plus grand est le plus près de zéro. Pense au thermomètre : `−2 °C` est plus chaud que `−10 °C`."],
["Additionner","Imagine des gains (+) et des pertes (−). Gagner 4 puis perdre 9, c'est perdre 5 : `4+(−9)=−5`. Perdre 4 puis perdre 3, c'est perdre 7 : `(−4)+(−3)=−7`. La somme de deux opposés est nulle : `(−6)+6=0`."],

["Les puissances de 10","Elles servent à écrire les grands nombres. `10²=100`, `10³=1000`. Multiplier un nombre par `10ⁿ`, c'est décaler la virgule de `n` rangs vers la droite : `3,7×10³=3700`. La distance Terre–Soleil est d'environ `1,5×10⁸ km`."],

d:[["Nommer et mesurer un angle","Un angle est formé par deux demi-droites de même origine, le sommet. On le note avec trois lettres, le sommet au milieu : `∠ABC` a pour sommet `B`. Pour le mesurer, on place le centre du rapporteur sur le sommet et le zéro sur un côté, puis on lit la graduation sur l'autre côté."],
["Angles particuliers","Deux angles adjacents ont le même sommet, un côté commun, et sont de part et d'autre de ce côté. Quand deux droites se coupent, elles forment deux paires d'angles opposés par le sommet, égaux deux à deux, et les angles voisins sont supplémentaires."],
["La somme des angles d'un triangle","Si on découpe les trois coins d'un triangle en papier et qu'on les met côte à côte, ils forment un angle plat : 180°. On utilise ce résultat pour calculer un angle manquant. Dans un triangle rectangle, les deux angles aigus sont complémentaires."],
["Construire un triangle","Avec les trois longueurs : on trace un côté, puis deux arcs de cercle au compas depuis ses extrémités ; leur point d'intersection est le troisième sommet. Ce n'est possible que si le plus grand côté est plus petit que la somme des deux autres."]],
wx:[["`ABC` est isocèle en `A` et `∠BAC=40°`. Calcule `∠ABC`.",["Les angles à la base sont égaux : `∠ABC=∠ACB`.","Leur somme : `180−40=140°`.","Donc `∠ABC=140÷2=70°`."]]]},

/*5*/{t:"Droites dans le plan : parallélisme et perpendicularité",
k:["Deux droites <b>sécantes</b> se coupent en un seul point.","Deux droites <b>perpendiculaires</b> se coupent en formant un angle droit. On note `(D)⊥(L)`.","Deux droites <b>parallèles</b> ne se coupent jamais (ou sont confondues). On note `(D)∥(L)`.","Si deux droites sont parallèles à une même troisième, elles sont <b>parallèles</b> entre elles.","Si deux droites sont perpendiculaires à une même troisième, elles sont <b>parallèles</b> entre elles.","Si deux droites sont parallèles, toute perpendiculaire à l'une est <b>perpendiculaire à l'autre</b>."],
w:[["droites parallèles","مستقيمان متوازيان"],["droites perpendiculaires","مستقيمان متعامدان"],["sécantes","متقاطعان"],["équerre","مزواة"],["distance","مسافة"]],
x:[["q","`(D)⊥(L)` et `(M)⊥(L)`. Alors :",["(D)∥(M)","(D)⊥(M)","(D) et (M) sont sécantes"],0,"Deux perpendiculaires à la même droite sont parallèles."],
["q","`(D)∥(L)` et `(M)⊥(D)`. Alors :",["(M)⊥(L)","(M)∥(L)","(M)∥(D)"],0,"Une perpendiculaire à l'une de deux parallèles est perpendiculaire à l'autre."],
["vf","Deux droites sécantes ont un seul point commun.",true,"Elles se coupent en un point."],
["q","Le symbole `∥` signifie :",["parallèle","perpendiculaire","égal"],0,"`(D)∥(L)` : `(D)` est parallèle à `(L)`."],
["m","Relie.",[["⊥","perpendiculaires"],["∥","parallèles"],["un seul point commun","sécantes"]],"Retiens les symboles."]],
d:[["Positions de deux droites","Dans un plan, deux droites sont soit sécantes (un point commun), soit parallèles (aucun point commun ou toutes confondues). Les perpendiculaires sont un cas particulier de sécantes : elles forment quatre angles droits."],
["Tracer avec les instruments","Pour tracer la perpendiculaire à `(D)` passant par `A`, on pose un côté de l'angle droit de l'équerre sur `(D)` et on la fait glisser jusqu'à `A`. Pour tracer la parallèle, on trace d'abord une perpendiculaire à `(D)`, puis une perpendiculaire à celle-ci passant par `A`."],
["Les trois propriétés","Elles servent à démontrer. On écrit : « On sait que… (les données). Or… (la propriété). Donc… (la conclusion). » Exemple : on sait que `(D)⊥(L)` et `(M)⊥(L)`. Or deux droites perpendiculaires à une même droite sont parallèles. Donc `(D)∥(M)`."],
["Distance d'un point à une droite","C'est la longueur du plus court chemin du point à la droite : on la mesure sur la perpendiculaire à la droite passant par ce point. Exemple : la distance d'un point à un mur se mesure perpendiculairement au mur."]],
wx:[["`(D)∥(L)` et `(L)∥(M)`. Que dire de `(D)` et `(M)` ?",["On sait que `(D)∥(L)` et `(M)∥(L)`.","Or deux droites parallèles à une même droite sont parallèles.","Donc `(D)∥(M)`."]]]},

/*6*/{t:"Droites remarquables dans le triangle",
k:["La <b>médiatrice</b> d'un segment est la droite perpendiculaire à ce segment en son milieu. Tout point de la médiatrice est à égale distance des extrémités.","Les trois médiatrices d'un triangle se coupent au <b>centre du cercle circonscrit</b>.","La <b>hauteur</b> issue d'un sommet est la droite qui passe par ce sommet et est perpendiculaire au côté opposé. Les trois hauteurs se coupent à l'<b>orthocentre</b>.","La <b>bissectrice</b> d'un angle le partage en deux angles égaux. Les trois bissectrices se coupent au <b>centre du cercle inscrit</b>.","La <b>médiane</b> joint un sommet au milieu du côté opposé. Les trois médianes se coupent au <b>centre de gravité</b>.","Ces trois droites de même nature sont <b>concourantes</b> : elles passent par un même point."],
w:[["médiatrice","واسط"],["hauteur","ارتفاع"],["bissectrice","منصف زاوية"],["médiane","متوسط"],["cercle circonscrit","الدائرة المحيطة"],["concourantes","متلاقية"]],
x:[["q","La droite perpendiculaire à un segment en son milieu est :",["sa médiatrice","une hauteur","une bissectrice","une médiane"],0,"Définition de la médiatrice."],
["q","Les trois hauteurs d'un triangle se coupent en :",["l'orthocentre","le centre de gravité","le centre du cercle inscrit"],0,"Hauteurs → orthocentre."],
["q","La médiane issue de `A` dans `ABC` passe par :",["le milieu de [BC]","le milieu de [AB]","le pied de la hauteur"],0,"Elle joint un sommet au milieu du côté opposé."],
["vf","`M` est sur la médiatrice de `[AB]`, donc `MA=MB`.",true,"Tout point de la médiatrice est à égale distance de `A` et `B`."],
["m","Relie chaque droite à son point de concours.",[["médiatrices","centre du cercle circonscrit"],["bissectrices","centre du cercle inscrit"],["médianes","centre de gravité"],["hauteurs","orthocentre"]],"Revois le tableau du cours."]],
d:[["La médiatrice","Pour tracer la médiatrice de `[AB]` au compas : on trace deux arcs de même rayon (plus grand que la moitié de `AB`) centrés en `A` et en `B`, de chaque côté. La droite qui joint les deux points d'intersection est la médiatrice. Le cercle circonscrit passe par les trois sommets du triangle."],
["La hauteur","La hauteur est utile pour calculer l'aire : `Aire=[[base×hauteur/2]]`. Dans un triangle rectangle, deux hauteurs sont les côtés de l'angle droit, et l'orthocentre est le sommet de l'angle droit. Dans un triangle obtus, l'orthocentre est à l'extérieur."],
["La bissectrice","On peut la tracer au rapporteur (moitié de l'angle) ou au compas. Le cercle inscrit est à l'intérieur du triangle et touche les trois côtés."],
["La médiane","La médiane partage le triangle en deux triangles de même aire. Le centre de gravité est le point d'équilibre du triangle : un triangle en carton tient en équilibre sur la pointe d'un crayon placée en ce point."]],
wx:[["Dans `ABC`, comment trouver le centre du cercle qui passe par `A`, `B` et `C` ?",["Ce centre est à la même distance des trois sommets.","Il est donc sur les médiatrices de `[AB]`, `[BC]` et `[AC]`.","On trace deux médiatrices : leur point d'intersection `O` est le centre. Le rayon est `OA`."]]]},

/*7*/{t:"Développement et factorisation",
k:["<b>Développer</b>, c'est transformer un produit en somme : `k(a+b)=ka+kb` et `k(a−b)=ka−kb`.","<b>Factoriser</b>, c'est l'inverse : transformer une somme en produit en mettant le facteur commun : `ka+kb=k(a+b)`.","Exemple : `3(x+5)=3x+15` et `7x+7y=7(x+y)`.","<b>Réduire</b> : on regroupe les termes de même nature. `4x+3+2x−1=6x+2`.","On ne peut pas additionner `x` et un nombre : `2x+3` ne se réduit pas.","Calcul astucieux : `27×101=27×100+27×1=2727`."],
w:[["développer","نشر"],["factoriser","عمل"],["réduire","اختصر"],["facteur commun","العامل المشترك"],["expression littérale","تعبير حرفي"]],
x:[["q","Développe `4(x+3)`",["4x+12","4x+3","x+12","4x+7"],0,"`4×x+4×3=4x+12`."],
["q","Factorise `5a+5b`",["5(a+b)","5ab","10(a+b)","a+5b"],0,"Le facteur commun est 5."],
["q","Réduis `3x+2+5x−7`",["8x−5","8x+9","10x","3x−5"],0,"`3x+5x=8x` et `2−7=−5`."],
["vf","`2(x+4)=2x+4`",false,"Le 2 multiplie aussi le 4 : `2x+8`."],
["q","Calcule astucieusement `15×102`",["1530","1502","1520","1350"],0,"`15×100+15×2=1500+30=1530`."]],
d:[["Pourquoi utiliser des lettres ?","Une lettre représente un nombre qu'on ne connaît pas ou qui peut changer. Le périmètre d'un carré de côté `c` est `4×c`, qu'on écrit `4c`. On peut supprimer le signe `×` devant une lettre ou une parenthèse : `3×x=3x`, `2×(a+1)=2(a+1)`."],
["La distributivité","Un rectangle de largeur `k` et de longueur `a+b` peut se couper en deux rectangles : `k×a` et `k×b`. Son aire est donc `k(a+b)=ka+kb`. C'est la règle de distributivité de la multiplication sur l'addition."],
["Factoriser","On repère le facteur qui apparaît dans chaque terme, et on l'écrit devant une parenthèse. `6x+9=3×2x+3×3=3(2x+3)`. Pour vérifier, on redéveloppe."],
["Calculer la valeur d'une expression","On remplace la lettre par sa valeur. Si `x=2`, alors `3x+5=3×2+5=11`. Attention aux priorités et aux puissances : si `x=3`, `x²+1=9+1=10`."]],
wx:[["Développe puis réduis `A=3(x+2)+2(x−1)`.",["`3(x+2)=3x+6`.","`2(x−1)=2x−2`.","`A=3x+6+2x−2=5x+4`."]]]},

/*8*/{t:"Équations",
k:["Une <b>équation</b> est une égalité avec une inconnue, souvent `x`. <b>Résoudre</b>, c'est trouver la valeur de `x` qui rend l'égalité vraie.","On peut <b>ajouter ou soustraire</b> le même nombre aux deux membres : `x+7=12` donne `x=12−7=5`.","On peut <b>multiplier ou diviser</b> les deux membres par le même nombre non nul : `4x=20` donne `x=20÷4=5`.","Pour `ax+b=c` : on enlève `b`, puis on divise par `a`.","On <b>vérifie</b> en remplaçant `x` par la solution trouvée.","Pour un problème : choisir l'inconnue, écrire l'équation, résoudre, répondre par une phrase."],
w:[["équation","معادلة"],["inconnue","مجهول"],["solution","حل"],["membre","طرف"],["vérifier","تحقق"]],
x:[["q","Résous `x+9=15`",["6","24","−6","9"],0,"`x=15−9=6`."],
["q","Résous `3x=21`",["7","18","63","24"],0,"`x=21÷3=7`."],
["q","Résous `2x+5=17`",["6","11","8","12"],0,"`2x=17−5=12`. | `x=12÷2=6`."],
["vf","`x=4` est solution de `5x−3=17`.",true,"`5×4−3=20−3=17`."],
["q","Le double d'un nombre plus 4 fait 30. Ce nombre est :",["13","17","26","15"],0,"`2x+4=30`. | `2x=26`, `x=13`."]],
d:[["L'image de la balance","Une équation est comme une balance en équilibre : les deux plateaux pèsent la même chose. Si on enlève 3 kg de chaque côté, la balance reste en équilibre. De même, on peut faire la même opération aux deux membres d'une équation."],
["Les étapes de résolution","Pour `5x−4=21` : on ajoute 4 aux deux membres : `5x=25`. On divise par 5 : `x=5`. On vérifie : `5×5−4=21`. Juste !"],
["Mettre un problème en équation","« Karim a 3 fois plus de billes que Youssef. Ensemble ils en ont 48. » On appelle `x` le nombre de billes de Youssef. Karim en a `3x`. Ensemble : `x+3x=48`, donc `4x=48`, `x=12`. Youssef a 12 billes et Karim 36."]],
wx:[["Résous `4x+7=31` et vérifie.",["On enlève 7 : `4x=31−7=24`.","On divise par 4 : `x=24÷4=6`.","Vérification : `4×6+7=24+7=31`."]]]},

/*9*/{t:"Symétrie centrale",
k:["Le <b>symétrique</b> du point `M` par rapport au point `O` est le point `M′` tel que `O` est le <b>milieu</b> de `[MM′]`.","Le symétrique de `O` est `O` lui-même.","La symétrie centrale <b>conserve les longueurs</b> : `AB=A′B′`.","Elle <b>conserve les angles, les aires et l'alignement</b>.","Le symétrique d'une droite est une droite qui lui est <b>parallèle</b>.","Le point `O` est un <b>centre de symétrie</b> d'une figure si la figure est son propre symétrique (exemple : le parallélogramme, le cercle)."],
w:[["symétrie centrale","تماثل مركزي"],["symétrique","مماثل"],["centre de symétrie","مركز تماثل"],["milieu","منتصف"]],
x:[["q","`M′` est le symétrique de `M` par rapport à `O`. Alors :",["O est le milieu de [MM′]","M est le milieu de [OM′]","OM=2OM′"],0,"Définition."],
["vf","La symétrie centrale conserve les longueurs.",true,"Une figure et sa symétrique sont superposables."],
["q","Le symétrique d'une droite par rapport à un point est :",["une droite parallèle","une droite perpendiculaire","un cercle"],0,"Propriété du cours."],
["q","Laquelle de ces figures a un centre de symétrie ?",["le cercle","le triangle équilatéral","le triangle rectangle"],0,"Le centre du cercle est centre de symétrie."],
["q","`AB=5 cm`. Le symétrique `[A′B′]` mesure :",["5 cm","10 cm","2,5 cm"],0,"Les longueurs sont conservées."]],
d:[["Construire le symétrique d'un point","On trace la demi-droite `[MO)`. Avec le compas, on reporte la longueur `OM` de l'autre côté de `O`. On obtient `M′` avec `OM′=OM`. On peut aussi utiliser la règle graduée."],
["Symétrique d'une figure","Pour un segment, on construit les symétriques des deux extrémités. Pour un cercle, on construit le symétrique du centre, et on garde le même rayon. Pour un polygone, on construit les symétriques de tous les sommets."],
["Différence avec la symétrie axiale","La symétrie axiale (par rapport à une droite) est un pliage. La symétrie centrale est un demi-tour autour du point `O`. Dans les deux cas, les longueurs et les angles sont conservés."]],
wx:[["`O` est le milieu de `[AC]` et de `[BD]`. Que dire de `ABCD` ?",["`C` est le symétrique de `A` et `D` celui de `B` par rapport à `O`.","Donc `[CD]` est le symétrique de `[AB]` : `(CD)∥(AB)` et `CD=AB`.","Ses diagonales ont le même milieu : `ABCD` est un parallélogramme."]]]},

/*10*/{t:"Parallélogrammes et quadrilatères particuliers",
k:["Un <b>parallélogramme</b> est un quadrilatère dont les côtés opposés sont parallèles deux à deux.","Dans un parallélogramme : les côtés opposés ont <b>même longueur</b>, les diagonales ont le <b>même milieu</b>, les angles opposés sont <b>égaux</b>, deux angles consécutifs sont <b>supplémentaires</b>.","Le <b>rectangle</b> est un parallélogramme avec un angle droit. Ses diagonales ont la même longueur.","Le <b>losange</b> est un parallélogramme avec deux côtés consécutifs égaux. Ses diagonales sont perpendiculaires.","Le <b>carré</b> est à la fois rectangle et losange.","Le point d'intersection des diagonales est le <b>centre de symétrie</b>."],
w:[["parallélogramme","متوازي الأضلاع"],["losange","معين"],["rectangle","مستطيل"],["carré","مربع"],["diagonale","قطر"],["quadrilatère","رباعي"]],
x:[["q","Les diagonales d'un parallélogramme :",["ont le même milieu","sont toujours perpendiculaires","ont toujours la même longueur"],0,"C'est vrai pour tous les parallélogrammes."],
["q","Un parallélogramme dont les diagonales sont perpendiculaires est :",["un losange","un rectangle","un trapèze"],0,"Propriété du losange."],
["q","Dans le parallélogramme `ABCD`, `∠A=70°`. Alors `∠B=` :",["110°","70°","90°","20°"],0,"Deux angles consécutifs sont supplémentaires : `180−70`."],
["vf","Tout carré est un losange.",true,"Ses quatre côtés sont égaux."],
["m","Relie chaque figure à une propriété.",[["rectangle","diagonales de même longueur"],["losange","diagonales perpendiculaires"],["parallélogramme","diagonales de même milieu"]],"Revois le tableau du cours."]],
d:[["Reconnaître un parallélogramme","Un quadrilatère est un parallélogramme si l'une de ces conditions est vraie : ses côtés opposés sont parallèles ; ses diagonales ont le même milieu ; deux côtés opposés sont parallèles et de même longueur ; ses côtés opposés ont deux à deux la même longueur."],
["Rectangle, losange, carré","Le rectangle a 4 angles droits, le losange 4 côtés égaux, le carré les deux. Pour démontrer qu'un parallélogramme est un rectangle, il suffit d'un angle droit ou de diagonales de même longueur. Pour un losange, il suffit de deux côtés consécutifs égaux ou de diagonales perpendiculaires."],
["Périmètres et aires","Rectangle : `P=2(L+l)`, `A=L×l`. Carré : `P=4c`, `A=c²`. Losange : `A=[[D×d/2]]` (produit des diagonales divisé par 2). Parallélogramme : `A=base×hauteur`."]],
wx:[["`ABCD` est un parallélogramme avec `AC=BD`. Quelle est sa nature ?",["Un parallélogramme dont les diagonales ont la même longueur est un rectangle.","Donc `ABCD` est un rectangle."]]]},

/*11*/{t:"Sécante à deux droites parallèles et angles",
k:["Une droite `(Δ)` qui coupe deux droites `(D)` et `(L)` forme 8 angles.","Deux angles <b>alternes-internes</b> sont entre les deux droites, de part et d'autre de la sécante.","Deux angles <b>correspondants</b> sont du même côté de la sécante, l'un entre les droites, l'autre à l'extérieur, à la même « place ».","Si `(D)∥(L)`, alors les angles alternes-internes sont <b>égaux</b> et les angles correspondants sont <b>égaux</b>.","<b>Réciproque</b> : si deux angles alternes-internes (ou correspondants) sont égaux, alors les droites sont parallèles.","Deux angles intérieurs du même côté de la sécante sont supplémentaires si les droites sont parallèles."],
w:[["sécante","قاطع"],["alternes-internes","متبادلتان داخليا"],["correspondants","متناظرتان"],["réciproque","عكس"]],
x:[["q","`(D)∥(L)`. Un angle alterne-interne mesure 65°. L'autre mesure :",["65°","115°","25°","130°"],0,"Si les droites sont parallèles, les alternes-internes sont égaux."],
["q","Deux angles correspondants mesurent 72° et 72°. Alors les droites sont :",["parallèles","perpendiculaires","on ne peut rien dire"],0,"Réciproque : angles correspondants égaux ⇒ parallèles."],
["vf","Deux angles alternes-internes sont du même côté de la sécante.",false,"Ils sont de part et d'autre de la sécante."],
["q","`(D)∥(L)`. Un angle mesure 50°. L'angle intérieur du même côté de la sécante mesure :",["130°","50°","40°","90°"],0,"Ils sont supplémentaires : `180−50`."]],
d:[["Repérer les angles","Dessine deux droites et une sécante en forme de « Z » : les deux angles dans les coins du Z sont alternes-internes. En forme de « F » : les deux angles sous les barres du F sont correspondants. Ce petit truc aide à les reconnaître vite."],
["Calculer des angles","Si on connaît un seul des 8 angles et que les droites sont parallèles, on peut trouver tous les autres, en utilisant : angles opposés par le sommet égaux, angles adjacents sur une droite supplémentaires, alternes-internes et correspondants égaux."],
["Démontrer un parallélisme","On mesure ou on calcule deux angles alternes-internes ou correspondants. S'ils sont égaux, les droites sont parallèles. S'ils sont différents, elles ne le sont pas."]],
wx:[["`(D)∥(L)`, la sécante forme un angle de 110° avec `(D)`. Trouve les angles avec `(L)`.",["L'angle correspondant sur `(L)` mesure aussi 110°.","L'angle adjacent mesure `180−110=70°`.","Les angles avec `(L)` sont donc 110° et 70° (deux de chaque)."]]]},

/*12*/{t:"Cercle, disque",
k:["Le <b>cercle</b> de centre `O` et de rayon `r` est l'ensemble des points situés à la distance `r` de `O`.","Le <b>disque</b> est la surface délimitée par le cercle (avec l'intérieur).","Le <b>diamètre</b> est une corde qui passe par le centre : `d=2r`.","Une <b>corde</b> est un segment qui joint deux points du cercle. Un <b>arc</b> est une partie du cercle.","<b>Périmètre</b> du cercle : `P=2×π×r=π×d` avec `π≈3,14`.","<b>Aire</b> du disque : `A=π×r²`."],
w:[["cercle","دائرة"],["disque","قرص"],["rayon","شعاع"],["diamètre","قطر"],["corde","وتر"],["arc","قوس"]],
x:[["q","Un cercle a un rayon de 4 cm. Son diamètre mesure :",["8 cm","2 cm","16 cm","12,56 cm"],0,"`d=2×4=8`."],
["q","Périmètre d'un cercle de rayon 5 cm (`π≈3,14`) :",["31,4 cm","15,7 cm","78,5 cm","10 cm"],0,"`2×3,14×5=31,4`."],
["q","Aire d'un disque de rayon 2 cm (`π≈3,14`) :",["12,56 cm²","6,28 cm²","4 cm²","25,12 cm²"],0,"`3,14×2²=3,14×4=12,56`."],
["vf","Le diamètre est la plus grande corde du cercle.",true,"C'est la corde qui passe par le centre."],
["m","Relie.",[["rayon","du centre à un point du cercle"],["diamètre","corde qui passe par le centre"],["arc","partie du cercle"]],"Revois les définitions."]],
d:[["Le nombre π","Pour tous les cercles, le périmètre divisé par le diamètre donne le même nombre : `π`, environ `3,14`. On peut le vérifier avec une ficelle autour d'une assiette : la ficelle mesure un peu plus de 3 fois le diamètre."],
["Calculer un périmètre","On applique `P=π×d`. Si on connaît le rayon, on double d'abord : `r=3` donne `d=6` et `P≈3,14×6=18,84`. Le périmètre est une longueur (cm, m)."],
["Calculer une aire","On applique `A=π×r²` : on calcule d'abord `r²`, puis on multiplie par `π`. L'aire s'exprime en unités carrées (cm², m²). Attention à ne pas confondre avec le périmètre."]],
wx:[["Une roue a un diamètre de 70 cm. Quelle distance parcourt-elle en un tour ? (`π≈3,14`)",["La distance d'un tour est le périmètre de la roue.","`P=3,14×70=219,8 cm`.","La roue avance d'environ `2,2 m` par tour."]]]},

/*13*/{t:"Prisme et cylindre",
k:["Un <b>prisme droit</b> a deux bases polygonales superposables et parallèles, et des faces latérales rectangulaires.","Le <b>pavé droit</b> et le <b>cube</b> sont des prismes droits particuliers.","Un <b>cylindre</b> de révolution a deux bases qui sont des disques et une surface latérale qui, dépliée, est un rectangle.","<b>Aire latérale</b> = périmètre de la base × hauteur. Cylindre : `2×π×r×h`.","<b>Volume</b> = aire de la base × hauteur. Cylindre : `π×r²×h`.","Unités de volume : `1 dm³=1 L` et `1 m³=1000 L`."],
w:[["prisme droit","موشور قائم"],["cylindre","أسطوانة"],["base","قاعدة"],["face latérale","وجه جانبي"],["volume","حجم"],["patron","نشر"]],
x:[["q","Volume d'un pavé de 5 cm × 3 cm × 2 cm :",["30 cm³","10 cm³","31 cm³","15 cm³"],0,"`5×3×2=30`."],
["q","Les faces latérales d'un prisme droit sont des :",["rectangles","triangles","disques"],0,"Toujours des rectangles."],
["q","Un cylindre a `r=2 cm` et `h=5 cm`. Son volume (`π≈3,14`) :",["62,8 cm³","31,4 cm³","20 cm³","125,6 cm³"],0,"`3,14×2²×5=3,14×20=62,8`."],
["vf","`1 dm³=1 L`.",true,"Un litre est le volume d'un cube de 10 cm d'arête."],
["q","Un prisme à base triangulaire a combien de faces ?",["5","6","3","9"],0,"2 bases + 3 faces latérales."]],
d:[["Reconnaître un prisme","Un prisme droit tient « debout » sur une de ses bases. Sa base peut être un triangle, un rectangle, un hexagone… Le nombre de faces latérales est égal au nombre de côtés de la base. Ses arêtes latérales sont parallèles et ont la même longueur : la hauteur."],
["Le patron","Le patron d'un prisme droit est formé d'un grand rectangle (les faces latérales collées) et des deux bases. Le patron d'un cylindre : un rectangle dont la longueur est le périmètre du disque de base, et deux disques."],
["Calculer un volume","Pour tous les prismes et cylindres : `V=Aire de base×h`. Pour une boîte de conserve de rayon 4 cm et de hauteur 10 cm : `V=3,14×16×10≈502,4 cm³`, soit environ un demi-litre."]],
wx:[["Un aquarium a la forme d'un pavé de 60 cm × 30 cm × 40 cm. Combien de litres contient-il ?",["`V=60×30×40=72 000 cm³`.","`1 L=1 dm³=1000 cm³`.","`72 000÷1000=72 L`."]]]},

/*14*/{t:"Droite graduée, repère dans le plan",
k:["Sur une <b>droite graduée</b>, chaque point est repéré par un nombre : son <b>abscisse</b>. On écrit `A(3)`.","L'origine `O` a pour abscisse 0. À droite les positifs, à gauche les négatifs.","La <b>distance</b> entre `A(a)` et `B(b)` est la plus grande abscisse moins la plus petite.","L'abscisse du <b>milieu</b> de `[AB]` est `[[a+b/2]]`.","Un <b>repère</b> du plan est formé de deux droites graduées perpendiculaires : l'axe des <b>abscisses</b> (horizontal) et l'axe des <b>ordonnées</b> (vertical).","Un point a deux <b>coordonnées</b> : `M(x ; y)`. On lit d'abord l'abscisse, puis l'ordonnée."],
w:[["droite graduée","مستقيم مدرج"],["abscisse","أفصول"],["ordonnée","أرتوب"],["repère","معلم"],["coordonnées","زوج إحداثيات"],["origine","أصل"]],
x:[["q","Distance entre `A(−3)` et `B(5)` :",["8","2","−8","15"],0,"`5−(−3)=8`."],
["q","Abscisse du milieu de `[AB]` avec `A(2)` et `B(8)` :",["5","6","10","3"],0,"`(2+8)÷2=5`."],
["q","Le point `M(3 ; −2)` a pour ordonnée :",["−2","3","1","5"],0,"La deuxième coordonnée est l'ordonnée."],
["vf","Le point `(0 ; 4)` est sur l'axe des ordonnées.",true,"Son abscisse est 0."],
["q","Le point `(−2 ; −3)` est situé :",["en bas à gauche","en haut à droite","en bas à droite","en haut à gauche"],0,"Abscisse négative : à gauche. Ordonnée négative : en bas."]],
d:[["Lire une graduation","On commence par trouver la valeur d'un petit intervalle : si entre 0 et 1 il y a 5 intervalles, chacun vaut `0,2`. Ensuite on compte depuis l'origine. Attention : à gauche de zéro, on compte en négatif."],
["Placer un point dans un repère","Pour placer `A(4 ; −1)` : on part de l'origine, on avance de 4 vers la droite sur l'axe horizontal, puis on descend de 1 parallèlement à l'axe vertical. Pour lire les coordonnées d'un point, on fait le chemin inverse en traçant des parallèles aux axes."],
["Les quatre zones du repère","Les axes partagent le plan en quatre zones. En haut à droite : `x` et `y` positifs. En haut à gauche : `x` négatif, `y` positif. En bas à gauche : les deux négatifs. En bas à droite : `x` positif, `y` négatif."]],
wx:[["Sur une droite graduée, `A(−4)` et `B(6)`. Trouve `AB` et le milieu `I`.",["`AB=6−(−4)=10`.","Abscisse de `I` : `(−4+6)÷2=2÷2=1`.","Donc `AB=10` et `I(1)`."]]]},

/*15*/{t:"Proportionnalité",
k:["Deux grandeurs sont <b>proportionnelles</b> si on passe de l'une à l'autre en multipliant toujours par le même nombre : le <b>coefficient de proportionnalité</b>.","Dans un tableau de proportionnalité, les quotients de la 2e ligne par la 1re sont égaux.","<b>Quatrième proportionnelle</b> : avec le produit en croix. Si `[[a/b]]=[[c/x]]`, alors `x=[[b×c/a]]`.","Un <b>pourcentage</b> `t %` correspond au coefficient `[[t/100]]`. 20 % de 150 : `150×20÷100=30`.","<b>Échelle</b> d'une carte : distance sur la carte ÷ distance réelle (même unité). `1/100 000` : 1 cm représente 1 km.","<b>Vitesse moyenne</b> : `v=[[d/t]]` (distance ÷ durée)."],
w:[["proportionnalité","التناسبية"],["coefficient","معامل"],["pourcentage","نسبة مئوية"],["échelle","سلم"],["vitesse","سرعة"]],
x:[["q","3 kg coûtent 45 DH. 5 kg coûtent :",["75 DH","60 DH","90 DH","50 DH"],0,"Prix d'1 kg : `45÷3=15`. | `5×15=75`."],
["q","20 % de 80 :",["16","20","40","4"],0,"`80×20÷100=16`."],
["q","Sur une carte au `1/50 000`, 2 cm représentent :",["1 km","100 m","10 km","25 km"],0,"`2×50 000=100 000 cm=1 km`."],
["vf","Le tableau `2 → 6 ; 5 → 15 ; 7 → 20` est un tableau de proportionnalité.",false,"`6÷2=3`, `15÷5=3` mais `20÷7≠3`."],
["q","Une voiture roule 180 km en 2 h. Sa vitesse moyenne :",["90 km/h","360 km/h","180 km/h","45 km/h"],0,"`180÷2=90`."]],
d:[["Reconnaître la proportionnalité","Le prix payé est proportionnel à la quantité si le prix unitaire est fixe. L'âge et la taille d'un enfant ne sont pas proportionnels. Dans un tableau, on calcule le quotient de chaque colonne : s'ils sont tous égaux, il y a proportionnalité."],
["Calculer une quatrième proportionnelle","Méthode du retour à l'unité : 4 stylos coûtent 18 DH, donc 1 stylo coûte `18÷4=4,5 DH`, et 7 stylos `7×4,5=31,5 DH`. Méthode du produit en croix : `x=[[7×18/4]]=31,5`."],
["Pourcentages","Une réduction de 25 % sur 200 DH : `200×25÷100=50 DH` de réduction ; on paie `150 DH`. Pour trouver un pourcentage : `[[partie/total]]×100`. 12 élèves sur 30 : `12÷30×100=40 %`."]],
wx:[["Une recette pour 4 personnes demande 300 g de farine. Combien pour 6 personnes ?",["Pour 1 personne : `300÷4=75 g`.","Pour 6 personnes : `6×75=450 g`."]]]},

/*16*/{t:"Statistiques",
k:["La <b>population</b> est l'ensemble étudié (par exemple les élèves d'une classe). Le <b>caractère</b> est ce qu'on étudie (la note, la couleur préférée…).","L'<b>effectif</b> d'une valeur est le nombre de fois qu'elle apparaît. L'<b>effectif total</b> est la somme de tous les effectifs.","La <b>fréquence</b> d'une valeur = effectif ÷ effectif total. En pourcentage : × 100.","Le <b>mode</b> est la valeur qui a le plus grand effectif.","La <b>moyenne</b> = somme de toutes les valeurs ÷ effectif total.","On représente les données par un <b>diagramme en bâtons</b> ou un <b>diagramme circulaire</b>."],
w:[["effectif","حصيص"],["fréquence","تردد"],["caractère","ميزة"],["moyenne","المعدل"],["diagramme","مخطط"],["mode","المنوال"]],
x:[["q","Notes : 12, 15, 12, 10, 12. L'effectif de 12 est :",["3","12","5","1"],0,"12 apparaît 3 fois."],
["q","Même série : la fréquence de 12 en % :",["60 %","30 %","12 %","3 %"],0,"`3÷5=0,6=60 %`."],
["q","Moyenne de 8, 12, 10 :",["10","30","12","9"],0,"`(8+12+10)÷3=30÷3=10`."],
["q","Série : 2, 5, 5, 7, 5, 2. Le mode est :",["5","2","7","4,3"],0,"5 apparaît le plus souvent."],
["vf","La somme des fréquences fait toujours 100 %.",true,"Toutes les valeurs ensemble font la population entière."]],
d:[["Organiser les données","On range les données dans un tableau : une ligne pour les valeurs, une ligne pour les effectifs. On vérifie que la somme des effectifs est égale au nombre total de personnes interrogées."],
["Diagramme en bâtons","On place les valeurs sur l'axe horizontal et les effectifs sur l'axe vertical. La hauteur de chaque bâton est l'effectif. On voit tout de suite la valeur la plus fréquente : le mode."],
["Diagramme circulaire","Le disque entier représente 100 % (360°). L'angle d'un secteur est `fréquence×360°`. Une valeur qui représente 25 % occupe un quart du disque : 90°."],
["La moyenne","La moyenne résume une série par un seul nombre. Avec un tableau d'effectifs, on multiplie chaque valeur par son effectif, on additionne, puis on divise par l'effectif total."]],
wx:[["Notes : 10 (2 élèves), 14 (3 élèves), 16 (5 élèves). Calcule la moyenne.",["Effectif total : `2+3+5=10`.","Somme : `10×2+14×3+16×5=20+42+80=142`.","Moyenne : `142÷10=14,2`."]]]}
]});
