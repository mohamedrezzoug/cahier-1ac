SUBJ.push({id:"pc",lang:"fr",sym:"⚗",name:["الفيزياء والكيمياء","Physique-chimie"],
tip:["المفاهيم هنا كثيرة. جربوا مع الطفل أشياء بسيطة في البيت: ثلج يذوب، ماء يغلي، ملح يذوب في الماء، بطارية ومصباح صغير. التجربة الملموسة تساعد على فهم الدرس وتذكره.","Faites de petites expériences à la maison : un glaçon qui fond, de l'eau qui bout, du sel qui se dissout, une pile et une petite lampe. Le concret aide à comprendre et à retenir."],
L:[
/*0*/{s:"Chimie : la matière et l'eau",t:"L'eau dans la nature et dans notre vie",
k:["L'eau couvre environ <b>71 %</b> de la surface de la Terre. 97 % de cette eau est <b>salée</b> (mers et océans) ; moins de 3 % est douce.","Le corps humain contient environ <b>65 %</b> d'eau. Nous devons boire environ 1,5 L par jour.","L'eau est utilisée pour boire, l'hygiène, l'<b>agriculture</b> (la plus grande consommation) et l'<b>industrie</b>.","L'eau potable est une eau sans danger pour la santé : sans microbes, sans produits toxiques.","Le <b>sulfate de cuivre anhydre</b> (poudre blanche) devient <b>bleu</b> au contact de l'eau : c'est le test de reconnaissance de l'eau.","Le <b>cycle de l'eau</b> : évaporation, condensation (nuages), précipitations, ruissellement et infiltration."],
w:[["eau douce","ماء عذب"],["eau salée","ماء مالح"],["eau potable","ماء صالح للشرب"],["sulfate de cuivre anhydre","كبريتات النحاس اللامائية"],["cycle de l'eau","دورة الماء"],["évaporation","تبخر"]],
x:[["q","Le sulfate de cuivre anhydre devient … en présence d'eau.",["bleu","rouge","noir","incolore"],0,"Poudre blanche → bleue."],
["q","La plus grande partie de l'eau de la Terre est :",["salée","douce","gelée"],0,"97 % est dans les mers et océans."],
["vf","Le corps humain contient environ 65 % d'eau.",true,"Les deux tiers environ."],
["o","Range les étapes du cycle de l'eau.",["évaporation","condensation en nuages","précipitations","ruissellement et infiltration"],"Le soleil chauffe, la vapeur monte, puis la pluie tombe."],
["q","Le secteur qui consomme le plus d'eau est :",["l'agriculture","l'industrie","la maison"],0,"L'irrigation des cultures."]],
d:[["L'eau sur Terre","Vue de l'espace, la Terre est bleue : c'est la « planète bleue ». L'eau se trouve à l'état liquide (mers, rivières, nappes), solide (glaciers, banquise) et gazeux (vapeur dans l'air). L'eau douce disponible est très rare : il faut l'économiser."],
["L'eau et la vie","Tous les êtres vivants ont besoin d'eau. Dans notre corps, l'eau transporte les aliments et les déchets, et règle la température (la sueur). Un fruit comme la pastèque contient plus de 90 % d'eau."],
["Reconnaître l'eau","On met quelques grains de sulfate de cuivre anhydre blanc sur l'échantillon. S'ils deviennent bleus, l'échantillon contient de l'eau. Ce test montre l'eau dans le lait, une pomme, un jus… mais il ne dit pas si l'eau est pure."],
["Le cycle de l'eau","Le Soleil chauffe l'eau des mers : elle s'évapore. La vapeur monte, se refroidit et se condense en fines gouttelettes : les nuages. Les gouttes grossissent et tombent (pluie, neige). L'eau ruisselle vers les rivières ou s'infiltre dans le sol, puis retourne à la mer."]],
wx:[["Comment montrer qu'une tranche de concombre contient de l'eau ?",["On pose du sulfate de cuivre anhydre (blanc) sur la tranche.","Il devient bleu.","Conclusion : le concombre contient de l'eau."]]]},

/*1*/{t:"Les trois états de la matière",
k:["La matière existe sous trois états : <b>solide</b>, <b>liquide</b> et <b>gazeux</b>.","Un <b>solide</b> a une forme propre et un volume propre. On peut le saisir.","Un <b>liquide</b> n'a pas de forme propre : il prend la forme du récipient. Il a un volume propre. Sa surface libre au repos est <b>plane et horizontale</b>.","Un <b>gaz</b> n'a ni forme propre ni volume propre : il occupe tout l'espace offert. Il est <b>compressible</b> et <b>expansible</b>.","Les solides en poudre (sucre, sable) sont des solides : chaque grain a sa forme.","Exemples : glace (solide), eau (liquide), vapeur d'eau (gaz)."],
w:[["solide","صلب"],["liquide","سائل"],["gaz","غاز"],["forme propre","شكل خاص"],["compressible","قابل للانضغاط"],["surface libre","السطح الحر"]],
x:[["q","Quel état n'a pas de volume propre ?",["le gaz","le liquide","le solide"],0,"Le gaz occupe tout l'espace."],
["q","La surface libre d'un liquide au repos est :",["plane et horizontale","inclinée","courbée"],0,"On le vérifie en penchant un verre."],
["vf","Le sable est un liquide car il coule.",false,"Chaque grain est solide, avec sa propre forme."],
["m","Relie chaque corps à son état.",[["un caillou","solide"],["l'huile","liquide"],["l'air","gaz"]],"Pense à la forme et au volume."],
["q","On appuie sur le piston d'une seringue bouchée pleine d'air. L'air est :",["comprimé","détruit","transformé en liquide"],0,"Les gaz sont compressibles."]],
d:[["Les solides","Un solide garde sa forme quand on le déplace. Certains sont rigides (bois, fer), d'autres déformables (pâte à modeler, éponge) mais ils ont quand même une forme à eux. Les solides divisés (farine, sel) peuvent être versés, mais ce sont des solides."],
["Les liquides","Un liquide coule et prend la forme du récipient, mais son volume ne change pas : 1 L de jus reste 1 L dans une bouteille ou dans une casserole. Sa surface libre est horizontale, comme le niveau d'eau dans un aquarium."],
["Les gaz","Un gaz se répand partout : le parfum se sent dans toute la pièce. On peut le comprimer (pneu de vélo) et il peut se détendre. La plupart des gaz sont invisibles."],
["Le modèle des particules","La matière est faite de toutes petites particules. Dans un solide, elles sont serrées et ne bougent presque pas. Dans un liquide, elles sont proches mais glissent les unes sur les autres. Dans un gaz, elles sont éloignées et se déplacent dans tous les sens."]],
wx:[["Pourquoi peut-on comprimer l'air mais pas l'eau ?",["Dans l'air (gaz), les particules sont très éloignées : il y a de l'espace entre elles.","Dans l'eau (liquide), les particules se touchent presque.","On peut donc rapprocher les particules d'un gaz, pas celles d'un liquide."]]]},

/*2*/{t:"Le volume et la masse",
k:["Le <b>volume</b> est la place occupée par un corps. Unité légale : le <b>mètre cube (m³)</b>. On utilise aussi le litre : `1 L=1 dm³` et `1 mL=1 cm³`.","On mesure le volume d'un liquide avec une <b>éprouvette graduée</b> : l'œil au niveau du bas du ménisque.","Le volume d'un solide de forme quelconque se mesure par <b>déplacement d'eau</b> : `V=V₂−V₁`.","La <b>masse</b> est la quantité de matière. Unité : le <b>kilogramme (kg)</b>. On la mesure avec une <b>balance</b>.","`1 kg=1000 g` et `1 g=1000 mg`. `1 t=1000 kg`.","La masse d'un corps ne change pas quand il change de forme ou d'état."],
w:[["volume","حجم"],["masse","كتلة"],["éprouvette graduée","مخبار مدرج"],["balance","ميزان"],["ménisque","الهلالة"],["litre","لتر"]],
x:[["q","`1 L` =",["1000 mL","100 mL","10 mL","1 mL"],0,"`1 L=1000 mL`."],
["q","Pour mesurer le volume d'un liquide, on utilise :",["une éprouvette graduée","une balance","un thermomètre"],0,"La balance mesure la masse."],
["q","Eau : 50 mL. Après avoir plongé un caillou : 68 mL. Volume du caillou :",["18 mL","118 mL","68 mL","50 mL"],0,"`68−50=18 mL`."],
["vf","`1 kg=100 g`",false,"`1 kg=1000 g`."],
["q","L'unité légale de masse est :",["le kilogramme","le litre","le mètre cube"],0,"kg."]],
d:[["Les unités de volume","Le mètre cube est grand : c'est un cube de 1 m de côté (1000 L). Dans la vie courante, on utilise le litre (L), le centilitre (cL) et le millilitre (mL). `1 L=100 cL=1000 mL`. Une bouteille d'eau de 1,5 L contient 1500 mL."],
["Lire une éprouvette","On pose l'éprouvette sur une table horizontale. On place l'œil en face de la surface du liquide. La surface forme un creux, le ménisque : on lit la graduation au bas du ménisque. Il faut d'abord trouver la valeur d'une petite graduation."],
["Volume d'un solide","On verse de l'eau dans l'éprouvette et on lit `V₁`. On plonge le solide entièrement, sans éclaboussure. On lit `V₂`. Le volume du solide est `V₂−V₁`. Pour un solide de forme simple (cube, pavé), on peut aussi calculer : `V=L×l×h`."],
["La masse et la balance","Avec une balance électronique, on fait d'abord la tare (zéro) avec le récipient vide, puis on ajoute la matière. La masse ne dépend pas du lieu : un objet a la même masse sur la Terre et sur la Lune."]],
wx:[["Comment trouver la masse de 200 mL d'eau avec une balance ?",["On pèse le bécher vide : par exemple 80 g.","On pèse le bécher avec l'eau : 280 g.","Masse de l'eau : `280−80=200 g`."]]]},

/*3*/{t:"La masse volumique",
k:["La <b>masse volumique</b> d'une substance est la masse d'une unité de volume de cette substance : `ρ=[[m/V]]`.","Unités : `g/cm³` (ou `g/mL`), `kg/L`, `kg/m³`.","Masse volumique de l'eau : `ρ=1 g/cm³=1 kg/L=1000 kg/m³`.","Chaque substance pure a sa propre masse volumique : elle permet de l'<b>identifier</b>.","Un corps <b>flotte</b> sur l'eau si sa masse volumique est plus petite que celle de l'eau ; il <b>coule</b> si elle est plus grande.","On peut calculer `m=ρ×V` ou `V=[[m/ρ]]`."],
w:[["masse volumique","الكتلة الحجمية"],["flotter","يطفو"],["couler","يغرق"],["identifier","يتعرف"],["substance","مادة"]],
x:[["q","Un objet a une masse de 54 g et un volume de 20 cm³. Sa masse volumique :",["2,7 g/cm³","1080 g/cm³","74 g/cm³","0,37 g/cm³"],0,"`ρ=54÷20=2,7`."],
["q","La masse volumique de l'eau est :",["1 g/cm³","10 g/cm³","0,1 g/cm³"],0,"1 mL d'eau pèse 1 g."],
["vf","L'huile (`ρ=0,9 g/cm³`) flotte sur l'eau.",true,"`0,9 &lt; 1`."],
["q","Le fer a `ρ=7,8 g/cm³`. Dans l'eau, il :",["coule","flotte"],0,"`7,8 &gt; 1`."],
["q","Masse de 3 L d'eau :",["3 kg","300 g","30 kg","3 g"],0,"`1 L` d'eau ≈ `1 kg`."]],
d:[["Pourquoi la masse volumique ?","Un kilogramme de plumes et un kilogramme de fer ont la même masse, mais pas le même volume ! Pour comparer les matières, on regarde la masse d'un même volume, par exemple de 1 cm³ : c'est la masse volumique."],
["Calculer et convertir","On mesure la masse avec une balance et le volume avec une éprouvette, puis on divise. Attention aux unités : si `m` est en g et `V` en cm³, `ρ` est en g/cm³. `1 g/cm³=1000 kg/m³`."],
["Flotter ou couler","Un glaçon (`0,92 g/cm³`) flotte sur l'eau ; un caillou (`2,5 g/cm³`) coule. Dans un verre, l'huile reste au-dessus de l'eau. Le mercure (`13,6 g/cm³`) est si dense qu'un clou de fer flotte dessus."]],
wx:[["Un bloc d'aluminium de 50 cm³ a une masse de 135 g. Calcule sa masse volumique.",["`ρ=[[m/V]]=[[135/50]]`.","`ρ=2,7 g/cm³`.","Comme `2,7 &gt; 1`, l'aluminium coule dans l'eau."]]]},

/*4*/{t:"La pression et la pression atmosphérique",
k:["Un gaz enfermé appuie sur les parois de son récipient : il exerce une <b>pression</b>.","Quand on comprime un gaz, sa pression <b>augmente</b> ; quand on le détend, elle <b>diminue</b>.","On mesure la pression avec un <b>manomètre</b>. Unité légale : le <b>pascal (Pa)</b>. On utilise aussi le bar et l'hectopascal : `1 bar=100 000 Pa` et `1 hPa=100 Pa`.","L'air de l'atmosphère exerce une pression : la <b>pression atmosphérique</b>. Elle se mesure avec un <b>baromètre</b>.","Au niveau de la mer, elle vaut environ `1013 hPa`.","Elle <b>diminue</b> quand l'altitude augmente."],
w:[["pression","ضغط"],["manomètre","مانومتر"],["baromètre","بارومتر"],["pression atmosphérique","الضغط الجوي"],["pascal","باسكال"]],
x:[["q","L'appareil qui mesure la pression d'un gaz :",["le manomètre","le thermomètre","la balance"],0,"Mano = pression."],
["q","`1 bar` =",["100 000 Pa","1000 Pa","100 Pa"],0,"`1 bar=10⁵ Pa`."],
["vf","La pression atmosphérique augmente en montagne.",false,"Elle diminue avec l'altitude."],
["q","On comprime l'air d'une seringue bouchée. Sa pression :",["augmente","diminue","ne change pas"],0,"Moins de place → plus de chocs sur les parois."],
["q","Pression atmosphérique normale au niveau de la mer :",["1013 hPa","1013 Pa","100 hPa"],0,"Environ `1013 hPa`."]],
d:[["La pression d'un gaz","Les particules d'un gaz bougent sans arrêt et frappent les parois. Ces chocs créent la pression. Si on gonfle un ballon, on ajoute des particules : il y a plus de chocs, la pression augmente et le ballon se tend."],
["Mesurer une pression","Le manomètre indique la pression du gaz, par exemple dans un pneu (environ 2 bars). Le baromètre mesure la pression de l'air autour de nous ; les météorologues l'utilisent pour prévoir le temps (basse pression : souvent mauvais temps)."],
["L'effet de la pression atmosphérique","On ne la sent pas, mais elle est forte : un verre plein d'eau couvert d'une feuille et retourné ne se vide pas, car l'air pousse la feuille vers le haut. Quand on boit avec une paille, on diminue la pression dans la bouche et l'air pousse le jus vers le haut."]],
wx:[["Un pneu indique 2,2 bars. Convertis en pascals.",["`1 bar=100 000 Pa`.","`2,2×100 000=220 000 Pa`."]]]},

/*5*/{t:"La température et la chaleur",
k:["La <b>température</b> indique si un corps est chaud ou froid. Elle se mesure avec un <b>thermomètre</b>, en <b>degrés Celsius (°C)</b>.","Nos sensations (toucher) ne sont pas fiables pour connaître une température.","Repères : la glace fond à <b>0 °C</b> ; l'eau pure bout à <b>100 °C</b> (au niveau de la mer).","La <b>chaleur</b> est une énergie qui passe toujours du corps <b>chaud</b> vers le corps <b>froid</b>.","Quand un corps reçoit de la chaleur, sa température peut monter ou il peut changer d'état.","La température normale du corps humain est d'environ <b>37 °C</b>."],
w:[["température","درجة الحرارة"],["chaleur","الحرارة"],["thermomètre","محرار"],["degré Celsius","درجة سيلسيوس"],["thermique","حراري"]],
x:[["q","L'instrument qui mesure la température :",["le thermomètre","le baromètre","le manomètre"],0,"Thermo = chaleur."],
["q","L'eau pure bout à :",["100 °C","0 °C","37 °C","50 °C"],0,"Au niveau de la mer."],
["vf","La chaleur passe du corps froid vers le corps chaud.",false,"Toujours du chaud vers le froid."],
["q","Le thermomètre indique −4 °C. Il fait :",["4 degrés sous zéro","4 degrés au-dessus de zéro"],0,"Le signe − indique sous zéro."],
["q","Température normale du corps humain :",["37 °C","30 °C","40 °C"],0,"Au-dessus de 38 °C, on a de la fièvre."]],
d:[["Température ou chaleur ?","La température est un nombre qu'on lit sur un thermomètre. La chaleur est de l'énergie qui se déplace. Un grand seau d'eau tiède et une tasse d'eau tiède ont la même température, mais le seau contient plus d'énergie thermique."],
["Utiliser un thermomètre","On plonge le réservoir du thermomètre dans le liquide sans toucher le fond ni les parois, on attend que le liquide coloré se stabilise, et on lit en plaçant l'œil en face. On repère d'abord la valeur d'une graduation."],
["Les échanges de chaleur","Un thé chaud refroidit car il donne de la chaleur à l'air de la pièce. Un glaçon fond dans la main car la main lui donne de la chaleur. Les matériaux comme le bois et la laine laissent mal passer la chaleur : ce sont des isolants thermiques."]],
wx:[["On mélange de l'eau à 80 °C et de l'eau à 20 °C. Que se passe-t-il ?",["L'eau chaude cède de la chaleur à l'eau froide.","L'eau chaude refroidit, l'eau froide se réchauffe.","Le mélange atteint une température intermédiaire, entre 20 °C et 80 °C."]]]},

/*6*/{t:"Les changements d'état physique",
k:["<b>Fusion</b> : solide → liquide. <b>Solidification</b> : liquide → solide.","<b>Vaporisation</b> : liquide → gaz (évaporation lente ou ébullition). <b>Liquéfaction</b> : gaz → liquide.","<b>Sublimation</b> : solide → gaz. <b>Condensation</b> : gaz → solide.","Pour l'eau pure, la fusion et la solidification se font à <b>0 °C</b> ; l'ébullition à <b>100 °C</b>.","Pendant le changement d'état d'un corps pur, la température reste <b>constante</b> : c'est le <b>palier</b>.","Au cours d'un changement d'état, la <b>masse se conserve</b> mais le volume change (l'eau qui gèle augmente de volume)."],
w:[["fusion","انصهار"],["solidification","تجمد"],["vaporisation","تبخر"],["liquéfaction","تميع"],["sublimation","تسامي"],["palier","مرحلة ثبات"]],
x:[["q","La glace qui fond subit :",["une fusion","une solidification","une liquéfaction"],0,"Solide → liquide."],
["q","La buée sur une vitre froide est :",["une liquéfaction","une fusion","une sublimation"],0,"La vapeur d'eau (gaz) devient liquide."],
["vf","Pendant que la glace fond, la température de l'eau pure reste à 0 °C.",true,"C'est le palier de fusion."],
["vf","100 g de glace donnent 100 g d'eau liquide.",true,"La masse se conserve."],
["m","Relie chaque changement d'état.",[["liquide → solide","solidification"],["liquide → gaz","vaporisation"],["solide → gaz","sublimation"]],"Revois le schéma du cours."]],
d:[["Les six changements d'état","Entre les trois états, il y a six passages. En recevant de la chaleur : fusion, vaporisation, sublimation. En perdant de la chaleur : solidification, liquéfaction, condensation. Un bon moyen de les retenir est de dessiner un triangle avec les trois états aux sommets."],
["Évaporation et ébullition","L'évaporation est lente et se fait à toute température, à la surface (le linge qui sèche). L'ébullition est rapide : des bulles de vapeur se forment dans tout le liquide, à 100 °C pour l'eau pure."],
["Le palier de température","Si on chauffe de la glace et qu'on note la température chaque minute, on voit : la température monte jusqu'à 0 °C, reste à 0 °C tant qu'il reste de la glace (palier), puis remonte. Un palier montre que le corps est pur. L'eau salée n'a pas de palier net."],
["Masse et volume","Une bouteille pleine d'eau placée au congélateur peut éclater : en gelant, l'eau augmente de volume. Mais la masse reste la même. C'est pour cela que la glace flotte : même masse dans un volume plus grand."]],
wx:[["Pourquoi le linge sèche plus vite au soleil et au vent ?",["L'eau du linge s'évapore (vaporisation lente).","La chaleur du soleil accélère l'évaporation.","Le vent emporte la vapeur, ce qui l'accélère aussi."]]]},

/*7*/{t:"Les mélanges",
k:["Un <b>mélange homogène</b> : on ne distingue pas ses constituants à l'œil nu (eau sucrée, air). Un <b>mélange hétérogène</b> : on les distingue (eau + huile, eau boueuse).","L'<b>air</b> est un mélange homogène de gaz : environ 78 % de diazote et 21 % de dioxygène.","Dans une <b>solution</b>, le <b>soluté</b> est dissous dans le <b>solvant</b>. L'eau est un très bon solvant.","Une solution est <b>saturée</b> quand le soluté ne peut plus se dissoudre.","<b>Concentration massique</b> : `C=[[m/V]]` (masse de soluté ÷ volume de solution), en `g/L`.","Les boissons gazeuses contiennent un gaz dissous : le <b>dioxyde de carbone</b>."],
w:[["mélange homogène","خليط متجانس"],["mélange hétérogène","خليط غير متجانس"],["solution","محلول"],["soluté","مذاب"],["solvant","مذيب"],["concentration massique","التركيز الكتلي"]],
x:[["q","L'eau + huile est un mélange :",["hétérogène","homogène"],0,"On voit deux couches."],
["q","Dans l'eau salée, le soluté est :",["le sel","l'eau"],0,"L'eau est le solvant."],
["q","On dissout 10 g de sucre dans 0,5 L de solution. Concentration :",["20 g/L","5 g/L","10,5 g/L","0,05 g/L"],0,"`C=10÷0,5=20 g/L`."],
["vf","L'air est un mélange.",true,"Mélange de diazote, dioxygène et autres gaz."],
["q","Le gaz dissous dans les boissons gazeuses est :",["le dioxyde de carbone","le dioxygène","le diazote"],0,"CO₂."]],
d:[["Homogène ou hétérogène","On regarde le mélange : si on voit plusieurs parties (grains, couches, gouttes), il est hétérogène. Le lait paraît homogène mais au microscope on voit des gouttelettes de graisse. Une eau minérale limpide est homogène, même si elle contient des sels dissous."],
["La dissolution","Quand on met du sucre dans l'eau et qu'on remue, il disparaît à la vue : il se dissout. Il est toujours là (l'eau a un goût sucré) et la masse totale est conservée : 200 g d'eau + 10 g de sucre = 210 g de solution. Certaines matières ne se dissolvent pas : le sable est insoluble."],
["Concentration massique","Elle indique combien de grammes de soluté il y a dans un litre de solution. Une solution à 20 g/L contient 20 g de soluté par litre. Plus la concentration est grande, plus la solution est concentrée. Pour diluer, on ajoute du solvant."]],
wx:[["On dissout 6 g de sel dans de l'eau pour obtenir 250 mL de solution. Calcule `C`.",["On convertit : `250 mL=0,25 L`.","`C=[[m/V]]=[[6/0,25]]`.","`C=24 g/L`."]]]},

/*8*/{t:"Séparation des constituants d'un mélange – le corps pur",
k:["La <b>décantation</b> : on laisse reposer ; les particules solides tombent au fond.","La <b>filtration</b> : un filtre retient les particules solides ; le liquide qui passe s'appelle le <b>filtrat</b>.","On sépare deux liquides non miscibles (eau et huile) avec une <b>ampoule à décanter</b>.","L'<b>évaporation</b> du solvant permet de récupérer un solide dissous (sel des marais salants).","La <b>distillation</b> : on chauffe, la vapeur est refroidie et redevient liquide : on obtient de l'<b>eau distillée</b>.","Un <b>corps pur</b> est formé d'une seule substance. Il a des températures de changement d'état fixes."],
w:[["décantation","تصفيق"],["filtration","ترشيح"],["filtrat","رشاحة"],["distillation","تقطير"],["corps pur","جسم خالص"],["non miscibles","غير قابلين للامتزاج"]],
x:[["q","Pour séparer le sable de l'eau, on utilise :",["la filtration","la distillation de l'air","le thermomètre"],0,"Le filtre retient le sable."],
["q","Le liquide obtenu après filtration s'appelle :",["le filtrat","le résidu","le soluté"],0,"Ce qui passe à travers le filtre."],
["vf","La filtration permet de récupérer le sel dissous dans l'eau.",false,"Le sel dissous passe à travers le filtre. | Il faut évaporer l'eau."],
["o","Range les étapes pour obtenir une eau limpide à partir d'eau boueuse.",["décantation","filtration","distillation"],"On enlève d'abord les gros grains."],
["q","L'eau distillée est :",["un corps pur","un mélange homogène","un mélange hétérogène"],0,"Une seule substance : l'eau."]],
d:[["Séparer un mélange hétérogène","On commence par la décantation : on laisse reposer et on verse doucement le liquide du dessus. Puis on filtre avec un papier filtre dans un entonnoir. Le filtrat est limpide, mais il peut encore contenir des substances dissoutes."],
["Séparer un mélange homogène","Les substances dissoutes ne sont pas retenues par un filtre. Pour récupérer le solide, on évapore le solvant. Pour récupérer le solvant pur, on fait une distillation : on chauffe le mélange, la vapeur passe dans un réfrigérant où elle se refroidit et se liquéfie."],
["Le corps pur","Un corps pur ne contient qu'une seule substance : eau distillée, sel pur, fer. On le reconnaît à ses constantes : l'eau pure bout à 100 °C et gèle à 0 °C, avec des paliers bien nets. Un mélange n'a pas de palier net."]],
wx:[["Comment récupérer le sel d'une eau salée boueuse ?",["Décanter puis filtrer pour enlever la boue.","Le filtrat est de l'eau salée limpide.","Chauffer pour évaporer l'eau : le sel reste au fond."]]]},

/*9*/{t:"Le traitement des eaux",
k:["L'eau des rivières et des barrages n'est pas potable : elle contient des débris, de la boue et des microbes.","Dans une <b>station de traitement</b> : <b>dégrillage</b> (grilles), <b>décantation</b>, <b>filtration</b> (sable), puis <b>désinfection</b> (chlore ou ozone).","Les <b>eaux usées</b> (maisons, usines) sont traitées dans une <b>station d'épuration</b> avant d'être rejetées.","Le <b>dessalement</b> transforme l'eau de mer en eau douce.","Au Maroc, les barrages (comme Bin El Ouidane) stockent l'eau pour l'irrigation, l'eau potable et l'électricité.","Chacun doit <b>économiser l'eau</b> et ne pas la polluer."],
w:[["eau potable","ماء صالح للشرب"],["eaux usées","المياه العادمة"],["station d'épuration","محطة التصفية"],["désinfection","تعقيم"],["dessalement","تحلية"],["barrage","سد"]],
x:[["o","Range les étapes du traitement de l'eau potable.",["dégrillage","décantation","filtration","désinfection"],"Des plus grosses impuretés aux microbes."],
["q","La désinfection de l'eau se fait avec :",["le chlore ou l'ozone","le sable","le sel"],0,"Pour tuer les microbes."],
["vf","Les eaux usées peuvent être rejetées directement dans les rivières.",false,"Elles doivent passer par une station d'épuration."],
["q","Le dessalement sert à obtenir :",["de l'eau douce","de l'eau salée","du sel"],0,"À partir de l'eau de mer."]],
d:[["Rendre l'eau potable","L'eau pompée passe d'abord à travers des grilles qui retiennent les grands débris (branches, plastiques). Dans de grands bassins, la boue se dépose (décantation). L'eau traverse ensuite des filtres de sable. Enfin on ajoute du chlore ou de l'ozone pour tuer les microbes."],
["Épurer les eaux usées","Les eaux sales des maisons contiennent des déchets et des produits chimiques. La station d'épuration les nettoie avant de les rendre à la nature, pour protéger les rivières, la mer et les êtres vivants. Une partie peut être réutilisée pour arroser les espaces verts."],
["Économiser l'eau","Fermer le robinet en se brossant les dents, réparer les fuites, prendre une douche courte, arroser le soir : ces gestes simples économisent beaucoup d'eau, ressource rare au Maroc."]],
wx:[["Pourquoi ajoute-t-on du chlore à la fin du traitement ?",["Après la filtration, l'eau est limpide mais peut encore contenir des microbes invisibles.","Le chlore tue ces microbes.","L'eau devient potable : sans danger pour la santé."]]]},

/*10*/{s:"Physique : l'électricité",t:"Le circuit électrique simple",
k:["Un circuit électrique simple comprend : un <b>générateur</b> (pile), un <b>récepteur</b> (lampe, moteur), un <b>interrupteur</b> et des <b>fils de connexion</b>.","La lampe brille seulement si le circuit est <b>fermé</b> : une boucle sans coupure.","Si l'interrupteur est <b>ouvert</b>, le courant ne passe pas.","Chaque élément est un <b>dipôle</b> : il a deux bornes.","On représente le circuit par un <b>schéma</b> avec des <b>symboles normalisés</b>.","La pile a une borne <b>positive (+)</b> et une borne <b>négative (−)</b>."],
w:[["circuit électrique","دارة كهربائية"],["générateur","مولد"],["lampe","مصباح"],["interrupteur","قاطع التيار"],["dipôle","ثنائي القطب"],["borne","مربط"]],
x:[["q","Le générateur dans un circuit simple est :",["la pile","la lampe","l'interrupteur"],0,"Il fournit l'énergie électrique."],
["vf","La lampe brille si l'interrupteur est ouvert.",false,"Interrupteur ouvert = circuit ouvert, pas de courant."],
["q","Un dipôle a combien de bornes ?",["2","1","3","4"],0,"Di = deux."],
["m","Relie chaque élément à son rôle.",[["pile","fournit l'énergie"],["lampe","transforme l'énergie en lumière"],["interrupteur","ouvre ou ferme le circuit"]],"Revois les éléments du circuit."],
["q","Pour que le courant passe, le circuit doit être :",["fermé","ouvert","coupé"],0,"Une boucle complète."]],
d:[["Les éléments du circuit","La pile est le générateur : elle fournit l'énergie. La lampe est un récepteur : elle reçoit l'énergie et la transforme en lumière et chaleur. Les fils relient les éléments. L'interrupteur permet d'allumer ou d'éteindre sans débrancher."],
["Circuit ouvert, circuit fermé","Le courant ne circule que dans une boucle complète partant d'une borne de la pile et revenant à l'autre. Un fil débranché, une lampe dévissée ou un interrupteur ouvert coupent la boucle : le circuit est ouvert."],
["Le schéma normalisé","Pour dessiner rapidement un circuit, on utilise des symboles connus partout dans le monde : la pile (un grand trait et un petit trait), la lampe (un cercle avec une croix), l'interrupteur (un trait relevé s'il est ouvert). Les fils sont des traits droits, et on dessine le schéma en forme de rectangle."]],
wx:[["La lampe ne s'allume pas. Que vérifier ?",["Que la pile n'est pas usée.","Que la lampe est bien vissée et pas grillée.","Que les fils sont bien branchés et que l'interrupteur est fermé."]]]},

/*11*/{t:"Conducteurs et isolants",
k:["Un <b>conducteur</b> laisse passer le courant électrique : les <b>métaux</b> (cuivre, fer, aluminium), le graphite (mine de crayon), l'eau salée, le corps humain.","Un <b>isolant</b> ne laisse pas passer le courant : plastique, verre, bois sec, caoutchouc, air sec.","On teste un matériau en le plaçant dans un circuit avec une lampe : si elle brille, il est conducteur.","Les fils électriques ont un cœur en cuivre (conducteur) entouré de plastique (isolant).","La <b>chaîne conductrice</b> de la lampe : culot, plot, filament, plot, culot. Le verre et le plastique sont isolants.","L'eau du robinet conduit un peu le courant : il est dangereux de toucher un appareil électrique avec les mains mouillées."],
w:[["conducteur","موصل"],["isolant","عازل"],["métal","فلز"],["filament","السلك الرفيع"],["culot","كعب المصباح"]],
x:[["q","Lequel est un conducteur ?",["le cuivre","le plastique","le verre","le bois sec"],0,"Les métaux sont conducteurs."],
["q","Le plastique autour des fils sert à :",["isoler","conduire","éclairer"],0,"Il protège contre les chocs électriques."],
["vf","Le corps humain est un isolant.",false,"Il conduit le courant : c'est pour cela que l'électricité est dangereuse."],
["m","Classe.",[["aluminium","conducteur"],["caoutchouc","isolant"]],"Métaux : conducteurs."],
["q","On place une gomme dans le circuit et la lampe ne brille pas. La gomme est :",["isolante","conductrice"],0,"Le courant ne passe pas."]],
d:[["Tester un matériau","On coupe le circuit et on place le matériau entre deux pinces crocodiles. Si la lampe s'allume, le matériau est conducteur. Si elle reste éteinte, il est isolant. Attention : on ne fait jamais ce test sur le secteur (prise de courant)."],
["Utilisation des conducteurs et isolants","Les conducteurs servent à transporter le courant : fils, câbles, bornes. Les isolants protègent : gaines des fils, poignées des outils d'électricien, prises en plastique."],
["Dans la lampe","Le courant entre par le plot du culot, traverse le filament très fin qui chauffe et brille, puis ressort par le culot. Si le filament est cassé (lampe grillée), la chaîne conductrice est coupée."]],
wx:[["Pourquoi les électriciens portent-ils des gants en caoutchouc ?",["Le caoutchouc est un isolant.","Il empêche le courant de passer à travers le corps.","Il protège l'électricien de l'électrocution."]]]},

/*12*/{t:"Montages en série et en parallèle",
k:["Dans un montage <b>en série</b>, les dipôles forment <b>une seule boucle</b>.","En série : si une lampe est grillée ou dévissée, <b>toutes</b> les lampes s'éteignent.","En série : plus on ajoute de lampes, plus elles brillent <b>faiblement</b>.","Dans un montage <b>en dérivation (parallèle)</b>, il y a <b>plusieurs boucles</b> ; chaque lampe est branchée directement aux bornes du générateur.","En parallèle : si une lampe est dévissée, les autres <b>continuent de briller</b>.","Dans une maison, les appareils sont branchés <b>en parallèle</b>."],
w:[["en série","على التوالي"],["en dérivation","على التوازي"],["boucle","حلقة"],["nœud","عقدة"],["branche","فرع"]],
x:[["q","Dans une maison, les lampes sont montées :",["en parallèle","en série"],0,"Chacune fonctionne indépendamment."],
["vf","En série, si on dévisse une lampe, les autres restent allumées.",false,"La boucle unique est coupée : tout s'éteint."],
["q","Un montage avec une seule boucle est :",["en série","en parallèle"],0,"Définition."],
["q","En série, on ajoute une troisième lampe. L'éclat des lampes :",["diminue","augmente","ne change pas"],0,"Elles se partagent l'énergie."],
["m","Relie.",[["une seule boucle","série"],["plusieurs boucles","dérivation"],["point où se rejoignent 3 fils","nœud"]],"Revois les définitions."]],
d:[["Le montage en série","Les lampes sont l'une après l'autre, comme les wagons d'un train. Le courant traverse toutes les lampes. Un seul interrupteur commande toutes les lampes. C'est le cas de certaines guirlandes : une ampoule grillée éteint toute la guirlande."],
["Le montage en dérivation","Chaque lampe a sa propre boucle avec la pile. Les points où les fils se séparent sont des nœuds. Chaque lampe brille comme si elle était seule. On peut mettre un interrupteur dans chaque branche pour commander chaque lampe séparément."],
["Reconnaître un montage","On suit le chemin du courant avec le doigt à partir de la borne + : si on peut passer par toutes les lampes sans jamais avoir à choisir de chemin, le montage est en série. S'il y a des carrefours (nœuds), il y a des dérivations."]],
wx:[["Pourquoi n'installe-t-on pas les lampes d'une maison en série ?",["En série, une lampe grillée éteindrait toute la maison.","Toutes les lampes devraient être allumées en même temps.","En parallèle, chaque lampe fonctionne seule, avec son interrupteur."]]]},

/*13*/{t:"Le courant électrique : sens, intensité et tension",
k:["Par convention, le courant circule de la borne <b>+</b> vers la borne <b>−</b> à l'extérieur du générateur.","Une <b>diode</b> ne laisse passer le courant que dans un seul sens. Un moteur change de sens de rotation si on inverse les bornes de la pile.","L'<b>intensité</b> du courant se mesure avec un <b>ampèremètre</b> branché <b>en série</b>. Unité : l'<b>ampère (A)</b>. `1 A=1000 mA`.","La <b>tension</b> se mesure avec un <b>voltmètre</b> branché <b>en dérivation</b>. Unité : le <b>volt (V)</b>.","La tension d'une pile est inscrite dessus : `1,5 V`, `4,5 V`, `9 V`.","Piles <b>en série</b> (+ relié à −) : les tensions s'<b>additionnent</b>."],
w:[["intensité","الشدة"],["tension","التوتر"],["ampèremètre","أمبيرمتر"],["voltmètre","فولطمتر"],["diode","صمام ثنائي"],["sens conventionnel","المنحى الاصطلاحي"]],
x:[["q","L'intensité du courant se mesure avec :",["un ampèremètre","un voltmètre","un thermomètre"],0,"Ampère → ampèremètre."],
["q","Le voltmètre se branche :",["en dérivation","en série"],0,"Aux bornes du dipôle."],
["q","Trois piles de 1,5 V en série donnent :",["4,5 V","1,5 V","3 V","0,5 V"],0,"`1,5+1,5+1,5=4,5`."],
["q","`250 mA` =",["0,25 A","2,5 A","25 A"],0,"`250÷1000=0,25`."],
["vf","À l'extérieur de la pile, le courant va de la borne − vers la borne +.",false,"Sens conventionnel : de + vers −."]],
d:[["Le sens du courant","On ne voit pas le courant, mais on observe ses effets. Une diode s'allume dans un sens et pas dans l'autre. Un moteur tourne dans un sens, puis dans l'autre si on retourne la pile. On a choisi de dire que le courant va de + vers − dans le circuit extérieur."],
["Mesurer l'intensité","On ouvre le circuit et on y insère l'ampèremètre, comme une lampe de plus : il est en série. Dans un circuit en série, l'intensité est la même partout. On commence par le plus grand calibre."],
["Mesurer la tension","Le voltmètre se branche aux deux bornes du dipôle, sans ouvrir le circuit : en dérivation. La tension aux bornes d'une pile neuve de 4,5 V est d'environ 4,5 V. Aux bornes d'un fil, la tension est presque nulle."],
["Associer des piles","En reliant le + d'une pile au − de la suivante, les tensions s'ajoutent : c'est ce qu'on fait dans une télécommande avec 2 piles de 1,5 V (3 V). Si on inverse une pile, sa tension se retranche."]],
wx:[["Une lampe porte l'indication 6 V. Quelles piles de 1,5 V utiliser ?",["Il faut une tension totale de 6 V.","`6÷1,5=4`.","On met 4 piles de 1,5 V en série."]]]},

/*14*/{t:"Les résistances électriques",
k:["Une <b>résistance</b> (ou conducteur ohmique) est un dipôle qui s'oppose au passage du courant.","Unité de la résistance : l'<b>ohm (Ω)</b>. `1 kΩ=1000 Ω`.","On mesure une résistance avec un <b>ohmmètre</b>, hors du circuit.","Plus la résistance est grande, plus l'<b>intensité</b> du courant est <b>faible</b> (une lampe en série brille moins).","La valeur d'une résistance est indiquée par des <b>anneaux de couleur</b> : noir 0, marron 1, rouge 2, orange 3, jaune 4, vert 5, bleu 6, violet 7, gris 8, blanc 9.","Lecture : 1er chiffre, 2e chiffre, puis le nombre de zéros. Rouge-violet-marron = `27` suivi d'un zéro = `270 Ω`."],
w:[["résistance","مقاومة"],["ohm","أوم"],["ohmmètre","أوممتر"],["code des couleurs","رمز الألوان"],["anneau","حلقة"]],
x:[["q","L'unité de résistance est :",["l'ohm","le volt","l'ampère"],0,"Symbole Ω."],
["q","Couleurs : marron, noir, rouge. Valeur :",["1000 Ω","102 Ω","120 Ω","10 Ω"],0,"`1`, `0`, puis 2 zéros : `1000 Ω`."],
["vf","Ajouter une résistance en série avec une lampe la fait briller plus fort.",false,"La résistance diminue l'intensité : la lampe brille moins."],
["q","`4,7 kΩ` =",["4700 Ω","47 Ω","470 Ω"],0,"`4,7×1000`."],
["q","Pour mesurer une résistance, on utilise :",["un ohmmètre","un voltmètre","un ampèremètre"],0,"Ohm → ohmmètre."]],
d:[["À quoi sert une résistance ?","Dans les appareils électroniques, les résistances limitent le courant pour protéger les autres composants, comme une diode électroluminescente (DEL) qui grillerait sans résistance. Elles transforment une partie de l'énergie électrique en chaleur."],
["Lire le code des couleurs","On tient la résistance avec l'anneau doré ou argenté à droite. Les deux premiers anneaux donnent les deux chiffres ; le troisième donne le nombre de zéros à ajouter. Jaune-violet-rouge : 4, 7, deux zéros → `4700 Ω=4,7 kΩ`. Un truc pour retenir l'ordre des couleurs : elles suivent à peu près l'arc-en-ciel après noir, marron, rouge."],
["Mesurer à l'ohmmètre","On utilise un multimètre réglé sur Ω, branché aux deux bornes de la résistance sortie du circuit. On choisit un calibre plus grand que la valeur attendue."]],
wx:[["Trouve la valeur d'une résistance : orange, orange, marron.",["Orange = 3, orange = 3 : les chiffres sont `33`.","Marron = 1 : on ajoute un zéro.","Valeur : `330 Ω`."]]]},

/*15*/{t:"Le court-circuit et les dangers de l'électricité",
k:["Un <b>court-circuit</b> se produit quand deux bornes d'un dipôle sont reliées par un fil de résistance très faible : le courant passe par le fil au lieu du dipôle.","Lampe court-circuitée : elle s'<b>éteint</b>. Pile court-circuitée : le courant devient très fort, la pile <b>chauffe</b> et s'use : c'est dangereux.","Le <b>fusible</b> ou le <b>disjoncteur</b> coupe le courant en cas de court-circuit.","Le courant du secteur (<b>220 V</b>) peut être <b>mortel</b> : électrisation, électrocution, brûlures.","Il ne faut jamais introduire un objet dans une prise, toucher un appareil avec les mains mouillées ou tirer un appareil par le fil.","Pendant un orage, on s'éloigne des arbres isolés et on débranche les appareils. Les éclairs sont de grandes étincelles électriques."],
w:[["court-circuit","دارة قصيرة"],["fusible","منصهر"],["disjoncteur","فاصل كهربائي"],["électrocution","صعق كهربائي"],["secteur","التيار القطاعي"]],
x:[["q","Une lampe court-circuitée :",["s'éteint","brille plus fort","explose toujours"],0,"Le courant passe par le fil."],
["vf","Court-circuiter une pile est sans danger.",false,"La pile chauffe et peut provoquer un incendie."],
["q","Le dispositif qui coupe le courant en cas de court-circuit :",["le fusible","la lampe","le voltmètre"],0,"Il fond et ouvre le circuit."],
["q","La tension du secteur au Maroc est d'environ :",["220 V","4,5 V","12 V"],0,"Elle est dangereuse."],
["m","Relie.",[["mains mouillées","ne pas toucher les appareils"],["orage","s'éloigner des arbres isolés"],["prise","ne rien y introduire"]],"Les gestes de sécurité."]],
d:[["Comprendre le court-circuit","Le courant prend toujours le chemin le plus facile. Si un fil relie directement les deux bornes de la lampe, le courant passe par le fil : la lampe s'éteint, mais les autres lampes en série brillent plus. Si le fil relie les bornes de la pile, le courant est très intense : les fils chauffent, l'isolant peut fondre et prendre feu."],
["Se protéger","Le fusible contient un fil fin qui fond si le courant est trop fort : le circuit s'ouvre. Le disjoncteur fait la même chose et peut être réarmé. Dans une maison, la prise de terre et le disjoncteur différentiel protègent les personnes."],
["Les éclairs","Pendant un orage, des charges électriques s'accumulent dans les nuages. L'éclair est une énorme étincelle entre un nuage et le sol ; le tonnerre est le bruit qu'elle fait. Le paratonnerre guide la foudre vers le sol sans danger."]],
wx:[["Dans un circuit avec deux lampes en série, on relie les bornes de L1 par un fil. Que se passe-t-il ?",["L1 est court-circuitée : le courant passe par le fil, L1 s'éteint.","L2 reste dans le circuit.","L2 brille plus fort car le courant est plus intense."]]]}
]});
